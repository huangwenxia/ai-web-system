<script>
// 挂载 Vue + EP；setup() 内含与 DS 同源的全部 mock 数据（dsTableData / i18nLangs / radioPlans 等）
const { createApp, ref, reactive, computed } = Vue;
const app = Vue.createApp({
  setup() {

    const isDark = ref(false);
    const lang = ref('zh');
    const active = ref('intro');

    // ── Motion Library replay：点击 Replay 让 :key 重建，CSS animation 重放 ──
    const replayKey = ref(0);
    function replay() { replayKey.value++; }

    // ── I18nField 生产组件用状态（mock 数据 + 当前激活 tab） ──
    // 4 种语言：zh-CN / en / ja / ko；每种都有"套餐名称 + 描述"两个字段
    const i18nLangs = [
      { code: 'zh', emoji: '🇨🇳', label: '中文',   short: '中',   required: true  },
      { code: 'en', emoji: '🇺🇸', label: 'English', short: 'EN',  required: true  },
      { code: 'ja', emoji: '🇯🇵', label: '日本語',  short: '日',   required: false },
      { code: 'ko', emoji: '🇰🇷', label: '한국어',  short: '韩',   required: false },
    ];
    const i18nValues = reactive({
      zh: { name: '企业旗舰版',         desc: '为大客户准备的全功能套餐' },
      en: { name: 'Enterprise Ultimate', desc: 'Full-feature plan for enterprise customers' },
      ja: { name: 'エンタープライズプロ', desc: '' },
      ko: { name: '',                   desc: '' },
    });
    // 当前激活的语言 tab
    const i18nFldATab = ref('zh');
    function i18nIsFilled(code, field) {
      return (i18nValues[code]?.[field] || '').trim().length > 0;
    }
    function i18nFilledCount(field) {
      return i18nLangs.filter(l => i18nIsFilled(l.code, field)).length;
    }
    function i18nRequiredMissing(field) {
      return i18nLangs.filter(l => l.required && !i18nIsFilled(l.code, field)).length;
    }

    // ── Radio 现代化评审用状态 ──
    // 4 个选项（套餐），4 版各自独立 ref，互不影响
    const radioPlans = [
      { code: 'basic',      name: '基础版',   desc: '100K 调用 / 月' },
      { code: 'pro',        name: '专业版',   desc: '1M 调用 / 月' },
      { code: 'enterprise', name: '企业版',   desc: '10M 调用 + SLA' },
      { code: 'ultimate',   name: '旗舰版',   desc: '定制 + 专属支持' },
    ];
    const radioModA = ref('pro');
    const radioModB = ref('enterprise');
    const radioModC = ref('pro');
    const radioModD = ref('enterprise');

    // ── DataTable mock 数据（演示用） ──
    const dsTableData = ref([
      { name: '蚂蚁金服 - AI 平台', plan: '企业旗舰', planColor: 'badge-purple', status: 'Active', statusBadge: 'badge-green', usagePct: 62, usageColor: 'usage-bar__fill--primary', expire: '2026-06-30', bgIdx: 1 },
      { name: '字节跳动 - 视频生成', plan: '企业版', planColor: 'badge-blue', status: 'Pending', statusBadge: 'badge-orange', usagePct: 88, usageColor: 'usage-bar__fill--warning', expire: '2026-05-12', bgIdx: 2 },
      { name: '阿里云 - 智能客服', plan: '专业版', planColor: 'badge-green', status: 'Active', statusBadge: 'badge-green', usagePct: 45, usageColor: 'usage-bar__fill--primary', expire: '2026-05-14', bgIdx: 3 },
      { name: '京东物流 - 仓储 AI', plan: '专业版', planColor: 'badge-green', status: 'Active', statusBadge: 'badge-green', usagePct: 28, usageColor: 'usage-bar__fill--success', expire: '2026-05-16', bgIdx: 4 },
      { name: '腾讯云 - 内容审核', plan: '企业版', planColor: 'badge-blue', status: 'Active', statusBadge: 'badge-green', usagePct: 100, usageColor: 'usage-bar__fill--danger', expire: '2026-08-21', bgIdx: 5 },
      { name: '美团 - 配送调度', plan: '基础版', planColor: 'badge-muted', status: 'Inactive', statusBadge: 'badge-muted', usagePct: 12, usageColor: 'usage-bar__fill--success', expire: '2026-12-01', bgIdx: 6 },
    ]);

        // — stubs for DS-specific helpers that the return references —
    const toggleTheme = () => {};
    const toggleLang  = () => {};

    return { isDark, lang, active, toggleTheme, toggleLang, dsTableData, replayKey, replay, i18nLangs, i18nValues, i18nFldATab, i18nIsFilled, i18nFilledCount, i18nRequiredMissing, radioPlans, radioModA, radioModB, radioModC, radioModD, ElementPlusIconsVue: window.ElementPlusIconsVue }
  }
});
for (const [k, c] of Object.entries(ElementPlusIconsVue || {})) {
  app.component(k, c);
}
app.use(ElementPlus);
// 抑制 Vue 对 v-for / v-model 中未定义变量的警告，避免 demo 数据缺失时整体崩溃
app.config.warnHandler = () => {};
try { app.mount('#app'); } catch (e) { console.warn('[demo mount]', e.message); }
lucide.createIcons && lucide.createIcons();
</script>
