<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f4f5; color: #18181b; font-family: Arial, sans-serif; }
      .fixture-page { width: 720px; margin: 32px auto; padding: 24px; border: 1px solid rgb(212, 212, 216); border-radius: 12px; background: rgb(255, 255, 255); }
      .fixture-title { margin: 0 0 20px; font-size: 26px; font-weight: 600; line-height: 32px; letter-spacing: 0; }
      .fixture-cards { display: flex; gap: 16px; }
      .fixture-card { display: flex; flex: 1 1 0; align-items: center; gap: 10px; min-height: 88px; padding: 14px; border: 1px solid rgb(228, 228, 231); border-radius: 12px; background-color: rgb(250, 250, 250); background-image: none; box-shadow: none; }
      .fixture-icon { width: 20px; height: 20px; fill: none; stroke: rgb(39, 39, 42); stroke-width: 1.5; }
      .fixture-value { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; line-height: 24px; }
    </style>
  </head>
  <body>
    <main class="fixture-page">
      <h1 class="fixture-title">Revenue overview</h1>
      <section class="fixture-cards">
        <article class="fixture-card">
          <svg class="fixture-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          <span class="fixture-value">1,234.56</span>
        </article>
      </section>
    </main>
  </body>
</html>
