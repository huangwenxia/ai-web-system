<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f4f5; color: #18181b; font-family: Arial, sans-serif; }
      .fixture-page { width: 720px; margin: 32px auto; padding: 24px; border: 1px solid rgb(212, 212, 216); border-radius: 12px; background: rgb(255, 255, 255); }
      .fixture-title { margin: 0 0 20px; font-size: 24px; font-weight: 700; line-height: 30px; letter-spacing: -0.24px; }
      .fixture-cards { display: flex; gap: 16px; }
      .fixture-card { display: flex; flex: 1 1 0; align-items: center; gap: 12px; min-height: 96px; padding: 16px; border: 1px solid rgb(228, 228, 231); border-radius: 8px; background-color: rgb(250, 250, 250); background-image: linear-gradient(135deg, rgba(124, 102, 247, 0.08), rgba(245, 217, 118, 0.08)); box-shadow: rgba(24, 24, 27, 0.08) 0 8px 24px; }
      .fixture-icon { width: 24px; height: 24px; fill: none; stroke: rgb(95, 78, 207); stroke-width: 2; }
      .fixture-value { font-family: "Courier New", monospace; font-size: 20px; font-weight: 700; line-height: 28px; }
    </style>
  </head>
  <body>
    <main class="fixture-page">
      <h1 class="fixture-title">Revenue overview</h1>
      <section class="fixture-cards">
        <article class="fixture-card">
          <svg class="fixture-icon" viewBox="0 0 24 24"><path d="M4 12h16M12 4v16" /></svg>
          <span class="fixture-value">1,234.56</span>
        </article>
        <article class="fixture-card">
          <svg class="fixture-icon" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6" /></svg>
          <span class="fixture-value">98.7%</span>
        </article>
      </section>
    </main>
  </body>
</html>
