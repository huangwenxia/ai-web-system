display_rules:
  - when: single_object
    display: key_value
    notes:
      - use horizontal or vertical key-value layout based on density
  - when: metric
    display: emphasized_value
    notes:
      - keep unit format globally consistent
  - when: percentage
    display: ratio_visualization
    notes:
      - prefer progress, ring, or pie style expressions
  - when: status
    display: badge_or_status_block
    notes:
      - color is semantic, not ranking
  - when: time_series
    display: timeline_or_trend
    notes:
      - prefer chronological scanning patterns
  - when: relation
    display: related_list_or_anchor
    notes:
      - relationship must be immediately understandable
