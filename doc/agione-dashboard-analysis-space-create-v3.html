        (space.domainSourceSelections?.[domainKey] || []).includes(source.key)));
    }

    // Dialog 内先维护跨数据域草稿，切换数据域不会提前写回创建表单。
    function isDatasourceDraftSelected(domainKey, datasourceKey) {
      return (businessState.datasourceDraftSelections[domainKey] || []).includes(datasourceKey);
    }

    function toggleDraftDatasource(domainKey, datasourceKey) {
      const selected = businessState.datasourceDraftSelections[domainKey] || [];
      businessState.datasourceDraftSelections[domainKey] = selected.includes(datasourceKey)
        ? selected.filter((key) => key !== datasourceKey)
        : [...selected, datasourceKey];
      businessState.datasourceDiscardConfirm = false;
      nextTick(() => lucide.createIcons());
    }

    // 打开时复制全部已选数据域的正式关联，保证一次 Dialog 可连续配置多个数据域。
    function openDatasourcePicker(domainKey) {
      if (!availableDatasources.value.length) return;
      const initialDraft = normalizeDomainSelections(businessState.domainSourceSelections);
      businessState.datasourceDraftSelections = Object.fromEntries(Object.entries(initialDraft).map(([key, value]) => [key, [...value]]));
      businessState.datasourceDraftSnapshot = JSON.stringify(initialDraft);
      businessState.datasourceDiscardConfirm = false;
      switchDatasourceDomain(domainKey);
      nextTick(() => {
        const dialog = [...document.querySelectorAll('[data-datasource-dialog]')].find((element) => element.offsetParent !== null);
        dialog?.querySelector('input')?.focus();
      });
    }

    // 左侧切换只改变当前工作域，其他域尚未保存的勾选保持在同一份草稿中。
    function switchDatasourceDomain(domainKey) {
      if (!businessState.selectedDomains.includes(domainKey)) return;
      activeDatasourceDomain.value = domainKey;
      datasourcePickerSearch.value = '';
      datasourcePickerMode.value = hasRecommendedDatasource(domainKey) ? 'recommended' : 'all';
      businessState.datasourceDiscardConfirm = false;
      nextTick(() => lucide.createIcons());
    }

    function selectDatasourcePickerMode(mode) {
      if (mode !== 'recommended' && mode !== 'all') return;
      datasourcePickerMode.value = mode;
      nextTick(() => lucide.createIcons());
    }

    // 程序性关闭用于页面跳转；用户主动关闭则先检查草稿是否需要放弃确认。
    function closeDatasourcePicker() {
      activeDatasourceDomain.value = null;
      datasourcePickerSearch.value = '';
      businessState.datasourceDraftSelections = {};
      businessState.datasourceDraftSnapshot = '';
      businessState.datasourceDiscardConfirm = false;
    }

    function requestCloseDatasourcePicker() {
      // 放弃确认进行中时禁止 X / 遮罩再次关闭，必须明确继续配置或放弃修改。
      if (businessState.datasourceDiscardConfirm) return;
      if (datasourceDraftDirty.value) {
        businessState.datasourceDiscardConfirm = true;
        return;
      }
      closeDatasourcePicker();
    }

    function continueDatasourceEditing() {
      businessState.datasourceDiscardConfirm = false;
    }

    function discardDatasourceChanges() {
      closeDatasourcePicker();
    }

    // 保存时一次性提交所有数据域的草稿；允许暂时留空，主流程下一步再统一校验完整性。
    function saveDatasourceBindings() {
      businessState.domainSourceSelections = Object.fromEntries(businessState.selectedDomains.map((key) => [
        key,
        [...(businessState.datasourceDraftSelections[key] || [])],
      ]));
      businessState.basicValidationAttempted = false;
      closeDatasourcePicker();
      nextTick(() => lucide.createIcons());
    }

    function draftSelectedDatasourcesForDomain(domainKey) {
      return availableDatasources.value.filter((source) => isDatasourceDraftSelected(domainKey, source.key));
    }

    function datasourcePickerTitle(domain) {
      if (!domain) return t.value.chooseDatasourceFor;
      return lang.value === 'zh' ? `为「${domain.label}」选择数据源` : `Select datasources for “${domain.label}”`;
    }

    function datasourceRecommendationReason(domainKey, datasourceKey) {
      const domain = domains.value.find((item) => item.key === domainKey);
      const hasSameDomainUsage = spaces.some((space) => (space.domainSourceSelections?.[domainKey] || []).includes(datasourceKey));
      if (!domain || !hasSameDomainUsage) return '';
      return lang.value === 'zh'
        ? `已在其他分析空间用于「${domain.label}」`
        : `Already used for “${domain.label}” in another analysis space`;
    }

    function showToast(message) {
      businessState.toastMessage = message;
      businessState.toast = true;
      window.setTimeout(() => { businessState.toast = false; }, 1800);
    }

    // 创建与编辑共用同一套三步表单；只有最终确认时才写回列表，避免中途步骤污染已有空间。
    function confirmCreate() {
      if (!hasCompleteAccessPlan.value || uidIssue.value) return;
      const submittedSpace = {
        nameZh: businessState.name.trim(),
        nameEn: businessState.name.trim(),
        uid: businessState.editingUid || businessState.uid.trim(),
        descriptionZh: businessState.description.trim(),
        descriptionEn: businessState.description.trim(),
        scene: businessState.scene,
        goals: [...businessState.goals],
        customTags: [...businessState.customTags],
        domainKeys: [...businessState.selectedDomains],
        domainSourceSelections: Object.fromEntries(businessState.selectedDomains.map((key) => [key, [...(businessState.domainSourceSelections[key] || [])]])),
      };
      const editingIndex = spaces.findIndex((space) => space.uid === businessState.editingUid);
      if (editingIndex >= 0) {
        Object.assign(spaces[editingIndex], submittedSpace);
      } else {
        spaces.unshift({
          ...submittedSpace,
          dashboardKeys: [],
          archived: false,
        });
      }
      const resultMessage = editingIndex >= 0 ? t.value.spaceUpdated : t.value.created;
      businessState.editingUid = null;
      businessState.preserveNextScenario = true;
      activeScenario.value = 'list';
      showToast(resultMessage);
    }

    // 数据域详情支持鼠标与键盘聚焦，短延迟关闭避免指针进入浮层时闪退。
    function showDomainPopover(key) {
      if (domainPopoverCloseTimer) window.clearTimeout(domainPopoverCloseTimer);
      activeDomainPopover.value = key;
      nextTick(() => lucide.createIcons());
    }

    function scheduleDomainPopoverClose() {
      if (domainPopoverCloseTimer) window.clearTimeout(domainPopoverCloseTimer);
      domainPopoverCloseTimer = window.setTimeout(() => { activeDomainPopover.value = null; }, 100);
    }

    function isDomainPopoverOpen(key) {
      return activeDomainPopover.value === key;
    }

    function toggleSpaceMenu(uid) {
      activeSpaceMenu.value = activeSpaceMenu.value === uid ? null : uid;
      deletingSpaceUid.value = null;
      nextTick(() => lucide.createIcons());
    }

    // 编辑复用创建流程并完整回填数据域和数据源绑定，UID 与已有 Dashboard 保持不变。
    function editSpace(uid) {
      const space = spaces.find((item) => item.uid === uid);
      if (!space) return;
      businessState.name = lang.value === 'zh' ? space.nameZh : space.nameEn;
      businessState.uid = space.uid;
      businessState.uidManual = true;
      businessState.description = lang.value === 'zh' ? space.descriptionZh : space.descriptionEn;
      businessState.scene = space.scene || '';
      businessState.goals = [...(space.goals || [])];
      businessState.customTags = [...(space.customTags || [])];
      businessState.customTagDraft = '';
      businessState.moreValidationAttempted = false;
      businessState.selectedDomains = [...space.domainKeys];
      businessState.domainSourceSelections = Object.fromEntries(Object.entries(space.domainSourceSelections || {}).map(([key, value]) => [key, [...value]]));
      businessState.editingUid = uid;
      businessState.basicValidationAttempted = false;
      businessState.preserveNextScenario = true;
      activeSpaceMenu.value = null;
      deletingSpaceUid.value = null;
      activeScenario.value = 'create-ready';
    }

    function toggleArchiveSpace(uid) {
      const space = spaces.find((item) => item.uid === uid);
      if (!space) return;
      space.archived = !space.archived;
      activeSpaceMenu.value = null;
      deletingSpaceUid.value = null;
      showToast(space.archived ? t.value.spaceArchived : t.value.spaceRestored);
    }

    function requestSpaceDeletion(uid) {
      // 删除确认放到独立弹窗，操作列始终保留编辑 / 归档 / 删除。
      deletingSpaceUid.value = uid;
      nextTick(() => lucide.createIcons());
    }

    function cancelSpaceDeletion() {
      deletingSpaceUid.value = null;
    }

    function confirmSpaceDeletion(uid) {
      const index = spaces.findIndex((space) => space.uid === uid);
      if (index < 0) return;
      spaces.splice(index, 1);
      activeSpaceMenu.value = null;
      deletingSpaceUid.value = null;
      showToast(t.value.spaceDeleted);
    }

    function closeSpaceMenuFromDocument(event) {
      if (!event.target.closest('[data-space-actions]')) {
        activeSpaceMenu.value = null;
      }
    }

    const deletingSpace = computed(() => spaces.find((space) => space.uid === deletingSpaceUid.value) || null);

    // Dialog 关闭支持 Esc，并把 Tab 焦点限制在当前可见的配置面板内。
    function handleDatasourceDialogKeydown(event) {
      if (event.key === 'Escape' && deletingSpaceUid.value) {
        event.preventDefault();
        cancelSpaceDeletion();
        return;
      }
      if (!activeDatasourceDomain.value) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        requestCloseDatasourcePicker();
        return;
      }
      if (event.key !== 'Tab') return;
      const dialog = [...document.querySelectorAll('[data-datasource-dialog]')].find((element) => element.offsetParent !== null);
      if (!dialog) return;
      const focusable = [...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex="0"]')];
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function goAddDatasource() {
      closeDatasourcePicker();
      activeNav.value = 'datasources';
      showToast(t.value.datasourceGuide);
    }

    function selectedDatasourcesForDomain(domainKey) {
      return availableDatasources.value.filter((source) => isDatasourceSelected(domainKey, source.key));
    }

    function applyDatasourceSearch() {
      businessState.datasourceSearch = businessState.datasourceSearchDraft;
    }

    function resetDatasourceSearch() {
      businessState.datasourceSearchDraft = '';
      businessState.datasourceSearch = '';
      businessState.datasourceTypeFilter = 'all';
    }

    function runDatasourceAction(label, sourceName) {
      showToast(`${label} · ${sourceName}`);
    }

    function testDatasource(sourceName) {
      showToast(`${t.value.connectionPassed} · ${sourceName}`);
    }

    function requestDatasourceDeletion(sourceName) {
      showToast(`${t.value.deleteNeedsConfirm} · ${sourceName}`);
    }

    watch(activeScenario, (key) => {
      activeSpaceMenu.value = null;
      deletingSpaceUid.value = null;
      if (businessState.preserveNextScenario) {
        businessState.preserveNextScenario = false;
        nextTick(() => lucide.createIcons());
        return;
      }
      applyScenario(key);
    });
    const bootScenario = reviewScenarios.value.some((item) => item.key === savedReview?.scenario)
      ? savedReview.scenario
      : 'list';
    if (activeScenario.value === bootScenario) {
      applyScenario(bootScenario);
    } else {
      activeScenario.value = bootScenario;
    }
    watch([activeScenario, activeNav, aestheticMode], writeReviewState);
    onMounted(() => {
      document.addEventListener('click', closeSpaceMenuFromDocument);
      document.addEventListener('keydown', handleDatasourceDialogKeydown);
    });
    onBeforeUnmount(() => {
      if (domainPopoverCloseTimer) window.clearTimeout(domainPopoverCloseTimer);
      document.removeEventListener('click', closeSpaceMenuFromDocument);
      document.removeEventListener('keydown', handleDatasourceDialogKeydown);
    });
    // AGIONE_EDIT_SETUP_DATA_END

    function applyThemeVars(vars) {
      Object.entries(vars).forEach(([key, value]) => document.documentElement.style.setProperty(key, value));
    }

    function toggleTheme() {
      isDark.value = !isDark.value;
      document.documentElement.classList.toggle('dark', isDark.value);
      applyThemeVars(isDark.value ? darkVars : lightVars);
      nextTick(() => lucide.createIcons());
    }

    function toggleLang() {
      lang.value = lang.value === 'en' ? 'zh' : 'en';
      document.documentElement.lang = lang.value === 'zh' ? 'zh-CN' : 'en';
      nextTick(() => lucide.createIcons());
    }

    function selectNav(key) {
      activeNav.value = key;
      mobileNavOpen.value = false;
    }

    function selectReviewScenario(key) {
      if (reviewScenarios.value.some((item) => item.key === key)) activeScenario.value = key;
    }

    function selectAestheticMode(mode) {
      if (mode === 'baseline' || mode === 'anti-ai-reviewed') aestheticMode.value = mode;
    }

    function clampReviewDock(x, y) {
      const dock = document.querySelector('[data-explore-review-dock]');
      const width = dock?.offsetWidth || 280;
      const height = dock?.offsetHeight || 48;
      return {
        x: Math.max(8, Math.min(x, window.innerWidth - width - 8)),
        y: Math.max(64, Math.min(y, window.innerHeight - height - 8)),
      };
    }

    function setReviewDockPosition(x, y) {
      const next = clampReviewDock(x, y);
      reviewDockPosition.x = next.x;
      reviewDockPosition.y = next.y;
    }

    function moveReviewDock(dx, dy) {
      const dock = document.querySelector('[data-explore-review-dock]');
      const rect = dock?.getBoundingClientRect();
      setReviewDockPosition((reviewDockPosition.x ?? rect?.left ?? 20) + dx, (reviewDockPosition.y ?? rect?.top ?? 72) + dy);
    }

    function onReviewDockPointerMove(event) {
      if (event.pointerId !== reviewDockDrag.pointerId) return;
      setReviewDockPosition(event.clientX - reviewDockDrag.dx, event.clientY - reviewDockDrag.dy);
    }

    function endReviewDockDrag(event) {
      if (event?.pointerId != null && event.pointerId !== reviewDockDrag.pointerId) return;
      reviewDockDrag.pointerId = null;
      window.removeEventListener('pointermove', onReviewDockPointerMove);
      window.removeEventListener('pointerup', endReviewDockDrag);
      window.removeEventListener('pointercancel', endReviewDockDrag);
    }

    function beginReviewDockDrag(event) {
      if (event.button !== 0) return;
      const dock = event.currentTarget.closest('[data-explore-review-dock]');
      const rect = dock.getBoundingClientRect();
      reviewDockDrag.pointerId = event.pointerId;
      reviewDockDrag.dx = event.clientX - rect.left;
      reviewDockDrag.dy = event.clientY - rect.top;
      setReviewDockPosition(rect.left, rect.top);
      window.addEventListener('pointermove', onReviewDockPointerMove);
      window.addEventListener('pointerup', endReviewDockDrag);
      window.addEventListener('pointercancel', endReviewDockDrag);
    }

    function constrainReviewDock() {
      if (reviewDockPosition.x != null) setReviewDockPosition(reviewDockPosition.x, reviewDockPosition.y);
    }

    watch([activeNav, mobileNavOpen, reviewDockCollapsed, aestheticMode], () => nextTick(() => {
      lucide.createIcons();
      constrainReviewDock();
    }));
    onMounted(() => {
      lucide.createIcons();
      window.addEventListener('resize', constrainReviewDock);
    });
    onBeforeUnmount(() => {
      endReviewDockDrag();
      window.removeEventListener('resize', constrainReviewDock);
    });
    const logoSrc = computed(() => LOGO_DARK);

    return {
      isDark, lang, activeTab, activeNav, mobileNavOpen, t,
      toggleTheme, toggleLang, selectNav, logoSrc,
      activeScenario, aestheticMode, businessState, reviewScenarios,
      reviewDockCollapsed, reviewDockStyle, reviewToolText,
      selectReviewScenario, selectAestheticMode, beginReviewDockDrag, moveReviewDock,
      // AGIONE_EDIT_SETUP_RETURN_START · expose frontend-design page values
      domains, sceneOptions, goalOptions, filteredSpaces, selectedDomainObjects, isCreationOpen, isBasicStep, isMoreSettings, isPreview, formTitle, formPrimaryAction,
      availableDatasources, datasourceRecords, filteredDatasources, datasourceStats,
      activeDatasourceDomain, activeDatasourceDomainObject, datasourcePickerSearch, datasourcePickerMode, pickerDatasources, recommendedPickerDatasources, visiblePickerDatasources,
      datasourceDialogTitle, configuredDraftDomainCount, datasourceDraftDirty,
      activeDomainPopover, activeSpaceMenu, deletingSpaceUid, deletingSpace,
      hasCompleteAccessPlan, hasCompleteBasicInfo, hasNameError, hasUidError, uidErrorText, isUidLocked, hasDomainError, hasDatasourceError, hasSceneError, hasGoalError,
      customTagSuggestions, selectedSceneLabel, selectedGoalLabels,
      openCreate, closeCreate, onSpaceNameInput, onSpaceUidInput, toggleDomain, selectScene, toggleGoal, addCustomTag, removeCustomTag, onCustomTagKeydown, goToMoreSettings, goBackToBasic, goToPreview, goBackToMoreSettings, confirmCreate,
      isDatasourceSelected, selectedDatasourcesForDomain, openDatasourcePicker, closeDatasourcePicker, datasourcePickerTitle, datasourceRecommendationReason, goAddDatasource,
      isDatasourceDraftSelected, toggleDraftDatasource, draftSelectedDatasourcesForDomain, switchDatasourceDomain, selectDatasourcePickerMode,
      requestCloseDatasourcePicker, continueDatasourceEditing, discardDatasourceChanges, saveDatasourceBindings,
      showDomainPopover, scheduleDomainPopoverClose, isDomainPopoverOpen, toggleSpaceMenu, editSpace, toggleArchiveSpace, requestSpaceDeletion, cancelSpaceDeletion, confirmSpaceDeletion,
      applyDatasourceSearch, resetDatasourceSearch, runDatasourceAction, testDatasource, requestDatasourceDeletion,
      // AGIONE_EDIT_SETUP_RETURN_END
    };
  },

  template: `
    <div class="app">
      <!-- TopBar §3.2 — 右侧固定顺序：Search → Docs → Language → Theme → Avatar -->
      <nav class="topnav" role="navigation" aria-label="Main navigation">
        <div class="topnav-left">
          <button
            class="mobile-menu-toggle"
            type="button"
            aria-label="Open navigation"
            aria-controls="agione-sidebar"
            :aria-expanded="String(mobileNavOpen)"
            @click="mobileNavOpen = true"
          >
            <i data-lucide="menu"></i>
          </button>
          <a class="nav-logo" href="#" aria-label="AGIOne">
            <img :src="logoSrc" alt="AGIOne" />
          </a>
          <div class="nav-divider" aria-hidden="true"></div>
          <div class="nav-tabs" role="tablist">
            <button
              v-for="(tab, i) in t.tabs" :key="i"
              class="nav-tab" :class="{ active: activeTab === i }"
              role="tab" :aria-selected="String(activeTab === i)"
              @click="activeTab = i"
            >{{ tab }}</button>
          </div>
        </div>
        <div class="topnav-right">
          <div class="nav-search" role="search" tabindex="0">
            <i data-lucide="search"></i>
            <span class="nav-search-text">{{ t.search }}</span>
            <span class="nav-search-kbd">Ctrl+K</span>
          </div>
          <button class="nav-icon-btn nav-docs" :title="t.docs">
            <i data-lucide="book-open"></i>
          </button>
          <button class="nav-icon-btn" title="Language" @click="toggleLang">
            <i data-lucide="globe"></i>
          </button>
          <button class="nav-icon-btn" title="Toggle theme" @click="toggleTheme" aria-label="Toggle color theme">
            <i :data-lucide="isDark ? 'moon' : 'sun'"></i>
          </button>
          <div class="nav-avatar" role="button" tabindex="0" aria-label="User menu">U</div>
        </div>
      </nav>

      <div class="body">
        <aside
          id="agione-sidebar"
          class="sidebar"
          :class="{ 'is-mobile-open': mobileNavOpen }"
          role="navigation"
          aria-label="Sidebar navigation"
        >
          <div class="sidebar-mobile-head">
            <img class="sidebar-mobile-logo" :src="logoSrc" alt="AGIOne" />
            <button class="sidebar-mobile-close" type="button" aria-label="Close navigation" @click="mobileNavOpen = false">
              <i data-lucide="x"></i>
            </button>
          </div>
          <!-- AGIONE_EDIT_SIDEBAR_START · menu items only; preserve the aside and overlay -->
          <div class="sidebar-section">
            <div class="sidebar-section-title">{{ t.settings }}</div>
            <button class="nav-item" :class="{ active: activeNav === 'spaces' }" @click="selectNav('spaces')">
              <i data-lucide="folder-kanban"></i>{{ t.analysisSpaces }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'datasources' }" @click="selectNav('datasources')">
              <i data-lucide="database"></i>{{ t.datasources }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'users' }" @click="selectNav('users')">
              <i data-lucide="users"></i>{{ t.userManagement }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'configuration' }" @click="selectNav('configuration')">
              <i data-lucide="sliders-horizontal"></i>{{ t.configuration }}
            </button>
          </div>
          <!-- AGIONE_EDIT_SIDEBAR_END -->
        </aside>
        <button
          v-if="mobileNavOpen"
          class="layout-overlay"
          type="button"
          aria-label="Close navigation"
          @click="mobileNavOpen = false"
        ></button>

        <main class="main" data-fd-canvas role="main">
          <!-- AGIONE_EDIT_MAIN_START · frontend-design owns the complete canvas interior -->
          <!-- AGIONE_BASELINE_VIEW_START · clone initial frontend-design DOM, then freeze -->
          <section
            v-show="aestheticMode === 'baseline'"
            data-explore-aesthetic-view="baseline"
            data-shared-business-state="businessState"
            :data-business-scenario="activeScenario"
          >
            <div v-if="activeNav === 'spaces'" class="baseline-page">
              <header class="baseline-header">
                <div>
                  <h1 class="baseline-title">{{ t.pageTitle }}</h1>
                  <p class="baseline-subtitle">{{ t.pageMeta }}</p>
                </div>
                <button v-if="!isCreationOpen" class="baseline-button primary" type="button" @click="openCreate">
                  <i data-lucide="plus"></i>{{ t.newSpace }}
                </button>
              </header>
              <div class="baseline-toolbar">
                <label class="baseline-search">
                  <i data-lucide="search"></i>
                  <input v-model="businessState.search" class="baseline-input" :placeholder="t.searchSpaces" />
                </label>
              </div>
              <div class="baseline-shell">
                <div class="baseline-table-wrap">
                  <table class="baseline-table space-list">
                    <thead>
                      <tr>
                        <th>{{ t.spaceColumn }}</th>
                        <th>{{ t.domainColumn }}</th>
                        <th>{{ t.dashboardColumn }}</th>
                        <th>{{ t.actionColumn }}</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="space in filteredSpaces" :key="space.uid">
                        <td>
                          <div class="baseline-object">
                            <i data-lucide="folder"></i>
                            <span class="baseline-space-copy">
                              <span class="baseline-space-title">
                                <strong>{{ space.name }}</strong>
                                <span v-if="space.archived" class="baseline-archive-tag">{{ t.archived }}</span>
                              </span>
                              <small>{{ space.uid }}</small>
                              <span v-if="space.description" class="baseline-space-description">{{ space.description }}</span>
                              <span v-if="space.tags.length" class="baseline-row-tags">
                                <span v-for="tag in space.tags" :key="tag" class="baseline-row-tag">{{ tag }}</span>
                              </span>
                            </span>
                          </div>
                        </td>
                        <td>
                          <div
                            class="baseline-domain-popover-wrap"
                            @mouseenter="showDomainPopover('baseline:' + space.uid)"
                            @mouseleave="scheduleDomainPopoverClose"
                            @focusin="showDomainPopover('baseline:' + space.uid)"
                            @focusout="scheduleDomainPopoverClose"
                          >
                            <span
                              class="baseline-domain-hint"
                              :class="{ 'is-pending': !space.domainKeys.length }"
                              tabindex="0"
                            >{{ space.domainKeys.length ? space.domainKeys.length + t.domainUnit : t.domainsPending }}</span>
                            <div v-if="isDomainPopoverOpen('baseline:' + space.uid) && space.domainDetails.length" class="baseline-domain-popover" role="tooltip" data-component="el-popover">
                              <span class="baseline-domain-popover-title">{{ t.domainDetails }}</span>

              type="button"
              :aria-label="reviewToolText.move"
              @pointerdown.prevent="beginReviewDockDrag"
              @keydown.left.prevent="moveReviewDock(-12, 0)"
              @keydown.right.prevent="moveReviewDock(12, 0)"
              @keydown.up.prevent="moveReviewDock(0, -12)"
              @keydown.down.prevent="moveReviewDock(0, 12)"
            >
              <i data-lucide="grip"></i>
              <span v-if="!reviewDockCollapsed" class="review-dock-title">{{ reviewToolText.title }}</span>
            </button>
            <button
              class="review-dock-toggle"
              type="button"
              :aria-label="reviewDockCollapsed ? reviewToolText.expand : reviewToolText.collapse"
              :aria-expanded="String(!reviewDockCollapsed)"
              @click="reviewDockCollapsed = !reviewDockCollapsed"
            >
              <i :data-lucide="reviewDockCollapsed ? 'panel-top-open' : 'panel-top-close'"></i>
            </button>
          </div>
          <div v-if="!reviewDockCollapsed" class="review-dock-body">
            <section class="review-dock-group" aria-label="Business scenario">
              <span class="review-dock-label">{{ reviewToolText.scenario }}</span>
              <div class="review-dock-options">
                <button
                  v-for="scenario in reviewScenarios"
                  :key="scenario.key"
                  class="review-dock-option"
                  type="button"
                  :aria-pressed="String(activeScenario === scenario.key)"
                  @click="selectReviewScenario(scenario.key)"
                >{{ scenario.label[lang] || scenario.key }}</button>
              </div>
            </section>
            <section class="review-dock-group" aria-label="Aesthetic comparison">
              <span class="review-dock-label">{{ reviewToolText.aesthetic }}</span>
              <div class="review-dock-options">
                <button class="review-dock-option" type="button" :aria-pressed="String(aestheticMode === 'baseline')" @click="selectAestheticMode('baseline')">{{ reviewToolText.baseline }}</button>
                <button class="review-dock-option" type="button" :aria-pressed="String(aestheticMode === 'anti-ai-reviewed')" @click="selectAestheticMode('anti-ai-reviewed')">{{ reviewToolText.reviewed }}</button>
              </div>
            </section>
          </div>
        </aside>
      </div>
    </div>
  `
});

// AGIONE_EDIT_APP_BOOT_START · register optional page plugins/components before mount
// AGIONE_EDIT_APP_BOOT_END
Object.entries(lightVars).forEach(([key, value]) => document.documentElement.style.setProperty(key, value));
app.mount('#app');
lucide.createIcons();
</script>
</body>
</html>
