// ──────────────────────────────────────────────
// §5.0 Prototype Component Library —— 运行时组件库
// 配套 CSS 见 <style> 块；API 文档见 SKILL.md §5.0.5
// 使用：注册为 Vue Global Component，原型直接 <kpi-card />
// ──────────────────────────────────────────────
const PrototypeComponents = {

  // <header-box title subtitle> + slot:actions + default slot（filter/extra 内容）
  HeaderBox: {
    props: {
      title:    { type: String, required: true },
      subtitle: { type: String, default: '' },
    },
    template: `
      <div class="header-box" data-component="header-box">
        <div class="header-box__top">
          <div style="min-width:0;">
            <h1 class="header-box__title">{{ title }}</h1>
            <p v-if="subtitle" class="header-box__subtitle">{{ subtitle }}</p>
          </div>
          <div v-if="$slots.actions" class="header-box__right">
            <slot name="actions"></slot>
          </div>
        </div>
        <div v-if="$slots.default" class="header-box__content">
          <slot></slot>
        </div>
      </div>
    `
  },

  // <kpi-card title value icon iconColor trend trendType>
  KpiCard: {
    props: {
      title:     { type: String, required: true },
      value:     { type: [String, Number], default: '' },
      icon:      { type: String, default: '' },
      iconColor: { type: String, default: 'primary' }, // primary|success|warning|destructive
      trend:     { type: String, default: '' },
      trendType: { type: String, default: 'neutral' }, // up|down|neutral
    },
    template: `
      <div class="kpi-card" data-component="kpi-card">
        <div class="kpi-card__header">
          <span class="kpi-card__title">{{ title }}</span>
          <i v-if="icon" :data-lucide="icon" class="kpi-card__icon" :class="'kpi-card__icon--' + iconColor"></i>
        </div>
        <div class="kpi-card__value"><slot>{{ value }}</slot></div>
        <div v-if="trend || $slots.trend" class="kpi-card__trend" :class="'kpi-card__trend--' + trendType">
          <slot name="trend">{{ trend }}</slot>
        </div>
      </div>
    `
  },

  // <status-badge status [label]> — status: active|pending|expiringSoon|inactive|revoked|expired|error
  StatusBadge: {
    props: {
      status: { type: String, required: true },
      label:  { type: String, default: '' },
    },
    computed: {
      badgeClass() {
        return {
          active:        'badge-green',
          pending:       'badge-orange',
          expiringSoon:  'badge-orange',
          inactive:      'badge-muted',
          revoked:       'badge-red',
          expired:       'badge-muted',
          error:         'badge-red',
        }[this.status] || 'badge-muted';
      }
    },
    template: `
      <span class="status-badge" :class="badgeClass" data-component="status-badge">
        <span class="status-badge__dot"></span>
        <span><slot>{{ label || status }}</slot></span>
      </span>
    `
  },

  // <empty-state icon title hint> + slot:action
  EmptyState: {
    props: {
      icon:  { type: String, default: 'inbox' },
      title: { type: String, required: true },
      hint:  { type: String, default: '' },
    },
    template: `
      <div class="empty-state" data-component="empty-state">
        <i :data-lucide="icon" class="empty-state__icon"></i>
        <p class="empty-state__title">{{ title }}</p>
        <p v-if="hint" class="empty-state__hint">{{ hint }}</p>
        <div v-if="$slots.action"><slot name="action"></slot></div>
      </div>
    `
  },

  // <alert variant title desc closable> — variant: success|warning|error|info
  Alert: {
    props: {
      variant:  { type: String, default: 'info' },
      title:    { type: String, required: true },
      desc:     { type: String, default: '' },
      closable: { type: Boolean, default: false },
    },
    data() { return { visible: true }; },
    computed: {
      iconName() {
        return {
          success: 'circle-check',
          warning: 'triangle-alert',
          error:   'circle-x',
          info:    'info',
        }[this.variant] || 'info';
      }
    },
    template: `
      <div v-if="visible" class="alert" :class="'alert-' + variant" data-component="alert">
        <i :data-lucide="iconName" class="alert-icon"></i>
        <div class="alert-body">
          <p class="alert-title">{{ title }}</p>
          <p v-if="desc || $slots.default" class="alert-desc"><slot>{{ desc }}</slot></p>
        </div>
        <button v-if="closable" class="alert-close" type="button" @click="visible = false" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
    `
  },

  // <UsageBar used total unit color showText> — color: auto|primary|success|warning|danger
  // v3.5
  UsageBar: {
    props: {
      used:     { type: Number, required: true },
      total:    { type: Number, required: true },
      unit:     { type: String, default: '' },
      color:    { type: String, default: 'auto' },
      showText: { type: Boolean, default: true },
    },
    computed: {
      percent() {
        if (!this.total) return 0;
        return Math.min(100, (this.used / this.total) * 100);
      },
      autoColor() {
        if (this.color !== 'auto') return this.color;
        if (this.percent >= 100) return 'danger';
        if (this.percent >= 80)  return 'warning';
        return 'primary';
      },
    },
    template: `
      <div class="usage-bar" data-component="usage-bar">
        <div class="usage-bar__track">
          <div class="usage-bar__fill" :class="'usage-bar__fill--' + autoColor" :style="{ width: percent + '%' }"></div>
        </div>
        <span v-if="showText" class="usage-bar__text">
          <slot>{{ used }}{{ unit }} / {{ total }}{{ unit }}</slot>
        </span>
      </div>
    `
  },

  // <kv-card title :items hover labelWidth> + slot:headerRight + slot:[item.key] for custom value
  // items: [{ label: '名称', value: '...', key: 'name' }]
  // v3.5
  KvCard: {
    props: {
      title:      { type: String, default: '' },
      items:      { type: Array, default: () => [] },
      labelWidth: { type: String, default: 'auto' },
      hover:      { type: Boolean, default: false },
    },
    template: `
      <div class="kv-card" :class="{ 'kv-card--hover': hover }" data-component="kv-card">
        <div v-if="title || $slots.headerRight" class="kv-card__head">
          <div class="kv-card__title">{{ title }}</div>
          <div v-if="$slots.headerRight" class="kv-card__head-right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="kv-card__body">
          <div v-for="(it, i) in items" :key="it.key || i" class="kv-card__row">
            <div class="kv-card__label" :style="labelWidth !== 'auto' ? { width: labelWidth } : {}">{{ it.label }}：</div>
            <div class="kv-card__value">
              <slot :name="it.key || ('item' + i)" :item="it">{{ it.value }}</slot>
            </div>
          </div>
          <slot></slot>
        </div>
      </div>
    `
  },

  // <DetailSection title> + slot:headerRight + default
  // 左侧 4px 主色竖条 + 标题，详情页 section 标准
  // v3.5
  DetailSection: {
    props: {
      title: { type: String, required: true },
    },
    template: `
      <div class="detail-section" data-component="detail-section">
        <div class="detail-section__head">
          <span class="detail-section__title">{{ title }}</span>
          <div v-if="$slots.headerRight" class="detail-section__right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="detail-section__body">
          <slot></slot>
        </div>
      </div>
    `
  },

  // <TableActions :actions max>
  // actions: [{ label, type?, icon?, disabled?, danger?, onClick }]
  // ≤max 显示为 link button，>max 自动收纳到 ... 更多 dropdown
  // v3.5
  TableActions: {
    props: {
      actions: { type: Array, required: true },
      max:     { type: Number, default: 3 },
    },
    computed: {
      visibleActions()  { return this.actions.slice(0, this.max); },
      overflowActions() { return this.actions.slice(this.max); },
    },
    methods: {
      handle(a, e) { if (a.onClick) a.onClick(e); },
    },
    template: `
      <div class="table-actions" data-component="table-actions">
        <el-button
          v-for="(a, i) in visibleActions" :key="'v' + i"
          link
          :type="a.danger ? 'danger' : (a.type || 'primary')"
          :disabled="a.disabled"
          @click="handle(a, $event)"
        >
          <i v-if="a.icon" :data-lucide="a.icon" style="width:14px;height:14px;margin-right:4px;"></i>
          {{ a.label }}
        </el-button>
        <el-dropdown v-if="overflowActions.length" trigger="click">
          <el-button link type="primary">
            <i data-lucide="ellipsis" style="width:16px;height:16px;"></i>
          </el-button>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item
                v-for="(a, i) in overflowActions" :key="'o' + i"
                :disabled="a.disabled"
                :class="{ 'is-danger': a.danger }"
                @click="handle(a, $event)"
              >
                <i v-if="a.icon" :data-lucide="a.icon" style="width:14px;height:14px;margin-right:6px;"></i>
                {{ a.label }}
              </el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </div>
    `
  },

  // <PageHeader title subtitle eyebrow eyebrowIcon> + slot:actions
  // 段级标题（无 card 边框）。HeaderBox 是页级 card 容器；PageHeader 是更轻量的 section 标题。

  PageHeader: {

          <p v-if="subtitle" class="page-header__subtitle">{{ subtitle }}</p>

        <div v-if="$slots.actions" class="page-header__right">
          <slot name="actions"></slot>
        </div>
      </div>
    `

  // <metrics-strip :items cols divided>
  // items: [{ label, value, sub?, accent?, slot?, key? }]
  // 等分指标条（Hero 详情 / Overview 必备），cols 不传时按 items.length 自动等分
  // v3.8
  MetricsStrip: {
    props: {
      items:   { type: Array,   required: true },
      cols:    { type: Number,  default: 0 },
      divided: { type: Boolean, default: true },
    },
    template: `
      <div
        class="metrics-strip"

        :style="{ gridTemplateColumns: 'repeat(' + (cols || items.length) + ', minmax(0, 1fr))' }"
        data-component="metrics-strip"
      >
        <div v-for="(item, i) in items" :key="item.key || i" class="metrics-strip__cell">
          <div class="metrics-strip__label">{{ item.label }}</div>

          </div>
          <div v-if="item.sub" class="metrics-strip__sub">{{ item.sub }}</div>
        </div>
      </div>
    `
  },

  // <HeroBand eyebrow eyebrowIcon title desc :points tone> + slot:right
  // Overview 引导带：营销叙事 + 右侧 CTA/选择卡
  // tone: primary | neutral | gradient
  // v3.8
  HeroBand: {

      eyebrowIcon: { type: String, default: '' },
      title:       { type: String, required: true },

  // <step-pills :steps separator>
  // steps: [{ label, state: 'done'|'doneGreen'|'current'|'todo' }]
  // 微型流程指示器（轻量 stepper）
  // v3.8
  StepPills: {
    props: {
      steps:     { type: Array,  required: true },
      separator: { type: String, default: '›' },
    },
    template: `
      <div class="step-pills" data-component="step-pills">
        <template v-for="(step, i) in steps" :key="i">
          <span class="step-pill" :class="'step-pill--' + step.state">{{ step.label }}</span>
          <span v-if="i < steps.length - 1" class="step-pill__sep">{{ separator }}</span>
        </template>
      </div>
    `
  },

  // <ProgressBar value max state height>
  // 三态进度条原子（auto: ≥80% warning, ≥100% danger）
  // 与 UsageBar 区别：ProgressBar 是裸进度条原子，UsageBar = 进度条 + 数字文本组合
  // v3.8
  ProgressBar: {
    props: {
      value:  { type: Number, required: true },
      max:    { type: Number, default: 100 },
      state:  { type: String, default: 'auto' },
      height: { type: Number, default: 6 },
    },
    computed: {
      percent() { return Math.min(100, this.max ? (this.value / this.max) * 100 : 0); },
      autoState() {
        if (this.state !== 'auto') return this.state;
        if (this.percent >= 100) return 'danger';
        if (this.percent >= 80)  return 'warning';
        return 'normal';
      },
    },
    template: `
      <div class="progress-bar" :style="{ height: height + 'px' }" data-component="progress-bar">
        <div class="progress-bar__fill"
             :class="'progress-bar__fill--' + autoState"
             :style="{ width: percent + '%' }"></div>
      </div>
    `
  },

  // <DataTable :data :columns :total :page :pageSize loading emptyText showPagination operationsLabel operationsWidth>
  // columns: [{ label, prop, width?, minWidth?, fixed?, align?, sortable?, slot? }]
  // slot per column via slot 名（在 columns 里声明 slot 字段）
  // slot:operations 自动生成右侧固定操作列
  // v-model:page 双向绑定页码
  // v3.7
  DataTable: {
    props: {
      data:            { type: Array,   default: () => [] },
      columns:         { type: Array,   required: true },
      total:           { type: Number,  default: 0 },
      page:            { type: Number,  default: 1 },
      pageSize:        { type: Number,  default: 10 },
      loading:         { type: Boolean, default: false },
      emptyText:       { type: String,  default: '暂无数据 / No data' },
      showPagination:  { type: Boolean, default: true },
      operationsLabel: { type: String,  default: '操作' },
      operationsWidth: { type: [String, Number], default: 160 },
    },
    emits: ['update:page', 'update:pageSize', 'row-click'],
    template: `
      <div class="data-table" data-component="data-table">
        <el-table
          v-loading="loading"
          :data="data"
          :empty-text="emptyText"
          style="width:100%;"
          @row-click="(row) => $emit('row-click', row)"
        >
          <el-table-column
            v-for="col in columns"
            :key="col.key || col.prop || col.label"
            :prop="col.prop"
            :label="col.label"
            :width="col.width"
            :min-width="col.minWidth"
            :fixed="col.fixed"
            :align="col.align || 'left'"
            :sortable="col.sortable"
          >
            <template #default="scope" v-if="col.slot">
              <slot :name="col.slot" :row="scope.row" :col="col" :index="scope.$index"></slot>
            </template>
          </el-table-column>
          <el-table-column
            v-if="$slots.operations"
            :label="operationsLabel"
            :width="operationsWidth"
            fixed="right"
          >
            <template #default="scope">
              <slot name="operations" :row="scope.row" :index="scope.$index"></slot>
            </template>
          </el-table-column>
        </el-table>
        <div v-if="showPagination && total > 0" class="data-table__pagination">
          <el-pagination
            :current-page="page"
            :page-size="pageSize"
            :total="total"
            layout="total, prev, pager, next"
            :pager-count="5"
            background
            @current-change="(p) => $emit('update:page', p)"
            @size-change="(s) => $emit('update:pageSize', s)"
          ></el-pagination>
        </div>
      </div>
    `
  },

  // <tag color preset icon> + slot:default — 通用标签（非状态）
  // color: purple|blue|green|orange|yellow|muted|red
  // preset: trending|new|beta|stable|deprecated（Tag 词汇表）
  //       | conversation|multi-modal|reasoning|embedding|image（模型类型）
  // v3.6
  Tag: {
    props: {
      color:  { type: String, default: 'muted' },
      preset: { type: String, default: '' },
      icon:   { type: String, default: '' },
    },
    computed: {
      finalColor() {
        const map = {
          // Tag 词汇表（§2.3）
          trending: 'purple', new: 'green', beta: 'blue', stable: 'muted', deprecated: 'muted',
          // 模型类型 Badge（§2.3）
          conversation: 'blue', 'multi-modal': 'purple', reasoning: 'orange', embedding: 'yellow', image: 'green',
        };
        return this.preset ? (map[this.preset.toLowerCase()] || this.color) : this.color;
      },
      finalIcon() {
        if (this.preset === 'deprecated') return 'triangle-alert';
        return this.icon;
      },
      finalLabel() {
        const labelMap = { 'multi-modal': 'Multi-Modal' };
        if (labelMap[this.preset]) return labelMap[this.preset];
        if (!this.preset) return '';
        return this.preset.charAt(0).toUpperCase() + this.preset.slice(1);
      }
    },
    template: `
      <span class="tag" :class="'badge-' + finalColor" data-component="tag">
        <i v-if="finalIcon" :data-lucide="finalIcon"></i>
        <slot>{{ finalLabel }}</slot>
      </span>
    `
  },

  // <card-box title> + slot:headerRight + default — 通用卡片容器
  // v3.6
  CardBox: {
    props: {
      title:  { type: String, default: '' },
      padded: { type: Boolean, default: false },
    },
    template: `
      <div class="card-box" :class="{ 'card-box--padded': padded }" data-component="card-box">
        <div v-if="title || $slots.headerRight" class="card-box__head">
          <div class="card-box__title">{{ title }}</div>
          <div v-if="$slots.headerRight" class="card-box__head-right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="card-box__body"><slot></slot></div>
      </div>
    `
  },

  // <Tabs :options v-model variant> — 独立 Tabs（不绑定 DetailPage）
  // variant: underline (默认) | segmented
  // options: [{ label, value, count? }]
  // v3.6
  Tabs: {
    props: {
      options:    { type: Array, required: true },
      modelValue: { type: [String, Number], default: '' },
      variant:    { type: String, default: 'underline' },
    },
    emits: ['update:modelValue'],
    template: `
      <div v-if="variant === 'segmented'" class="tabs-segmented" data-component="tabs">
        <button
          v-for="opt in options" :key="opt.value"
          type="button"
          class="tabs-segmented__item"
          :class="{ 'is-active': modelValue === opt.value }"
          @click="$emit('update:modelValue', opt.value)"
        >
          {{ opt.label }}
          <span v-if="opt.count != null" class="tabs-segmented__count">{{ opt.count }}</span>
        </button>
      </div>
      <div v-else class="detail-tabs" data-component="tabs">
        <button
          v-for="opt in options" :key="opt.value"
          type="button"
          class="detail-tabs__item"
          :class="{ 'is-active': modelValue === opt.value }"
          @click="$emit('update:modelValue', opt.value)"
        >
          {{ opt.label }}
          <span v-if="opt.count != null" style="margin-left:6px;color:var(--ui-text-muted);font-weight:400;">({{ opt.count }})</span>
        </button>
      </div>
    `
  },

  // <Avatar src name size color> — 用户头像（letter fallback + 自动配色）
  // size: small|default|large
  // v3.6
  Avatar: {
    props: {
      src:   { type: String, default: '' },
      name:  { type: String, default: '' },
      size:  { type: String, default: 'default' },
      color: { type: String, default: '' }, // 自定义背景色
    },
    computed: {
      initials() {
        if (!this.name) return '?';
        const parts = this.name.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return this.name.substring(0, 2).toUpperCase();
      },
      sizeClass() { return 'avatar-' + this.size; },
      autoBg() {
        if (this.color) return this.color;
        if (!this.name) return 'var(--ui-bg-muted)';
        const palette = [
          'var(--ui-badge-purple-bg)',
          'var(--ui-badge-blue-bg)',
          'var(--ui-badge-green-bg)',
          'var(--ui-badge-orange-bg)',
          'var(--ui-badge-yellow-bg)',
        ];
        const hash = [...this.name].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        return palette[hash % palette.length];
      },
      autoFg() {
        if (this.color) return 'var(--ui-text-on-brand)';
        if (!this.name) return 'var(--ui-text-muted)';
        const palette = [
          'var(--ui-badge-purple-fg)',
          'var(--ui-badge-blue-fg)',
          'var(--ui-badge-green-fg)',
          'var(--ui-badge-orange-fg)',
          'var(--ui-badge-yellow-fg)',
        ];
        const hash = [...this.name].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        return palette[hash % palette.length];
      },
    },
    template: `
      <div class="avatar" :class="sizeClass" data-component="avatar"
           :style="{ background: autoBg, color: autoFg }">
        <img v-if="src" :src="src" :alt="name" />
        <span v-else>{{ initials }}</span>
      </div>
    `
  },

  // <DetailPage title subtitle :tabs activeTab showBack> + slot:actions + default
  // 详情页组合壳：MainBox + HeaderBox(返回+标题+actions) + 可选 Tabs + ScrollBox
  // v3.5
  DetailPage: {
    props: {
      title:     { type: String, required: true },
      subtitle:  { type: String, default: '' },
      tabs:      { type: Array, default: () => [] },
      activeTab: { type: [String, Number], default: '' },
      showBack:  { type: Boolean, default: true },
    },
    emits: ['update:activeTab', 'back'],
    template: `
      <div class="main-box" data-component="main-box">
        <div class="header-box" data-component="header-box">
          <div class="header-box__top">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              <button v-if="showBack" class="btn-back" type="button" @click="$emit('back')" aria-label="Back">
                <i data-lucide="arrow-left"></i>
              </button>
              <div style="min-width:0;">
                <h1 class="header-box__title">{{ title }}</h1>
                <p v-if="subtitle" class="header-box__subtitle">{{ subtitle }}</p>
              </div>
            </div>
            <div v-if="$slots.actions" class="header-box__right">
              <slot name="actions"></slot>
            </div>
          </div>
          <div v-if="tabs.length" class="header-box__content" style="padding-top:0;border-top:none;">
            <div class="detail-tabs" data-component="detail-tabs">
              <button
                v-for="tab in tabs" :key="tab.value"
                class="detail-tabs__item"
                :class="{ 'is-active': activeTab === tab.value }"
                type="button"
                @click="$emit('update:activeTab', tab.value)"
              >{{ tab.label }}</button>
            </div>
          </div>
        </div>
        <el-scrollbar>
          <div class="scroll-box-inner" data-scroll-box data-component="scroll-box">
            <slot></slot>
          </div>
        </el-scrollbar>
      </div>
    `
  },

  // <Breadcrumb :items separator>
  // items: [{ label, href? }] — 最后一项自动渲染为当前态（无链接，加粗）
  // separator: Lucide 图标名（默认 chevron-right）
  // v3.10 L1
  Breadcrumb: {
    props: {
      items:     { type: Array,  required: true },
      separator: { type: String, default: 'chevron-right' },
    },
    template: `
      <span class="breadcrumb" data-component="breadcrumb">
        <template v-for="(item, i) in items" :key="i">
          <span v-if="i === items.length - 1" class="breadcrumb-current">{{ item.label }}</span>
          <a v-else-if="item.href" :href="item.href">{{ item.label }}</a>
          <span v-else>{{ item.label }}</span>
          <i v-if="i < items.length - 1" :data-lucide="separator"></i>
        </template>
      </span>
    `
  },

  // <FilterBox variant :selectedCount> + slot:default
  // variant: standard | three-zone | selection | compact
  //   standard   — 找数据：搜索 + 筛选 + 操作按钮（默认右侧）
  //   three-zone — 显式三段（左筛选 / 中 spacer .filter-box-spacer / 右操作）
  //   selection  — 批量选中态（主色背景 + 批量操作）
  //   compact    — 紧凑高度
  // selection 变体替代旧 Toolbar；列表页顶部组件统一为 FilterBox
  // v3.10 L1
  FilterBox: {
    props: {
      variant:       { type: String, default: 'standard' }, // standard|three-zone|selection|compact
      selectedCount: { type: Number, default: 0 },
    },
    template: `
      <div
        class="filter-box"
        :class="{
          'filter-box--compact':   variant === 'compact',
          'filter-box--selection': variant === 'selection',
        }"
        data-component="filter-box"
      >
        <slot></slot>
      </div>
    `
  },

  // <I18nField v-model langs required placeholder>
  // 多语言字段 — Tabs 切换 + 圆点状态指示。v3.16 保持 runtime-component。
  // v-model 绑定一个对象，每语言一个 key（例：{ zh: '', en: '', ja: '', ko: '' }）。
  I18nField: {
    props: {
      modelValue:  { type: Object,  required: true },
      langs:       { type: Array,   default: () => [
        { code: 'zh', label: '中文',   required: true  },
        { code: 'en', label: 'English', required: true  },
        { code: 'ja', label: '日本語',  required: false },
        { code: 'ko', label: '한국어',  required: false },
      ]},
      required:    { type: Array,   default: () => [] }, // 覆盖 langs 中的 required 标记
      placeholder: { type: [String, Object], default: '' }, // 字符串或 { zh: '...', en: '...' }
    },
    emits: ['update:modelValue'],
    data() {
      return { activeTab: this.langs[0]?.code || 'zh' };
    },
    computed: {
      effectiveRequired() {
        return this.required.length > 0 ? this.required : this.langs.filter(l => l.required).map(l => l.code);
      },
      currentPlaceholder() {
        if (typeof this.placeholder === 'string') return this.placeholder;
        return this.placeholder[this.activeTab] || '';
      },
    },
    methods: {
      isRequired(code) { return this.effectiveRequired.includes(code); },
      isFilled(code)   { return ((this.modelValue || {})[code] || '').trim().length > 0; },
      dotClass(code) {
        if (this.isFilled(code))   return 'i18n-status-dot--done';
        if (this.isRequired(code)) return 'i18n-status-dot--required';
        return 'i18n-status-dot--missing';
      },
      updateValue(val) {
        this.$emit('update:modelValue', { ...(this.modelValue || {}), [this.activeTab]: val });
      },
    },
    template: `
      <div class="i18n-field" data-component="i18n-field">
        <div class="i18n-field__tabs" role="tablist">
          <button
            v-for="l in langs"
            :key="l.code"
            class="i18n-field__tab"
            :class="{ 'is-active': activeTab === l.code }"
            @click="activeTab = l.code"
            role="tab"
            type="button"
          >
            <span class="i18n-field__tab-name">{{ l.label }}</span>
            <span v-if="isRequired(l.code)" class="i18n-field__tab-required">*</span>
            <span class="i18n-status-dot" :class="dotClass(l.code)"></span>
          </button>
        </div>
        <el-input
          :model-value="(modelValue || {})[activeTab] || ''"
          @update:model-value="updateValue"
          :placeholder="currentPlaceholder"
          size="large"
        ></el-input>
      </div>
    `
  },

};

    const sourceOptions = [

      { id: 'vLLM', label: 'vLLM' },

    const deployModes = {

      ha: { label: { zh: '高可用', en: 'High availability' } },

    const deployments = ref([
      { id: 'dep-qwen-prod-hz', name: 'Qwen3-32B 生产推理', description: '用户侧主链路，来自模型广场固定模型后的部署引导', source: 'guide', status: 'running', model: 'Qwen3-32B', engine: 'vLLM', engineVersion: '0.7.3', mode: 'ha', cloudId: 'aliyun', region: { zh: '华东 2 · 杭州', en: 'cn-hangzhou' }, account: { zh: '阿里云生产账号 A', en: 'Alibaba Production A' }, gpu: 'NVIDIA A100', vram: 80, costCny: 18.6, costUsd: 2.58, qps: 126, latency: 420, readiness: 99.92, uptime: '18d 06h', updatedAt: '10:42', health: 'good', alert: '', createdAt: '2026-05-16 09:18' },
      { id: 'dep-r1-eu-frankfurt', name: 'DeepSeek-R1 欧洲验证', description: '法兰克福资源池就近部署，保留成本与距离优先对比', source: 'guide', status: 'scaling', model: 'DeepSeek-R1-32B', engine: 'SGLang', engineVersion: '0.4.2', mode: 'ha', cloudId: 'aws', region: { zh: '欧洲 · 法兰克福', en: 'eu-central-1' }, account: { zh: 'AWS 国际区账号', en: 'AWS Global Account' }, gpu: 'NVIDIA H200', vram: 141, costCny: 34.2, costUsd: 4.74, qps: 88, latency: 610, readiness: 98.74, uptime: '06d 12h', updatedAt: '10:18', health: 'warn', alert: '正在扩容第二副本，预计 6 分钟后恢复目标冗余。', createdAt: '2026-05-12 14:30' },
      { id: 'dep-coder-staging', name: 'Qwen-Coder-14B 测试环境', description: '研发 IDE 辅助服务，夜间自动缩容', source: 'api', status: 'running', model: 'Qwen-Coder-14B', engine: 'TGI', engineVersion: '2.2.0', mode: 'single', cloudId: 'huawei', region: { zh: '华南 · 贵安', en: 'cn-south-gui-an' }, account: { zh: '华为云主账号', en: 'Huawei Main Account' }, gpu: 'NVIDIA A100', vram: 80, costCny: 17.8, costUsd: 2.47, qps: 34, latency: 530, readiness: 99.64, uptime: '11d 21h', updatedAt: '09:58', health: 'good', alert: '', createdAt: '2026-05-07 11:05' },
      { id: 'dep-llama-flagship', name: 'Llama 3.1 70B 旗舰路由', description: '海外流量入口，高性能路线待账号审批', source: 'plaza', status: 'deploying', model: 'Llama 3.1 70B', engine: 'TensorRT-LLM', engineVersion: '0.12.0', mode: 'ha', cloudId: 'google', region: { zh: '美国西部 · Oregon', en: 'us-west1' }, account: { zh: 'Google Cloud 生产账号', en: 'Google Cloud Production' }, gpu: 'NVIDIA H200', vram: 141, costCny: 36.9, costUsd: 5.12, qps: 0, latency: 0, readiness: 42.00, uptime: '00h 18m', updatedAt: '09:41', health: 'warn', alert: '等待云账号配额审批，当前只完成镜像预热。', createdAt: '2026-05-18 09:22' },
      { id: 'dep-gemma-light', name: 'Gemma2-27B 轻量问答', description: '客服辅助场景，成本优先策略', source: 'guide', status: 'stopped', model: 'Gemma2-27B', engine: 'vLLM', engineVersion: '0.7.3', mode: 'single', cloudId: 'aws', region: { zh: '美国东部 · 弗吉尼亚', en: 'us-east-1' }, account: { zh: 'AWS 国际区账号', en: 'AWS Global Account' }, gpu: 'NVIDIA A100', vram: 80, costCny: 21.7, costUsd: 3.01, qps: 0, latency: 0, readiness: 0, uptime: '00h 00m', updatedAt: '昨日 21:10', health: 'good', alert: '', createdAt: '2026-05-10 17:46' },
      { id: 'dep-qwen-lite-failed', name: 'Qwen3-8B 灰度入口', description: '轻量部署灰度环境，云账号密钥校验失败', source: 'plaza', status: 'failed', model: 'Qwen3-8B', engine: 'TGI', engineVersion: '2.1.1', mode: 'single', cloudId: 'aliyun', region: { zh: '华南 1 · 深圳', en: 'cn-shenzhen' }, account: { zh: '阿里云测试账号', en: 'Alibaba Staging' }, gpu: 'NVIDIA V100', vram: 32, costCny: 10.8, costUsd: 1.49, qps: 0, latency: 0, readiness: 0, uptime: '00h 00m', updatedAt: '昨日 18:24', health: 'bad', alert: '云账号 AccessKey 已过期，请重新授权后重试部署。', createdAt: '2026-05-15 18:02' },
    ]);

    const lt = (value) => {
      if (value == null) return '';
      if (typeof value === 'string' || typeof value === 'number') return value;
      return value[lang.value] || value.zh || value.en || '';
    };
    const cloudMeta = (id) => cloudTabs.find((item) => item.id === id) || cloudTabs[0];
    const cloudAbbr = (id) => cloudMeta(id).abbr || 'ALL';
    const sourceMeta = (id) => sourceOptions.find((item) => item.id === id) || sourceOptions[0];
    const deployModeMeta = (id) => deployModes[id] || deployModes.single;
    const statusMeta = (status) => ({
      running: { status: 'active', label: { zh: '运行中', en: 'Active' }, priority: 3 },
      deploying: { status: 'pending', label: { zh: '部署中', en: 'Deploying' }, priority: 2 },
      scaling: { status: 'pending', label: { zh: '扩容中', en: 'Scaling' }, priority: 1 },
      failed: { status: 'error', label: { zh: '失败', en: 'Failed' }, priority: 0 },
      stopped: { status: 'inactive', label: { zh: '已停止', en: 'Stopped' }, priority: 4 },
    }[status] || { status: 'inactive', label: { zh: '未知', en: 'Unknown' }, priority: 9 });

    const filteredDeployments = computed(() => {
      if (scenarioData.value.mode === 'empty') return [];
      const kw = keyword.value.trim().toLowerCase();
      return deployments.value
        .filter((row) => cloudFilter.value === 'all' || row.cloudId === cloudFilter.value)
        .filter((row) => statusFilter.value === 'all' || row.status === statusFilter.value)
        .filter((row) => sourceFilter.value === 'all' || row.source === sourceFilter.value)
        .filter((row) => engineFilter.value === 'all' || row.engine === engineFilter.value)
        .filter((row) => {
          if (!kw) return true;
          return [row.name, row.description, row.model, row.engine, lt(row.region), lt(row.account), lt(cloudMeta(row.cloudId).label)].join(' ').toLowerCase().includes(kw);
        })
        .slice()
        .sort((a, b) => statusMeta(a.status).priority - statusMeta(b.status).priority || b.updatedAt.localeCompare(a.updatedAt));
    });

    const selectedDeployment = computed(() => filteredDeployments.value.find((row) => row.id === selectedDeploymentId.value) || filteredDeployments.value[0] || null);
    const summary = computed(() => {
      const rows = deployments.value;
      const running = rows.filter((row) => row.status === 'running' || row.status === 'scaling').length;
      const attention = rows.filter((row) => row.status === 'failed' || row.status === 'deploying' || row.health !== 'good').length;
      const monthly = rows.filter((row) => row.status !== 'stopped' && row.status !== 'failed').reduce((sum, row) => sum + row.costCny * 24 * 30, 0);
      const active = rows.filter((row) => row.status === 'running' || row.status === 'scaling');
      const readiness = active.length ? active.reduce((sum, row) => sum + row.readiness, 0) / active.length : 0;
      return {
        running: String(running),
        attention: String(attention),
        cost: '¥' + Math.round(monthly).toLocaleString('en-US'),
        readiness: readiness.toFixed(2) + '%',
      };
    });
    const listMeta = computed(() => copy.value.listPrefix + ' ' + filteredDeployments.value.length + ' / ' + deployments.value.length + ' ' + copy.value.listSuffix);
    const selectedMetrics = computed(() => selectedDeployment.value ? rowMetrics(selectedDeployment.value) : []);
    const selectedKvItems = computed(() => {
      const row = selectedDeployment.value;
      if (!row) return [];
      return [
        { key: 'cloud', label: lang.value === 'zh' ? '部署云商' : 'Cloud', value: lt(cloudMeta(row.cloudId).label) },
        { key: 'region', label: lang.value === 'zh' ? '地域资源池' : 'Region pool', value: lt(row.region) },
        { key: 'account', label: lang.value === 'zh' ? '云账号' : 'Cloud account', value: lt(row.account) },
        { key: 'source', label: lang.value === 'zh' ? '业务来源' : 'Business source', value: lt(sourceMeta(row.source).label) },
        { key: 'created', label: lang.value === 'zh' ? '创建时间' : 'Created at', value: row.createdAt },
        { key: 'cost', label: lang.value === 'zh' ? '小时单价' : 'Hourly price', value: priceLabel(row) },
      ];
    });
    const selectedSteps = computed(() => {
      const row = selectedDeployment.value;
      if (!row) return [];
      if (row.status === 'failed') {
        return [
          { label: lang.value === 'zh' ? '创建' : 'Created', state: 'done' },
          { label: lang.value === 'zh' ? '校验失败' : 'Validation failed', state: 'current' },
          { label: lang.value === 'zh' ? '重试' : 'Retry', state: 'todo' },
        ];
      }
      if (row.status === 'deploying') {
        return [
          { label: lang.value === 'zh' ? '创建' : 'Created', state: 'doneGreen' },
          { label: lang.value === 'zh' ? '镜像预热' : 'Image warmup', state: 'current' },
          { label: lang.value === 'zh' ? '运行' : 'Serving', state: 'todo' },
        ];
      }
      if (row.status === 'stopped') {
        return [
          { label: lang.value === 'zh' ? '创建' : 'Created', state: 'doneGreen' },
          { label: lang.value === 'zh' ? '运行' : 'Served', state: 'done' },
          { label: lang.value === 'zh' ? '停止' : 'Stopped', state: 'current' },
        ];
      }
      return [
        { label: lang.value === 'zh' ? '创建' : 'Created', state: 'doneGreen' },
        { label: lang.value === 'zh' ? '部署' : 'Deployed', state: 'doneGreen' },
        { label: lang.value === 'zh' ? (row.status === 'scaling' ? '扩容中' : '运行中') : (row.status === 'scaling' ? 'Scaling' : 'Serving'), state: 'current' },
        { label: lang.value === 'zh' ? '监控' : 'Monitoring', state: 'todo' },
      ];
    });
    const recentEvents = computed(() => {
      const row = selectedDeployment.value;
      if (!row) return [];
      return [
        { id: 'evt-1', icon: row.status === 'failed' ? 'circle-x' : 'activity', time: row.updatedAt, title: { zh: lt(statusMeta(row.status).label), en: lt(statusMeta(row.status).label) }, desc: { zh: row.alert || '状态同步完成，指标已刷新。', en: row.alert || 'Status synced and metrics refreshed.' } },
        { id: 'evt-2', icon: 'wallet', time: '08:30', title: { zh: '成本采样', en: 'Cost sample' }, desc: { zh: '按当前 GPU 与副本数更新小时单价。', en: 'Hourly price updated by GPU and replica count.' } },
        { id: 'evt-3', icon: 'shield-check', time: '昨日', title: { zh: '账号权限校验', en: 'Account permission check' }, desc: { zh: '云账号、地域与配额校验通过。', en: 'Cloud account, region, and quota checks passed.' } },
      ];
    });

    function rowMetrics(row) {
      return [
        { key: 'qps', label: 'QPS', value: row.qps ? String(row.qps) : '-', accent: row.qps > 0 },
        { key: 'p95', label: 'P95', value: row.latency ? row.latency + 'ms' : '-', accent: false },
        { key: 'ready', label: lang.value === 'zh' ? '可用性' : 'Ready', value: row.readiness ? row.readiness.toFixed(2) + '%' : '-', accent: row.readiness >= 99 },
      ];
    }
    function priceLabel(row) {
      return '¥' + row.costCny.toFixed(1) + ' / $' + row.costUsd.toFixed(2);
    }
    function healthColor(row) {
      return row.health === 'bad' ? 'red' : row.health === 'warn' ? 'orange' : 'green';
    }
    function healthLabel(row) {
      return row.health === 'bad' ? copy.value.healthBad : row.health === 'warn' ? copy.value.healthWarn : copy.value.healthGood;
    }
    function cloudCount(id) {
      if (id === 'all') return deployments.value.length;
      return deployments.value.filter((row) => row.cloudId === id).length;
    }
    function resetFilters() {
      keyword.value = '';
      cloudFilter.value = 'all';
      statusFilter.value = 'all';
      sourceFilter.value = 'all';
      engineFilter.value = 'all';
      activeScenario.value = 'normal';
      nextTick(() => lucide.createIcons());
    }
    function selectDeployment(row) {
      selectedDeploymentId.value = row.id;
      nextTick(() => lucide.createIcons());
    }
    function openDetail(row) {
      selectDeployment(row);
      drawerVisible.value = true;
      nextTick(() => lucide.createIcons());
    }
    function messageInfo(text) {
      message.info(text);
      nextTick(() => lucide.createIcons());
    }
    function toggleTheme() {
      isDark.value = !isDark.value;
      const vars = isDark.value ? darkVars : lightVars;
      Object.entries(vars).forEach(([key, value]) => document.documentElement.style.setProperty(key, value));
      nextTick(() => lucide.createIcons());
    }
    function toggleLang() {
      lang.value = lang.value === 'en' ? 'zh' : 'en';
      nextTick(() => lucide.createIcons());
    }
    watch([activeNav, activeTab, activeScenario, drawerVisible, keyword, cloudFilter, statusFilter, sourceFilter, engineFilter], () => {
      nextTick(() => lucide.createIcons());
    });
    watch(filteredDeployments, (rows) => {
      if (rows.length && !rows.some((row) => row.id === selectedDeploymentId.value)) selectedDeploymentId.value = rows[0].id;
    });
    const logoSrc = computed(() => isDark.value ? LOGO_DARK : LOGO_DARK);

    return {
      isDark, lang, activeTab, activeNav, shell, copy, logoSrc,
      scenarios, activeScenario, defaultScenario, hasScenarios, isCustomScenario, scenarioData, scenarioLabel,
      keyword, cloudFilter, statusFilter, sourceFilter, engineFilter,
      cloudTabs, statusOptions, sourceOptions, engineOptions, deployments, filteredDeployments, selectedDeployment, selectedMetrics, selectedKvItems, selectedSteps, recentEvents, drawerVisible, summary, listMeta,
      lt, cloudMeta, cloudAbbr, sourceMeta, deployModeMeta, statusMeta, rowMetrics, priceLabel, healthColor, healthLabel, cloudCount, resetFilters, selectDeployment, openDetail, messageInfo, toggleTheme, toggleLang,
    };
  },
  template: document.getElementById('prototype-template').innerHTML,
});

for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, comp);
}
// §5.0 注册原型运行时组件库
for (const [name, comp] of Object.entries(PrototypeComponents)) {
  app.component(name, comp);
}
app.use(ElementPlus);
app.mount('#app');
lucide.createIcons();
</script>
