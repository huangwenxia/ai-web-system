.api-code-body {
  flex: 1 1 auto;
  margin: 0;
  min-height: clamp(288px, 34vh, 348px);
  max-height: clamp(288px, 34vh, 348px);
  padding: 13px 16px;
  background: color-mix(in srgb, var(--ui-bg-muted) 46%, var(--ui-bg-card));
  color: #0f172a;
  line-height: 1.54;
  white-space: pre;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(161, 161, 170, .42) transparent;
}
.api-workbench {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(336px, 376px);
  gap: 0;
  align-items: stretch;
  min-height: 474px;
  padding: 0;
  background: var(--ui-bg-card);
}
.api-workbench.is-unavailable {
  min-height: 326px;
  overflow: hidden;
  padding: 0;
  background: var(--ui-bg-card);
}
.api-workbench.is-unavailable::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .30) 0%, rgba(255, 255, 255, .46) 100%),
    radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .08), transparent 46%);
  backdrop-filter: blur(.5px);
}
.api-panel--preview,
.api-request-index--preview {
  pointer-events: none;
  user-select: none;
  opacity: .76;
  filter: saturate(.36);
}
.api-workbench.is-unavailable .api-language-tabs {
  min-height: 38px;
  border-color: color-mix(in srgb, var(--ui-border-soft) 76%, transparent);
}
.api-workbench.is-unavailable .api-language-tab {
  min-height: 36px;
  padding: 3px 13px;
  line-height: 19.5px;
  color: var(--ui-text-muted);
  cursor: default;
}
.api-workbench.is-unavailable .api-language-tab.is-active {
  color: var(--ui-text-secondary);
  background: var(--ui-bg-card);
}
.api-workbench.is-unavailable .api-snippet {
  border-color: color-mix(in srgb, var(--ui-border-soft) 76%, transparent);
}
.api-workbench.is-unavailable .api-snippet-head {
  background: color-mix(in srgb, var(--ui-bg-muted) 60%, var(--ui-bg-card));
}
.api-workbench.is-unavailable .api-copy-button {
  color: var(--ui-text-muted);
  cursor: default;
}
.api-workbench.is-unavailable .api-code-body {
  color: var(--ui-text-secondary);
}
.api-workbench.is-unavailable .api-code-token--method,
.api-workbench.is-unavailable .api-code-token--variable,
.api-workbench.is-unavailable .api-code-token--number,
.api-workbench.is-unavailable .api-code-token--string,
.api-workbench.is-unavailable .api-code-token--flag {
  color: var(--ui-text-muted);
}
.api-workbench.is-unavailable .api-index-section:first-child .api-index-count {
  background: var(--ui-bg-card);
  color: var(--ui-text-muted);
}
.api-request-index--preview .api-index-section__head {
  min-height: 36px;
  padding: 3px 12px;
  background: color-mix(in srgb, var(--ui-bg-muted) 18%, var(--ui-bg-card));
}
.api-request-index--preview .api-index-section__label {
  color: color-mix(in srgb, var(--ui-text-muted) 82%, var(--ui-text-placeholder));
  font-size: 12.5px;
  font-weight: 520;
  line-height: 18.75px;
}
.api-preview-code {
  display: flex;
  flex-direction: column;
  gap: 11px;
  width: min(620px, 86%);
}
.api-code-body--preview {
  display: flex;
  align-items: flex-start;
  white-space: normal;
}
.api-preview-code__line,
.api-preview-cell,
.api-preview-chip {
  display: block;
  border-radius: var(--ui-radius-pill);
  background: color-mix(in srgb, var(--ui-text-placeholder) 18%, transparent);
}
.api-preview-code__line {
  height: 12px;
}
.api-preview-code__line:nth-child(1) { width: 54%; }
.api-preview-code__line:nth-child(2) { width: 72%; margin-left: 28px; }
.api-preview-code__line:nth-child(3) { width: 64%; margin-left: 28px; }
.api-preview-code__line:nth-child(4) { width: 58%; margin-left: 28px; }
.api-preview-code__line:nth-child(5) { width: 68%; margin-left: 28px; }
.api-preview-code__line:nth-child(6) { width: 76%; margin-left: 28px; }
.api-preview-code__line:nth-child(7) { width: 84%; margin-left: 28px; }
.api-preview-row {
  display: grid;
  grid-template-columns: minmax(76px, .42fr) minmax(0, .58fr);
  gap: 10px;
  align-items: center;
  min-height: 31px;
  padding: 7px 0;
}
.api-preview-row + .api-preview-row,
.api-preview-param + .api-preview-param {
  border-top: 1px solid var(--ui-border-soft);
}
.api-preview-cell {
  height: 11px;
}
.api-preview-row .api-preview-cell:first-child { width: min(100%, 96px); }
.api-preview-row .api-preview-cell:last-child { width: min(100%, 148px); }
.api-preview-param {
  padding: 9px 0 10px;
}
.api-preview-param__main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.api-preview-param__name {
  width: 112px;
  height: 12px;
}
.api-preview-param__meta {
  width: 86px;
  height: 11px;
}
.api-preview-param__default {
  width: 156px;
  height: 10px;
  margin-top: 8px;
  opacity: .72;
}
.api-preview-lock {
  position: absolute;
  inset: 0 376px 0 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 24px 28px;
  pointer-events: none;
}
.api-preview-lock__badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  max-width: none;
  min-height: 44px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  opacity: .28;
  transform: translateY(-8px);
}
.api-preview-lock__icon {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  border: 0;
  border-color: transparent;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--ui-text-placeholder) 88%, var(--ui-bg-muted));
}
.api-preview-lock__icon [data-lucide],
.api-preview-lock__icon svg {
  width: 32px;
  height: 32px;
  stroke-width: 1.75;
}
.api-panel--deferred {
  padding: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
}
.api-language-tabs--deferred {
  pointer-events: none;
}
.api-language-tabs--deferred .api-language-tab {
  cursor: default;
}
.api-snippet--deferred {
  min-height: 246px;
  border: 1px dashed var(--ui-border-default);
  border-radius: var(--ui-radius-control);
  background: var(--ui-bg-card);
}
.api-deferred-empty {
  flex: 1 1 auto;
  min-height: 244px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 24px;
  text-align: center;
  color: var(--ui-text-muted);
  transform: none;
}
.api-deferred-empty__icon {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  border: 1px solid color-mix(in srgb, var(--api-state-color) 14%, var(--ui-border-soft));
  border-radius: var(--ui-radius-control);
  background: color-mix(in srgb, var(--api-state-subtle) 18%, var(--ui-bg-card));
  color: var(--api-state-color);
}
.api-deferred-empty__icon [data-lucide],
.api-deferred-empty__icon svg {
  width: var(--ui-icon-base);
  height: var(--ui-icon-base);
}
.api-deferred-empty__copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.api-deferred-empty__title {
  color: var(--ui-text-primary);
  font-size: 13px;
  font-weight: 620;
  line-height: 1.42;
}
.api-deferred-empty__hint {
  color: var(--ui-text-muted);
  font-size: 12px;
  line-height: 1.5;
  max-width: 420px;
}
.api-request-index--deferred .api-index-pane {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 13px;
}
.api-request-index--deferred .api-index-section {
  flex: 1 1 0;
  min-height: 0;
}
.api-request-index--deferred .api-index-section--body .api-index-pane {
  min-height: 0;
}
.api-request-index--deferred .api-index-section:first-child,
.api-request-index--deferred .api-index-section--body {
  flex: 1 1 0;
  max-height: none;
}
.api-index-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  color: var(--ui-text-muted);
  font-size: 12px;
  line-height: 1.45;
  text-align: center;
}
.api-index-empty i,
.api-index-empty [data-lucide],
.api-index-empty svg {
  width: var(--ui-icon-sm);
  height: var(--ui-icon-sm);
  flex: 0 0 auto;
  color: color-mix(in srgb, var(--api-state-color) 44%, var(--ui-text-muted));
}
.api-generation-panel {
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--api-state-color) 12%, var(--ui-border-soft));
  border-radius: var(--ui-radius-control);
  background: var(--ui-bg-card);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ui-bg-card) 80%, transparent);
}
.api-generation-panel__summary {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  min-height: 50px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--ui-border-soft);
  background: linear-gradient(90deg, color-mix(in srgb, var(--api-state-subtle) 18%, var(--ui-bg-card)) 0%, var(--ui-bg-card) 72%);
}
.api-generation-panel__icon,
.api-generation-item__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid color-mix(in srgb, var(--api-state-color) 18%, var(--ui-border-soft));
  border-radius: var(--ui-radius-control);
  background: color-mix(in srgb, var(--api-state-subtle) 30%, var(--ui-bg-card));
  color: var(--api-state-color);
  flex: 0 0 auto;
}
.api-generation-panel__icon {
  width: 30px;
  height: 30px;
}
.api-generation-panel__icon [data-lucide],
.api-generation-panel__icon svg {
  width: var(--ui-icon-base);
  height: var(--ui-icon-base);
}
.api-generation-panel__copy {
  min-width: 0;
}
.api-generation-panel__title {
  color: var(--ui-text-primary);
  font-size: 13px;
  font-weight: 620;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.api-generation-panel__hint {
  margin-top: 1px;
  color: var(--ui-text-muted);
  font-size: 12px;
  line-height: 1.42;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.api-generation-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: color-mix(in srgb, var(--ui-bg-muted) 12%, var(--ui-bg-card));
}
.api-generation-item {
  min-width: 0;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  border-right: 1px solid var(--ui-border-soft);
}
.api-generation-item:last-child {
  border-right: 0;
}
.api-generation-item__main {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.api-generation-item__icon {
  width: 24px;
  height: 24px;
}
.api-generation-item__icon [data-lucide],
.api-generation-item__icon svg {
  width: var(--ui-icon-sm);
  height: var(--ui-icon-sm);
}
.api-generation-item__label {
  min-width: 0;
  color: var(--ui-text-primary);
  font-size: 13px;
  font-weight: 590;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.api-generation-item__status {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 16px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--api-state-color) 58%, var(--ui-text-muted));
  font-size: 11.5px;
  font-weight: 520;
  white-space: nowrap;
}
.api-generation-item__status::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: var(--ui-radius-pill);
  background: currentColor;
}
@media (max-width: 1180px) {
  .api-generation-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .api-generation-item:nth-child(2n) {
    border-right: 0;
  }
  .api-generation-item:nth-child(n + 3) {
    border-top: 1px solid var(--ui-border-soft);
  }
}
@media (max-width: 760px) {
  .api-generation-panel__summary {
    grid-template-columns: auto minmax(0, 1fr);
    align-items: flex-start;
  }
  .api-generation-panel__summary .api-snippet-state {
    display: none;
  }
  .api-generation-panel__title,
  .api-generation-panel__hint {
    white-space: normal;
  }
  .api-generation-list {
    grid-template-columns: 1fr;
  }
  .api-generation-item {
    min-height: 56px;
    border-right: 0;
    border-top: 1px solid var(--ui-border-soft);
  }
  .api-generation-item:first-child {
    border-top: 0;
  }
}
.api-panel--example {
  padding: 14px;
  background: transparent;
  border: 0;
  box-shadow: none;
}
.api-code-card--docs {
  display: flex;
  flex-direction: column;
  height: 100%;
  border: 0;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
}
.api-snippet-state {
  display: inline-flex;
  align-items: center;
  min-height: 18px;
  padding: 0 7px;
  border-radius: var(--ui-radius-pill);
  background: color-mix(in srgb, var(--api-state-subtle) 18%, var(--ui-bg-card));
  color: color-mix(in srgb, var(--api-state-color) 78%, var(--ui-text-muted));
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.api-language-tabs {
  display: flex;
  align-items: stretch;
  min-height: 34px;
  overflow-x: auto;
  border: 1px solid color-mix(in srgb, var(--ui-border-soft) 70%, transparent);
  border-bottom: 1px solid var(--ui-border-soft);
  border-radius: var(--ui-radius-control) var(--ui-radius-control) 0 0;
  background: color-mix(in srgb, var(--ui-bg-muted) 68%, var(--ui-bg-card));
}
.api-language-tab {
  min-width: 76px;
  padding: 0 13px;
  border: 0;
  border-right: 1px solid transparent;
  background: transparent;
  color: var(--ui-text-secondary);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.api-language-tab:not(.is-active):hover {
  background: var(--ui-bg-card);
  color: var(--ui-text-primary);
}
.api-language-tab.is-active {
  background: var(--ui-bg-card);
  color: var(--ui-color-primary);
  border-right-color: var(--ui-border-soft);
  box-shadow: inset 0 -2px 0 var(--ui-color-primary);
}
.api-snippet {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  margin: 0;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--ui-border-soft) 68%, transparent);
  border-top: 0;
  border-radius: 0 0 var(--ui-radius-control) var(--ui-radius-control);
  background: color-mix(in srgb, var(--ui-bg-muted) 46%, var(--ui-bg-card));
}
.api-snippet.api-snippet--deferred {
  min-height: 246px;
  border: 1px dashed var(--ui-border-default);
  border-radius: var(--ui-radius-control);
  background: var(--ui-bg-card);
}
.api-code-body::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.api-code-body::-webkit-scrollbar-track {
  background: transparent;
}
.api-code-body::-webkit-scrollbar-thumb {
  border-radius: var(--ui-radius-pill);
  background: rgba(161, 161, 170, .36);
}
.api-code-body:hover::-webkit-scrollbar-thumb {
  background: rgba(113, 113, 122, .42);
}
.api-snippet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 30px;
  padding: 0 12px;
  border-bottom: 1px solid var(--ui-border-soft);
  background: color-mix(in srgb, var(--ui-bg-card) 84%, var(--ui-bg-muted));
}
.api-snippet-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ui-text-secondary);
  font-weight: 600;
}
.api-snippet-title i {
  width: 14px;
  height: 14px;
}
.api-copy-button {
  border: 0;
  background: transparent;
  color: var(--ui-text-secondary);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.api-copy-button:hover {
  color: var(--ui-color-primary);
}
.api-code-token--method {
  color: #5b4ce2;
}
.api-code-token--variable,
.api-code-token--number {
  color: #dc2626;
}
.api-code-token--string {
  color: #b42318;
}
.api-code-token--flag {
  color: #334155;
}
.api-request-index {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-self: stretch;
  min-width: 0;
  min-height: 0;
  max-height: none;
  overflow: hidden;
  padding: 14px 14px 14px 13px;
  border: 0;
  border-left: 1px solid color-mix(in srgb, var(--ui-border-soft) 72%, transparent);
  border-radius: 0;
  background: color-mix(in srgb, var(--ui-bg-muted) 6%, var(--ui-bg-card));
  box-shadow: none;
}
.api-index-section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--ui-border-soft) 76%, transparent);
  border-radius: var(--ui-radius-control);
  background: var(--ui-bg-card);
  box-shadow: none;
}
.api-index-section:first-child {
  flex: 0 0 auto;
}
.api-index-section--body {
  flex: 1 1 auto;
  max-height: none;
}
.api-index-section + .api-index-section {
  border-top: 1px solid var(--ui-border-soft);
}
.api-index-section__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 32px;
  padding: 0 12px;
  border-bottom: 1px solid var(--ui-border-soft);
  background: color-mix(in srgb, var(--ui-bg-muted) 42%, var(--ui-bg-card));
}
.api-index-section__label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ui-text-primary);
  font-size: 12.5px;
  font-weight: 640;
}
.api-index-count {
  min-width: 18px;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--ui-radius-pill);
  background: var(--ui-bg-card);
  color: var(--ui-text-muted);
  font-family: var(--ui-font-mono);
  font-size: 11px;
  line-height: 18px;
  box-shadow: inset 0 0 0 1px var(--ui-border-soft);
}
.api-index-section:first-child .api-index-count {
  background: var(--ui-color-primary-soft);
  color: var(--ui-color-primary);
}
.api-index-pane {
  flex: 0 1 auto;
  min-height: 0;
  max-height: 220px;
  overflow: auto;
  padding: 3px 12px;
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}
.api-index-section:hover .api-index-pane {
  scrollbar-color: rgba(161, 161, 170, .45) transparent;
}
.api-index-pane::-webkit-scrollbar {
  width: 5px;
}
.api-index-pane::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: var(--ui-radius-pill);
}
.api-index-section:hover .api-index-pane::-webkit-scrollbar-thumb {
  background: rgba(161, 161, 170, .45);
}
.api-index-section--body .api-index-pane {
  max-height: none;
}
.api-body-list {
  display: flex;
  flex-direction: column;
}
.api-body-item {
  padding: 9px 0 10px;
}
.api-body-item + .api-body-item {
  border-top: 1px solid var(--ui-border-soft);
}
.api-body-item__main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}
.api-body-item__main > span:first-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.api-body-item__badges {
  display: inline-flex;
  align-items: center;
  gap: 0;
  flex: 0 0 auto;
  min-width: 0;
}
.api-body-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ui-text-secondary);

// ──────────────────────────────────────────────
// §5.0 Prototype Component Library —— 运行时组件库
// 配套 CSS 见 <style> 块；API 文档见 SKILL.md §5.0.5
// 使用：注册为 Vue Global Component，原型直接 <KpiCard />
// ──────────────────────────────────────────────
const PrototypeComponents = {

  // <HeaderBox title> + slot:actions + default slot（filter/extra 内容）
  // v6.9.3: 移除 subtitle——所有页面一律不传副标题（AI-USAGE §默认克制 ①）
  HeaderBox: {
    props: {
      title:    { type: String, required: true },
    },
    template: `
      <div class="header-box" data-component="header-box">
        <div class="header-box__top">
          <div style="min-width:0;">
            <h1 class="header-box__title">{{ title }}</h1>
          </div>
          <div v-if="$slots.actions" class="header-box__right">
            <slot name="actions"></slot>
          </div>
        </div>
        <div v-if="$slots.default" class="header-box__content">
          <slot></slot>
        </div>
      </div>
    `
  },

  // <KpiCard title value icon iconColor trend trendType>
  KpiCard: {
    props: {
      title:     { type: String, required: true },
      value:     { type: [String, Number], default: '' },
      icon:      { type: String, default: '' },
      iconColor: { type: String, default: 'primary' }, // primary|success|warning|destructive
      trend:     { type: String, default: '' },
      trendType: { type: String, default: 'neutral' }, // up|down|neutral
    },
    template: `
      <div class="kpi-card" data-component="kpi-card">
        <div class="kpi-card__header">
          <span class="kpi-card__title">{{ title }}</span>
          <i v-if="icon" :data-lucide="icon" class="kpi-card__icon" :class="'kpi-card__icon--' + iconColor"></i>
        </div>
        <div class="kpi-card__value"><slot>{{ value }}</slot></div>
        <div v-if="trend || $slots.trend" class="kpi-card__trend" :class="'kpi-card__trend--' + trendType">
          <slot name="trend">{{ trend }}</slot>
        </div>
      </div>
    `
  },

  // <StatusBadge status [label]> — status: active|pending|expiringSoon|inactive|revoked|expired|error
  StatusBadge: {
    props: {
      status: { type: String, required: true },
      label:  { type: String, default: '' },
    },
    computed: {
      badgeClass() {
        return {
          active:        'badge-green',
          pending:       'badge-orange',
          expiringSoon:  'badge-orange',
          inactive:      'badge-muted',
          revoked:       'badge-red',
          expired:       'badge-muted',
          error:         'badge-red',
        }[this.status] || 'badge-muted';
      }
    },
    template: `
      <span class="status-badge" :class="badgeClass" data-component="status-badge">
        <span class="status-badge__dot"></span>
        <span><slot>{{ label || status }}</slot></span>
      </span>
    `
  },

  // <EmptyState icon title hint> + slot:action
  EmptyState: {
    props: {
      icon:  { type: String, default: 'inbox' },
      title: { type: String, required: true },
      hint:  { type: String, default: '' },
    },
    template: `
      <div class="empty-state" data-component="empty-state">
        <i :data-lucide="icon" class="empty-state__icon"></i>
        <p class="empty-state__title">{{ title }}</p>
        <p v-if="hint" class="empty-state__hint">{{ hint }}</p>
        <div v-if="$slots.action"><slot name="action"></slot></div>
      </div>
    `
  },

  // <Alert variant title desc closable> — variant: success|warning|error|info
  Alert: {
    props: {
      variant:  { type: String, default: 'info' },
      title:    { type: String, required: true },
      desc:     { type: String, default: '' },
      closable: { type: Boolean, default: false },
    },
    data() { return { visible: true }; },
    computed: {
      iconName() {
        return {
          success: 'circle-check',
          warning: 'triangle-alert',
          error:   'circle-x',
          info:    'info',
        }[this.variant] || 'info';
      }
    },
    template: `
      <div v-if="visible" class="alert" :class="'alert-' + variant" data-component="alert">
        <i :data-lucide="iconName" class="alert-icon"></i>
        <div class="alert-body">
          <p class="alert-title">{{ title }}</p>
          <p v-if="desc || $slots.default" class="alert-desc"><slot>{{ desc }}</slot></p>
        </div>
        <button v-if="closable" class="alert-close" type="button" @click="visible = false" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
    `
  },

  // <UsageBar used total unit color showText> — color: auto|primary|success|warning|danger
  // v3.5
  UsageBar: {
    props: {
      used:     { type: Number, required: true },
      total:    { type: Number, required: true },
      unit:     { type: String, default: '' },
      color:    { type: String, default: 'auto' },
      showText: { type: Boolean, default: true },
    },
    computed: {
      percent() {
        if (!this.total) return 0;
        return Math.min(100, (this.used / this.total) * 100);
      },
      autoColor() {
        if (this.color !== 'auto') return this.color;
        if (this.percent >= 100) return 'danger';
        if (this.percent >= 80)  return 'warning';
        return 'primary';
      },
    },
    template: `
      <div class="usage-bar" data-component="usage-bar">
        <div class="usage-bar__track">
          <div class="usage-bar__fill" :class="'usage-bar__fill--' + autoColor" :style="{ width: percent + '%' }"></div>
        </div>
        <span v-if="showText" class="usage-bar__text">
          <slot>{{ used }}{{ unit }} / {{ total }}{{ unit }}</slot>
        </span>
      </div>
    `
  },

  // <KvCard title :items hover labelWidth> + slot:headerRight + slot:[item.key] for custom value
  // items: [{ label: '名称', value: '...', key: 'name' }]
  // v3.5
  KvCard: {
    props: {
      title:      { type: String, default: '' },
      items:      { type: Array, default: () => [] },
      labelWidth: { type: String, default: 'auto' },
      hover:      { type: Boolean, default: false },
    },
    template: `
      <div class="kv-card" :class="{ 'kv-card--hover': hover }" data-component="kv-card">
        <div v-if="title || $slots.headerRight" class="kv-card__head">
          <div class="kv-card__title">{{ title }}</div>
          <div v-if="$slots.headerRight" class="kv-card__head-right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="kv-card__body">
          <div v-for="(it, i) in items" :key="it.key || i" class="kv-card__row">
            <div class="kv-card__label" :style="labelWidth !== 'auto' ? { width: labelWidth } : {}">{{ it.label }}：</div>
            <div class="kv-card__value">
              <slot :name="it.key || ('item' + i)" :item="it">{{ it.value }}</slot>
            </div>
          </div>
          <slot></slot>
        </div>
      </div>
    `
  },

  // <DetailSection title> + slot:headerRight + default
  // 左侧 4px 主色竖条 + 标题，详情页 section 标准
  // v3.5
  DetailSection: {
    props: {
      title: { type: String, required: true },
    },
    template: `
      <div class="detail-section" data-component="detail-section">
        <div class="detail-section__head">
          <span class="detail-section__title">{{ title }}</span>
          <div v-if="$slots.headerRight" class="detail-section__right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="detail-section__body">
          <slot></slot>
        </div>
      </div>
    `
  },

  // <TableActions :actions max>
  // actions: [{ label, type?, icon?, disabled?, danger?, onClick }]
  // ≤max 显示为 link button，>max 自动收纳到 ... 更多 dropdown
  // v3.5
  TableActions: {
    props: {
      actions: { type: Array, required: true },
      max:     { type: Number, default: 3 },
    },
    computed: {
      visibleActions()  { return this.actions.slice(0, this.max); },
      overflowActions() { return this.actions.slice(this.max); },
    },
    methods: {
      handle(a, e) { if (a.onClick) a.onClick(e); },
    },
    template: `
      <div class="table-actions" data-component="table-actions">
        <el-button
          v-for="(a, i) in visibleActions" :key="'v' + i"
          link
          :type="a.danger ? 'danger' : (a.type || 'primary')"
          :disabled="a.disabled"
          @click="handle(a, $event)"
        >
          <i v-if="a.icon" :data-lucide="a.icon" style="width:14px;height:14px;margin-right:4px;"></i>
          {{ a.label }}
        </el-button>
        <el-dropdown v-if="overflowActions.length" trigger="click">
          <el-button link type="primary">
            <i data-lucide="ellipsis" style="width:16px;height:16px;"></i>
          </el-button>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item
                v-for="(a, i) in overflowActions" :key="'o' + i"
                :disabled="a.disabled"
                :class="{ 'is-danger': a.danger }"
                @click="handle(a, $event)"
              >
                <i v-if="a.icon" :data-lucide="a.icon" style="width:14px;height:14px;margin-right:6px;"></i>
                {{ a.label }}
              </el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </div>
    `
  },

  // <PageHeader title eyebrow eyebrowIcon backLabel statusLabel statusColor>（v6.9.3 无 subtitle；back 渲染在标题左侧）
  //   + slot:actions + slot:avatar + emit:back
  // 段级 / 页级标题（无 card 边框）。HeaderBox 是页级 card 容器；PageHeader 是无边框轻量标题。
  // v6.4 B-Pro Designer 标准（实战验证 REQ-20260515 EU + Provider 32 个 section 标题）：
  //   - title 22px / weight 700 (type scale 第 3 档)
  //   - actions align-items: flex-end baseline 对齐
  //   - eyebrow muted 色（不抢 CTA 戏）
  //   - status pill 5 个 variant (green / orange / red / purple / muted)
  //   - 详情页支持 backLabel + emit:back，头像支持 slot:avatar
  PageHeader: {
    props: {
      title:        { type: String, required: true },
      eyebrow:      { type: String, default: '' },
      eyebrowIcon:  { type: String, default: '' },
      backLabel:    { type: String, default: '' },   // v6.9.3: 返回链接文案；back 固定渲染在标题左侧 inline
      statusLabel:  { type: String, default: '' },
      statusColor:  { type: String, default: 'muted' }, // green | orange | red | purple | muted
      // v6.9.3 起移除 subtitle：所有页面一律不传副标题（见 AI-USAGE §默认克制 ①）
    },
    emits: ['back'],
    template: `
      <div data-component="page-header-pro">
        <div class="page-header">
          <div class="page-header__left">
            <div v-if="eyebrow" class="page-header__eyebrow">
              <span v-if="!eyebrowIcon" class="page-header__eyebrow-dot"></span>
              <i v-else :data-lucide="eyebrowIcon"></i>
              <span>{{ eyebrow }}</span>
            </div>
            <div class="page-header__title-row">
              <a v-if="backLabel" class="page-header__back" href="javascript:void(0)" :title="backLabel" @click="$emit('back')">
                <i data-lucide="chevron-left"></i>
                <span>{{ backLabel }}</span>
              </a>
              <slot name="avatar"></slot>
              <h1 class="page-header__title">{{ title }}</h1>
              <span v-if="statusLabel" :class="['page-header__status-pill', 'page-header__status-pill--' + statusColor]">{{ statusLabel }}</span>
            </div>
          </div>
          <div v-if="$slots.actions" class="page-header__right">
            <slot name="actions"></slot>
          </div>
        </div>
      </div>
    `
  },

  // <MetricsStrip :items cols divided>
  // items: [{ label, value, sub?, accent?, slot?, key? }]
  // 等分指标条（Hero 详情 / Overview 必备），cols 不传时按 items.length 自动等分
  // v3.8
  MetricsStrip: {
    props: {
      items:   { type: Array,   required: true },
      cols:    { type: Number,  default: 0 },
      divided: { type: Boolean, default: true },
    },
    template: `
      <div
        class="metrics-strip"
        :class="{ 'metrics-strip--divided': divided }"
        :style="{ gridTemplateColumns: 'repeat(' + (cols || items.length) + ', minmax(0, 1fr))' }"
        data-component="metrics-strip"
      >
        <div v-for="(item, i) in items" :key="item.key || i" class="metrics-strip__cell">
          <div class="metrics-strip__label">{{ item.label }}</div>
          <div class="metrics-strip__value" :class="{ 'metrics-strip__value--accent': item.accent }">
            <slot v-if="item.slot" :name="item.slot" :item="item">{{ item.value }}</slot>
            <template v-else>{{ item.value }}</template>
          </div>
          <div v-if="item.sub" class="metrics-strip__sub">{{ item.sub }}</div>
        </div>
      </div>
    `
  },

  // <HeroBand eyebrow eyebrowIcon title desc :points tone> + slot:right
  // Overview 引导带：营销叙事 + 右侧 CTA/选择卡
  // tone: primary | neutral | gradient
  // v3.8
  HeroBand: {
    props: {
      eyebrow:     { type: String, default: '' },
      eyebrowIcon: { type: String, default: '' },
      title:       { type: String, required: true },
      desc:        { type: String, default: '' },
      points:      { type: Array,  default: () => [] }, // [{icon, title, desc}]
      tone:        { type: String, default: 'primary' },
    },
    template: `
      <div class="hero-band" :class="['hero-band--' + tone, { 'hero-band--with-right': !!$slots.right }]" data-component="hero-band">
        <div class="hero-band__left">
          <div v-if="eyebrow" class="hero-band__eyebrow">
            <i v-if="eyebrowIcon" :data-lucide="eyebrowIcon"></i>
            <span>{{ eyebrow }}</span>
          </div>
          <h1 class="hero-band__title">{{ title }}</h1>
          <p v-if="desc" class="hero-band__desc">{{ desc }}</p>
          <div v-if="points.length" class="hero-band__points">
            <div v-for="(p, i) in points" :key="i" class="hero-band__point">
              <i v-if="p.icon" :data-lucide="p.icon"></i>
              <div>
                <strong v-if="p.title">{{ p.title }}</strong>
                <span v-if="p.desc">{{ p.desc }}</span>
              </div>
            </div>
          </div>
        </div>
        <div v-if="$slots.right" class="hero-band__right">
          <slot name="right"></slot>
        </div>
      </div>
    `
  },

  // <StepPills :steps separator>
  // steps: [{ label, state: 'done'|'doneGreen'|'current'|'todo' }]
  // 微型流程指示器（轻量 stepper）
  // v3.8
  StepPills: {
    props: {
      steps:     { type: Array,  required: true },
      separator: { type: String, default: '›' },
    },
    template: `
      <div class="step-pills" data-component="step-pills">
        <template v-for="(step, i) in steps" :key="i">
          <span class="step-pill" :class="'step-pill--' + step.state">{{ step.label }}</span>
          <span v-if="i < steps.length - 1" class="step-pill__sep">{{ separator }}</span>
        </template>
      </div>
    `
  },

  // <ProgressBar value max state height>
  // 三态进度条原子（auto: ≥80% warning, ≥100% danger）
  // 与 UsageBar 区别：ProgressBar 是裸进度条原子，UsageBar = 进度条 + 数字文本组合
  // v3.8
  ProgressBar: {
    props: {
      value:  { type: Number, required: true },
      max:    { type: Number, default: 100 },
      state:  { type: String, default: 'auto' },
      height: { type: Number, default: 6 },
    },
    computed: {
      percent() { return Math.min(100, this.max ? (this.value / this.max) * 100 : 0); },
      autoState() {
        if (this.state !== 'auto') return this.state;
        if (this.percent >= 100) return 'danger';
        if (this.percent >= 80)  return 'warning';
        return 'normal';
      },
    },
    template: `
      <div class="progress-bar" :style="{ height: height + 'px' }" data-component="progress-bar">
        <div class="progress-bar__fill"
             :class="'progress-bar__fill--' + autoState"
             :style="{ width: percent + '%' }"></div>
      </div>
    `
  },

  // <DataTable :data :columns :total :page :pageSize loading emptyText showPagination operationsLabel operationsWidth>
  // columns: [{ label, prop, width?, minWidth?, fixed?, align?, sortable?, slot? }]
  // slot per column via slot 名（在 columns 里声明 slot 字段）
  // slot:operations 自动生成右侧固定操作列
  // v-model:page 双向绑定页码
  // v3.7
  DataTable: {
    props: {
      data:            { type: Array,   default: () => [] },
      columns:         { type: Array,   required: true },
      total:           { type: Number,  default: 0 },
      page:            { type: Number,  default: 1 },
      pageSize:        { type: Number,  default: 10 },
      loading:         { type: Boolean, default: false },
      emptyText:       { type: String,  default: '暂无数据 / No data' },
      showPagination:  { type: Boolean, default: true },
      operationsLabel: { type: String,  default: '操作' },
      operationsWidth: { type: [String, Number], default: 160 },
    },
    emits: ['update:page', 'update:pageSize', 'row-click'],
    template: `
      <div class="data-table" data-component="data-table">
        <el-table
          v-loading="loading"
          :data="data"
          :empty-text="emptyText"
          style="width:100%;"
          @row-click="(row) => $emit('row-click', row)"
        >
          <el-table-column
            v-for="col in columns"
            :key="col.key || col.prop || col.label"
            :prop="col.prop"
            :label="col.label"
            :width="col.width"
            :min-width="col.minWidth"
            :fixed="col.fixed"
            :align="col.align || 'left'"
            :sortable="col.sortable"
          >
            <template #default="scope" v-if="col.slot">
              <slot :name="col.slot" :row="scope.row" :col="col" :index="scope.$index"></slot>
            </template>
          </el-table-column>
          <el-table-column
            v-if="$slots.operations"
            :label="operationsLabel"
            :width="operationsWidth"
            fixed="right"
          >
            <template #default="scope">
              <slot name="operations" :row="scope.row" :index="scope.$index"></slot>
            </template>
          </el-table-column>
        </el-table>
        <div v-if="showPagination && total > 0" class="data-table__pagination">
          <el-pagination
            :current-page="page"
            :page-size="pageSize"
            :total="total"
            layout="total, prev, pager, next"
            :pager-count="5"
            background
            @current-change="(p) => $emit('update:page', p)"
            @size-change="(s) => $emit('update:pageSize', s)"
          ></el-pagination>
        </div>
      </div>
    `
  },

  // <Tag color preset icon> + slot:default — 通用标签（非状态）
  // color: purple|blue|green|orange|yellow|muted|red
  // preset: trending|new|beta|stable|deprecated（Tag 词汇表）
  //       | conversation|multi-modal|reasoning|embedding|image（模型类型）
  // v3.6
  Tag: {
    props: {
      color:  { type: String, default: 'muted' },
      preset: { type: String, default: '' },
      icon:   { type: String, default: '' },
    },
    computed: {
      finalColor() {
        const map = {
          // Tag 词汇表（§2.3）
          trending: 'purple', new: 'green', beta: 'blue', stable: 'muted', deprecated: 'muted',
          // 模型类型 Badge（§2.3）
          conversation: 'blue', 'multi-modal': 'purple', reasoning: 'orange', embedding: 'yellow', image: 'green',
        };
        return this.preset ? (map[this.preset.toLowerCase()] || this.color) : this.color;
      },
      finalIcon() {
        if (this.preset === 'deprecated') return 'triangle-alert';
        return this.icon;
      },
      finalLabel() {
        const labelMap = { 'multi-modal': 'Multi-Modal' };
        if (labelMap[this.preset]) return labelMap[this.preset];
        if (!this.preset) return '';
        return this.preset.charAt(0).toUpperCase() + this.preset.slice(1);
      }
    },
    template: `
      <span class="tag" :class="'badge-' + finalColor" data-component="tag">
        <i v-if="finalIcon" :data-lucide="finalIcon"></i>
        <slot>{{ finalLabel }}</slot>
      </span>
    `
  },

  // <CardBox title> + slot:headerRight + default — 通用卡片容器
  // v3.6
  CardBox: {
    props: {
      title:  { type: String, default: '' },
      padded: { type: Boolean, default: false },
    },
    template: `
      <div class="card-box" :class="{ 'card-box--padded': padded }" data-component="card-box">
        <div v-if="title || $slots.headerRight" class="card-box__head">
          <div class="card-box__title">{{ title }}</div>
          <div v-if="$slots.headerRight" class="card-box__head-right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="card-box__body"><slot></slot></div>
      </div>
    `
  },

  // <Tabs :options v-model variant> — 独立 Tabs（不绑定 DetailPage）
  // variant: underline (默认) | segmented
  // options: [{ label, value, count? }]
  // v3.6
  Tabs: {
    props: {
      options:    { type: Array, required: true },
      modelValue: { type: [String, Number], default: '' },
      variant:    { type: String, default: 'underline' },
    },
    emits: ['update:modelValue'],
    template: `
      <div v-if="variant === 'segmented'" class="tabs-segmented" data-component="tabs">
        <button

          type="button"
          class="tabs-segmented__item"
          :class="{ 'is-active': modelValue === opt.value }"
          @click="$emit('update:modelValue', opt.value)"
        >
          {{ opt.label }}
          <span v-if="opt.count != null" class="tabs-segmented__count">{{ opt.count }}</span>
        </button>
      </div>
      <div v-else class="detail-tabs" data-component="tabs">
        <button
          v-for="opt in options" :key="opt.value"
          type="button"
          class="detail-tabs__item"
          :class="{ 'is-active': modelValue === opt.value }"
          @click="$emit('update:modelValue', opt.value)"
        >
          {{ opt.label }}
          <span v-if="opt.count != null" style="margin-left:6px;color:var(--ui-text-muted);font-weight:400;">({{ opt.count }})</span>
        </button>
      </div>

  // <Avatar src name size color> — 用户头像（letter fallback + 自动配色）
  // size: small|default|large
  // v3.6
  Avatar: {
    props: {
      src:   { type: String, default: '' },
      name:  { type: String, default: '' },
      size:  { type: String, default: 'default' },
      color: { type: String, default: '' }, // 自定义背景色
    },
    computed: {
      initials() {
        if (!this.name) return '?';
        const parts = this.name.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return this.name.substring(0, 2).toUpperCase();
      },
      sizeClass() { return 'avatar-' + this.size; },
      autoBg() {
        if (this.color) return this.color;
        if (!this.name) return 'var(--ui-bg-muted)';
        const palette = [
          'var(--ui-badge-purple-bg)',
          'var(--ui-badge-blue-bg)',
          'var(--ui-badge-green-bg)',
          'var(--ui-badge-orange-bg)',
          'var(--ui-badge-yellow-bg)',
        ];
        const hash = [...this.name].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        return palette[hash % palette.length];
      },
      autoFg() {
        if (this.color) return 'var(--ui-text-on-brand)';
        if (!this.name) return 'var(--ui-text-muted)';
        const palette = [
          'var(--ui-badge-purple-fg)',
          'var(--ui-badge-blue-fg)',
          'var(--ui-badge-green-fg)',
          'var(--ui-badge-orange-fg)',
          'var(--ui-badge-yellow-fg)',
        ];
        const hash = [...this.name].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        return palette[hash % palette.length];
      },
    },
    template: `
      <div class="avatar" :class="sizeClass" data-component="avatar"
           :style="{ background: autoBg, color: autoFg }">
        <img v-if="src" :src="src" :alt="name" />
        <span v-else>{{ initials }}</span>
      </div>
    `
  },

  // <BalanceBox :info :lang> — TopNav 余额药丸（对齐 project-mamba BalanceBox.vue）
  // info: { balance: Number, level: 'normal'|'low'|'critical'|'empty', currency: 'Credits', showTopUp: Boolean, topUpLabel?: String, runwayDays?: Number }
  // 4 alert levels 自动配色；level=normal 不显示左侧 dot，critical/empty 显示脉冲 dot
  // currency 字段**直接显示**（不自动加 s），如 'Credits' / 'CREDIT' / '¥' / 'Tokens'
  // topUpLabel 不传时按 lang prop 自动 zh→"充值" / en→"Top Up"
  // v4.6 / v4.7 修正：图标 normal→database，移除自动加 s，CTA 跟随 lang
  BalanceBox: {
    props: {
      info: { type: Object, required: true },
      lang: { type: String, default: 'en' },
    },
    computed: {
      level() {
        const lv = (this.info?.level || 'normal').toLowerCase();
        return ['normal', 'low', 'critical', 'empty'].includes(lv) ? lv : 'normal';
      },
      iconName() {
        return {
          normal:   'database',         // 圆筒 + 顶盖，最接近 EP Coin
          low:      'wallet',
          critical: 'triangle-alert',
          empty:    'circle-x',
        }[this.level];
      },
      showDot() { return this.level === 'critical' || this.level === 'empty'; },
      showTopUp() { return this.info?.showTopUp !== false; },
      currency() { return this.info?.currency || 'Credits'; },
      topUpText() {
        if (this.info?.topUpLabel) return this.info.topUpLabel;
        return this.lang === 'zh' ? '充值' : 'Top Up';
      },
      formattedBalance() {
        const n = Number(this.info?.balance);
        if (!Number.isFinite(n)) return '--';
        return n.toLocaleString('en-US', { maximumFractionDigits: Number.isInteger(n) ? 0 : 2 });
      },
    },
    template: `
      <div class="balance-pill" data-component="balance-pill"
           :class="['balance-pill--' + level, { 'balance-pill--readonly': !showTopUp }]"
           role="status">
        <span v-if="showDot" class="balance-pill__dot" aria-hidden="true"></span>
        <i :data-lucide="iconName" class="balance-pill__icon"></i>
        <span class="balance-pill__num">{{ formattedBalance }}</span>
        <span class="balance-pill__unit">{{ currency }}</span>
        <button v-if="showTopUp" class="balance-pill__cta" type="button" @click.stop>
          <i data-lucide="plus"></i>
          <span>{{ topUpText }}</span>
        </button>
      </div>
    `
  },

  // <DetailPage title :tabs activeTab showBack> + slot:actions + default
  // 详情页组合壳：MainBox + HeaderBox(返回在标题左侧 + 标题 + actions) + 可选 Tabs + ScrollBox
  // v3.5 · v6.9.3 移除 subtitle（所有页面不传副标题）；back 已在标题左侧 inline
  DetailPage: {
    props: {
      title:     { type: String, required: true },
      tabs:      { type: Array, default: () => [] },
      activeTab: { type: [String, Number], default: '' },
      showBack:  { type: Boolean, default: true },

    emits: ['update:activeTab', 'back'],

            <div style="display:flex;align-items:center;gap:8px;min-width:0;">

              <div style="min-width:0;">

            <div class="detail-tabs" data-component="detail-tabs">
              <button
                v-for="tab in tabs" :key="tab.value"
                class="detail-tabs__item"
                :class="{ 'is-active': activeTab === tab.value }"
                type="button"
                @click="$emit('update:activeTab', tab.value)"
              >{{ tab.label }}</button>
            </div>
          </div>
        </div>
        <el-scrollbar>
          <div class="scroll-box-inner" data-scroll-box data-component="scroll-box">
            <slot></slot>
          </div>

  // <Breadcrumb :items separator>
  // items: [{ label, href? }] — 最后一项自动渲染为当前态（无链接，加粗）
  // separator: Lucide 图标名（默认 chevron-right）
  // v3.10 L1
  Breadcrumb: {
    props: {
      items:     { type: Array,  required: true },
      separator: { type: String, default: 'chevron-right' },
    },
    template: `
      <span class="breadcrumb" data-component="breadcrumb">
        <template v-for="(item, i) in items" :key="i">
          <span v-if="i === items.length - 1" class="breadcrumb-current">{{ item.label }}</span>
          <a v-else-if="item.href" :href="item.href">{{ item.label }}</a>
          <span v-else>{{ item.label }}</span>
          <i v-if="i < items.length - 1" :data-lucide="separator"></i>
        </template>
      </span>

  },

  // <FilterBox variant :selectedCount> + slot:default
  // variant: standard | three-zone | selection | compact
  //   standard   — 找数据：搜索 + 筛选 + 操作按钮（默认右侧）
  //   three-zone — 显式三段（左筛选 / 中 spacer .filter-box-spacer / 右操作）
  //   selection  — 批量选中态（主色背景 + 批量操作）
  //   compact    — 紧凑高度
  // selection 变体替代旧 Toolbar；列表页顶部组件统一为 FilterBox
  // v3.10 L1
  FilterBox: {
    props: {
      variant:       { type: String, default: 'standard' }, // standard|three-zone|selection|compact
      selectedCount: { type: Number, default: 0 },
    },
    template: `
      <div
        class="filter-box"
        :class="{
          'filter-box--compact':   variant === 'compact',
          'filter-box--selection': variant === 'selection',
        }"
        data-component="filter-box"
      >
        <slot></slot>
      </div>
    `
  },

  // <I18nField v-model langs required placeholder>
  // 多语言字段 — Tabs 切换 + 圆点状态指示。v3.16 保持 runtime-component。
  // v-model 绑定一个对象，每语言一个 key（例：{ zh: '', en: '', ja: '', ko: '' }）。
  I18nField: {
    props: {
      modelValue:  { type: Object,  required: true },
      langs:       { type: Array,   default: () => [
        { code: 'zh', label: '中文',   required: true  },
        { code: 'en', label: 'English', required: true  },
        { code: 'ja', label: '日本語',  required: false },
        { code: 'ko', label: '한국어',  required: false },
      ]},
      required:    { type: Array,   default: () => [] }, // 覆盖 langs 中的 required 标记
      placeholder: { type: [String, Object], default: '' }, // 字符串或 { zh: '...', en: '...' }
    },
    emits: ['update:modelValue'],
    data() {
      return { activeTab: this.langs[0]?.code || 'zh' };
    },
    computed: {
      effectiveRequired() {
        return this.required.length > 0 ? this.required : this.langs.filter(l => l.required).map(l => l.code);
      },
      currentPlaceholder() {
        if (typeof this.placeholder === 'string') return this.placeholder;
        return this.placeholder[this.activeTab] || '';
      },
    },
    methods: {
      isRequired(code) { return this.effectiveRequired.includes(code); },
      isFilled(code)   { return ((this.modelValue || {})[code] || '').trim().length > 0; },
      dotClass(code) {
        if (this.isFilled(code))   return 'i18n-status-dot--done';
        if (this.isRequired(code)) return 'i18n-status-dot--required';
        return 'i18n-status-dot--missing';
      },
      updateValue(val) {
        this.$emit('update:modelValue', { ...(this.modelValue || {}), [this.activeTab]: val });
      },
    },
    template: `
      <div class="i18n-field" data-component="i18n-field">
        <div class="i18n-field__tabs" role="tablist">
          <button
            v-for="l in langs"
            :key="l.code"
            class="i18n-field__tab"
            :class="{ 'is-active': activeTab === l.code }"
            @click="activeTab = l.code"
            role="tab"
            type="button"
          >
            <span class="i18n-field__tab-name">{{ l.label }}</span>
            <span v-if="isRequired(l.code)" class="i18n-field__tab-required">*</span>
            <span class="i18n-status-dot" :class="dotClass(l.code)"></span>
          </button>
        </div>
        <el-input
          :model-value="(modelValue || {})[activeTab] || ''"
          @update:model-value="updateValue"
          :placeholder="currentPlaceholder"
          size="large"
        ></el-input>
      </div>
    `
  },

};

        'import requests',
        '',
        'response = requests.post(',

        '        "Authorization": "Bearer {api_key}",',
        '        "Content-Type": "application/json",',
        '        "Accept": "application/json",',
        '        "X-Request-Id": "{request_id}",',
        '        "X-Trace-Id": "{trace_id}",',

        '    },',
        ')',
      ].join('\n'),
      java: [
        'HttpRequest request = HttpRequest.newBuilder()',
        '    .uri(URI.create("{request_url}"))',
        '    .header("Authorization", "Bearer {api_key}")',
        '    .header("Content-Type", "application/json")',
        '    .header("Accept", "application/json")',
        '    .header("X-Request-Id", "{request_id}")',
        '    .header("X-Trace-Id", "{trace_id}")',
        '    .POST(HttpRequest.BodyPublishers.ofString(',
        '        "{\\"max_tokens\\":\\"1024\\",\\"messages\\":\\"[{\\\\\\"role\\\\\\":\\\\\\"user\\\\\\",\\\\\\"content\\\\\\":\\\\\\"hello\\\\\\"}]\\"}"',
        '    ))',
        '    .build();',

        '    "Accept": "application/json",',
        '    "X-Request-Id": "{request_id}",',
        '    "X-Trace-Id": "{trace_id}",',

        '  body: JSON.stringify({',
        '    max_tokens: "1024",',
        '    messages: "[{\\"role\\":\\"user\\",\\"content\\":\\"hello\\"}]",',
        '  }),',
        '});',

        '    "Authorization: Bearer {api_key}",',
        '    "Content-Type: application/json",',
        '    "Accept: application/json",',
        '    "X-Request-Id: {request_id}",',
        '    "X-Trace-Id: {trace_id}",',
        ']);',
        'curl_setopt($ch, CURLOPT_POSTFIELDS, \'{"max_tokens":"1024","messages":"[{\\"role\\":\\"user\\",\\"content\\":\\"hello\\"}]"}\');',
        '$response = curl_exec($ch);',
      ].join('\n'),

        'uri = URI("{request_url}")',
        'request = Net::HTTP::Post.new(uri)',

        'request["Content-Type"] = "application/json"',
        'request["Accept"] = "application/json"',
        'request["X-Request-Id"] = "{request_id}"',
        'request["X-Trace-Id"] = "{trace_id}"',
        'request.body = \'{"max_tokens":"1024","messages":"[{\\"role\\":\\"user\\",\\"content\\":\\"hello\\"}]"}\'',
        'response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }',
      ].join('\n'),

      const escaped = String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return escaped
        .replace(/\\{(request_url|api_key|request_id|trace_id)\\}/g, '<span class="api-code-token--variable">{$1}</span>')
        .replace(/\\b(POST|GET|PUT|DELETE)\\b/g, '<span class="api-code-token--method">$1</span>')

                                v-for="item in codeLanguages"

                                type="button"
                                class="api-language-tab"
                                :class="{ 'is-active': codeTab === item.value }"
                                disabled
                              >{{ item.label }}</button>
                            </div>
                            <div class="api-snippet">
                              <div class="api-snippet-head">
                                <div class="api-snippet-title type-body-sm">
                                  <i data-lucide="chevron-down"></i><span>{{ activeCodeLanguage.label }}</span>
                                </div>
                                <button type="button" class="api-copy-button" disabled>Copy</button>
                              </div>
                              <div class="api-code-body api-code-body--preview" aria-hidden="true">
                                <div class="api-preview-code">
                                  <span class="api-preview-code__line"></span>
                                  <span class="api-preview-code__line"></span>
                                  <span class="api-preview-code__line"></span>
                                  <span class="api-preview-code__line"></span>
                                  <span class="api-preview-code__line"></span>
                                  <span class="api-preview-code__line"></span>
                                  <span class="api-preview-code__line"></span>
                                </div>
                              </div>
                            </div>
                          </article>
                        </section>
                        <aside class="api-request-index api-request-index--preview" data-component="api-request-index-preview" aria-hidden="true">
                          <section class="api-index-section">
                            <div class="api-index-section__head">
                              <span class="api-index-section__label">{{ t.deployment.fields.headers }}</span>
                            </div>
                            <div class="api-index-pane">
                              <div class="api-preview-list">
                                <div v-for="i in 5" :key="'header-preview-' + i" class="api-preview-row">
                                  <span class="api-preview-cell"></span>
                                  <span class="api-preview-cell"></span>
                                </div>
                              </div>
                            </div>
                          </section>
                          <section class="api-index-section api-index-section--body">
                            <div class="api-index-section__head">
                              <span class="api-index-section__label">{{ t.deployment.fields.requestBody }}</span>
                            </div>
                            <div class="api-index-pane">
                              <div class="api-preview-list">
                                <div v-for="i in 2" :key="'body-preview-' + i" class="api-preview-param">
                                  <div class="api-preview-param__main">
                                    <span class="api-preview-cell api-preview-param__name"></span>
                                    <span class="api-preview-cell api-preview-param__meta"></span>
                                  </div>
                                  <span class="api-preview-cell api-preview-param__default"></span>
                                </div>
                              </div>
                            </div>
                          </section>
                        </aside>
                        <div class="api-preview-lock" aria-live="polite" :aria-label="unavailable.preview || unavailable.hint">
                          <div class="api-preview-lock__badge">
                            <span class="api-preview-lock__icon"><i data-lucide="file-code-2"></i></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </article>
                </section>

                <section v-show="detailTab === 'monitor'" class="anim-fade-in">
                  <div class="deployment-panel"><EmptyState icon="activity" :title="t.deployment.tabs.monitor" :hint="t.deployment.monitorEmpty"></EmptyState></div>
                </section>

                <section v-show="detailTab === 'events'" class="anim-fade-in">
                  <div class="deployment-panel"><EmptyState icon="history" :title="t.deployment.tabs.events" :hint="t.deployment.eventsEmpty"></EmptyState></div>
                </section>
              </div>
            </el-scrollbar>
          </section>

          <section v-show="activeNav !== 'deployments'" class="deployment-page">
            <PageHeader :title="activeNav === 'quick-deploy' ? t.deployment.navQuickDeploy : t.deployment.navAccess"></PageHeader>
            <el-scrollbar><div class="deployment-content"><div class="deployment-panel"><EmptyState icon="box" :title="activeNav === 'quick-deploy' ? t.deployment.navQuickDeploy : t.deployment.navAccess" :hint="t.deployment.otherEmpty"></EmptyState></div></div></el-scrollbar>
          </section>
        </main>
        <!-- AGIONE_EDIT_MAIN_END -->

      </div>
    </div>
  `
});

for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, comp);
}
// §5.0 注册原型运行时组件库
for (const [name, comp] of Object.entries(PrototypeComponents)) {
  app.component(name, comp);
}
app.use(ElementPlus);
app.mount('#app');
lucide.createIcons();
</script>
</body>
</html>
