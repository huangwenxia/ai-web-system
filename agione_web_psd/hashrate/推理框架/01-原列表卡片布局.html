<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>推理框架 - 原列表卡片布局</title>

<!-- Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Element Plus -->
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.1/dist/index.css" />
<script src="https://unpkg.com/element-plus@2.9.1/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<!-- Fonts -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono/400.css" />
<!-- TailwindCSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
/* ── Design DNA — §2.1 完整 CSS 变量 ── */
:root {
  /* TopBar（永不随主题变化） */
  --topnav-bg:          #1a1025;
  --topnav-accent:      #2d2240;
  --topnav-fg:          #f0edf5;
  --topnav-muted:       #8b7fa0;
  --topnav-active-bg:   #312870;
  --topnav-active-fg:   #c4bdff;
  --topnav-height:      56px;

  /* Sidebar & Body（Light 默认） */
  --sidebar-bg:         #fafafa;
  --sidebar-border:     #e4e4e7;
  --sidebar-fg:         #09090b;
  --sidebar-muted:      #71717a;
  --sidebar-active-bg:  #e4e4e7;
  --sidebar-active-fg:  #18181b;
  --sidebar-width:      256px;
  --body-bg:            #ffffff;
  --body-radius:        16px 16px 0 0;

  /* 主色 */
  --color-primary:        #5f4ecf;
  --color-primary-hover:  #4a3eb0;
  --color-primary-active: #3d3399;
  --color-primary-subtle: #ece9f9;
  --primary-foreground:   #ffffff;

  /* 中性色 */
  --foreground:           #09090b;
  --background:           #ffffff;
  --card:                 #ffffff;
  --accent:               #f4f4f5;
  --muted:                #f4f4f5;
  --muted-foreground:     #71717a;
  --border:               #e4e4e7;
  --input:                #ffffff;

  /* 状态色 */
  --color-success:        #22c55e;
  --color-warning:        #e6a23c;
  --color-destructive:    #ef4444;

  /* Badge */
  --badge-purple-bg: #f2eef8;  --badge-purple-fg: #6a4e9a;
  --badge-blue-bg:   #eef1f8;  --badge-blue-fg:   #4a6298;
  --badge-green-bg:  #eef5f0;  --badge-green-fg:  #3a7252;
  --badge-orange-bg: #f8f1ec;  --badge-orange-fg: #8a5e38;
  --badge-yellow-bg: #f7f4ea;  --badge-yellow-fg: #7a6228;
  --badge-muted-bg:  var(--muted); --badge-muted-fg: var(--muted-foreground);

  /* 阴影 */
  --shadow-sm:  0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:  0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg:  0 4px 16px rgba(0,0,0,0.12);
  --shadow-xl:  0 8px 32px rgba(0,0,0,0.16);

  /* 圆角 */
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;
  --radius-xl:   12px;
  --radius-2xl:  16px;
  --radius-pill: 9999px;

  /* 字体 */
  --font-heading: 'Manrope Variable', Inter, system-ui, sans-serif;
  --font-base:    'Inter Variable', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono:    'IBM Plex Mono', 'SF Mono', Consolas, monospace;

  /* 动效 */
  --duration-fast: 150ms;   /* hover / focus / state */
  --duration-base: 250ms;   /* card hover / tooltip */
  --duration-slow: 400ms;   /* drawer / dialog */
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);

  /* Avatar */
  --avatar-bg: #7c3aed;

  /* 状态色 Subtle */
  --color-success-subtle:      #ecfdf5;
  --color-warning-subtle:      #fef3c7;
  --color-destructive-subtle:  #fef2f2;

  /* Focus ring */
  --ring: #18181b;

  /* Spacing 间距（4px 基准网格，语义命名） */
  --space-xs:   4px;    /* 图标与文字间距、Badge 内边距 */
  --space-sm:   8px;    /* 行内元素间距、组件 gap */
  --space-md:   12px;   /* 组件内边距（紧凑）、按钮组 gap */
  --space-base: 16px;   /* 表格列内边距、表单行间距 */
  --space-lg:   20px;   /* 卡片内边距 */
  --space-xl:   24px;   /* 主内容区内边距、Section 间距 */
  --space-2xl:  32px;   /* 大区块间距 */
  --space-3xl:  48px;   /* 页面顶部空白 */

  /* Z-index 层级 */
  --z-base:     1;
  --z-dropdown: 100;
  --z-sticky:   200;
  --z-fixed:    300;
  --z-overlay:  400;
  --z-modal:    500;
  --z-popover:  600;
  --z-toast:    700;
  --z-tooltip:  800;
  --z-message:  900;

  /* Icon sizes 图标尺寸 */
  --icon-xs:   12px;
  --icon-sm:   14px;
  --icon-md:   16px;
  --icon-lg:   18px;
  --icon-xl:   20px;
  --icon-2xl:  24px;
  --icon-3xl:  32px;

  /* Element Plus 兼容 */
  --el-border-radius-base:     6px;
  --el-border-color:           var(--border);
  --el-bg-color:               var(--background);
  --el-bg-color-page:          var(--accent);
  --el-bg-color-overlay:       #ffffff;
  --el-text-color-primary:     var(--foreground);
  --el-text-color-regular:     var(--muted-foreground);
  --el-text-color-secondary:   var(--muted-foreground);
  --el-text-color-placeholder: #a1a1aa;
  --el-fill-color-blank:       var(--input);
  --el-fill-color-light:       var(--accent);
  --el-fill-color:             #f0f0f0;
  --el-color-primary:          var(--color-primary);
  --el-disabled-bg-color:      #f5f5f5;
  --el-disabled-border-color:  #e4e4e7;
  --el-mask-color:             rgba(255,255,255,0.9);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── App Shell — §3.1 ── */
html, body {
  height: 100%;
  background: var(--topnav-bg);
  font-family: var(--font-base);
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.body {
  display: flex;
  flex: 1;
  overflow: hidden;
  border-radius: var(--body-radius);
  background: var(--body-bg);
}

.main {
  flex: 1;
  overflow: auto;
  background: var(--body-bg);
}

/* ── TopBar — §3.2 ── */
.topnav {
  height: var(--topnav-height);
  min-height: var(--topnav-height);
  background: var(--topnav-bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 8px;
  z-index: 100;
}
.topnav-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topnav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.nav-logo {
  height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-logo img { height: 28px; width: auto; display: block; }

.nav-brand-name {
  font-size: 15px; font-weight: 700;
  color: var(--topnav-fg);
  white-space: nowrap;
}

.nav-divider { width: 1px; height: 20px; background: var(--topnav-accent); flex-shrink: 0; }

.nav-tabs { display: flex; align-items: center; gap: 4px; }

.nav-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--topnav-muted);
  white-space: nowrap;
  transition: background var(--duration-fast), color var(--duration-fast);
}
.nav-tab.active { background: var(--topnav-active-bg); color: var(--topnav-active-fg); }
.nav-tab:not(.active):hover { background: rgba(255,255,255,0.06); color: var(--topnav-fg); }

.nav-search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--topnav-accent);
  cursor: pointer;
  transition: opacity var(--duration-fast);
}
.nav-search:hover { opacity: 0.8; }
.nav-search [data-lucide] { width: 14px; height: 14px; color: var(--topnav-muted); flex-shrink: 0; }
.nav-search-text { font-size: 13px; color: var(--topnav-muted); }
.nav-search-kbd {
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 11px; color: var(--topnav-muted);
}

.nav-icon-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--topnav-muted);
  transition: background var(--duration-fast), color var(--duration-fast);
  flex-shrink: 0;
}
.nav-icon-btn:hover { background: var(--topnav-accent); color: var(--topnav-fg); }
.nav-icon-btn [data-lucide] { width: 16px; height: 16px; }

.nav-avatar {
  width: 28px; height: 28px;
  border-radius: var(--radius-pill);
  background: var(--avatar-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: #fff;
  cursor: pointer; flex-shrink: 0; user-select: none;
}

/* ── Sidebar — §3.3 ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  padding: 12px 12px 16px;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; overflow-x: hidden;
}
/* ── Scrollbar（全局） ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: var(--radius-pill);
}
::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
::-webkit-scrollbar-corner { background: transparent; }

.sidebar-section { margin-bottom: 4px; }

.sidebar-section-title {
  padding: 8px 8px 4px;
  font-size: 12px; font-weight: 500;
  color: var(--sidebar-muted);
  letter-spacing: 0.01em;
}
.sidebar-section + .sidebar-section .sidebar-section-title { padding-top: 12px; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px;
  border-radius: 6px;
  font-size: 14px; font-weight: 400;
  color: var(--sidebar-fg);
  transition: background 0.12s, color 0.12s;
  white-space: nowrap;
  width: 100%;
}
.nav-item [data-lucide] { width: 18px; height: 18px; flex-shrink: 0; color: var(--sidebar-muted); }
.nav-item.active { background: var(--sidebar-active-bg); font-weight: 500; color: var(--sidebar-active-fg); }
.nav-item.active [data-lucide] { color: var(--sidebar-active-fg); }
.nav-item:not(.active):hover { background: var(--accent); }

/* ── Stage（shell-only 空舞台） ── */
.stage-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.stage-card {
  max-width: 480px; width: 100%;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.stage-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 12px;
  border-radius: var(--radius-pill);
  background: var(--color-primary-subtle);
  color: var(--color-primary);
  font-size: 12px; font-weight: 600;
}
.stage-title {
  font-family: var(--font-heading);
  font-size: 26px; font-weight: 800;
  color: var(--foreground); line-height: 1.2;
}
.stage-desc {
  font-size: 14px; line-height: 1.7;
  color: var(--muted-foreground);
}
.stage-badges {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 4px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
}
.badge-green  { background: var(--badge-green-bg);  color: var(--badge-green-fg); }
.badge-blue   { background: var(--badge-blue-bg);   color: var(--badge-blue-fg); }
.badge-purple { background: var(--badge-purple-bg); color: var(--badge-purple-fg); }
.badge-orange { background: var(--badge-orange-bg); color: var(--badge-orange-fg); }


/* Business content: inference framework list prototypes */
.page {
  min-height: 100%;
  padding: var(--space-xl);
  background: var(--body-bg);
  color: var(--foreground);
}
.page-shell {
  display: flex;
  flex-direction: column;
  gap: var(--space-base);
  min-width: 0;
}
.notice {
  display: flex;
  align-items: flex-start;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-base);
  border: 1px solid var(--border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius-lg);
  background: var(--color-primary-subtle);
  color: var(--foreground);
  font-size: 13px;
  line-height: 1.6;
}
.notice [data-lucide] {
  width: var(--icon-lg);
  height: var(--icon-lg);
  color: var(--color-primary);
  flex-shrink: 0;
  margin-top: 1px;
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--space-base);
  flex-wrap: wrap;
}
.filters {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  flex-wrap: wrap;
  min-width: 0;
}
.actions {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  flex-wrap: wrap;
}
.filter-pill {
  height: 36px;
  min-width: 132px;
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 0 var(--space-md);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--input);
  color: var(--muted-foreground);
  font-size: 13px;
}
.filter-pill.search {
  width: 220px;
}
.filter-pill [data-lucide] {
  width: var(--icon-md);
  height: var(--icon-md);
  flex-shrink: 0;
}
.btn {
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  padding: 0 var(--space-md);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-primary);
  color: var(--color-primary);
  background: var(--card);
  font-size: 13px;
  font-weight: 500;
  transition: background var(--duration-fast), color var(--duration-fast), border-color var(--duration-fast);
}
.btn.primary {
  background: var(--color-primary);
  color: var(--primary-foreground);
}
.btn:hover {
  border-color: var(--color-primary-hover);
  color: var(--color-primary-hover);
}
.btn.primary:hover {
  background: var(--color-primary-hover);
  color: var(--primary-foreground);
}
.btn [data-lucide] {
  width: var(--icon-md);
  height: var(--icon-md);
}
.content-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--card);
  overflow: hidden;
}
.framework-name {
  color: var(--foreground);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.35;
  min-width: 0;
}
.framework-desc {
  color: var(--muted-foreground);
  font-size: 13px;
  line-height: 1.5;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.avatar-box {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-lg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-primary-subtle);
  color: var(--color-primary);
  flex-shrink: 0;
}
.avatar-box [data-lucide] {
  width: var(--icon-xl);
  height: var(--icon-xl);
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
  grid-auto-flow: row dense;
  gap: var(--space-md);
  min-width: 0;
}
.field {
  min-width: 0;
}
.field-label {
  color: var(--muted-foreground);
  font-size: 12px;
  line-height: 1.35;
  margin-bottom: var(--space-xs);
}
.field-value {
  color: var(--foreground);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.field-value.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.cloud-tag,
.type-tag {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  max-width: 100%;
  height: 24px;
  padding: 0 var(--space-sm);
  border-radius: var(--radius-pill);
  background: var(--badge-blue-bg);
  color: var(--badge-blue-fg);
  font-size: 12px;
  font-weight: 500;
}
.type-tag {
  background: var(--badge-purple-bg);
  color: var(--badge-purple-fg);
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-pill);
  background: currentColor;
  flex-shrink: 0;
}
.more-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  color: var(--muted-foreground);
  transition: background var(--duration-fast), color var(--duration-fast);
}
.more-btn:hover {
  background: var(--accent);
  color: var(--foreground);
}
.more-btn [data-lucide] {
  width: var(--icon-md);
  height: var(--icon-md);
}
.action-menu {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  flex-wrap: wrap;
}
.action-link {
  height: 28px;
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 0 var(--space-sm);
  border-radius: var(--radius-md);
  color: var(--muted-foreground);
  font-size: 12px;
}
.action-link:hover {
  background: var(--accent);
  color: var(--color-primary);
}
.action-link.danger:hover {
  color: var(--color-destructive);
}
.action-link [data-lucide] {
  width: var(--icon-sm);
  height: var(--icon-sm);
}
.pagination {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  padding: 0 var(--space-base);
  border-top: 1px solid var(--border);
  color: var(--muted-foreground);
  font-size: 13px;
}
.pager {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
}
.page-no {
  min-width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--foreground);
  font-size: 13px;
}
.page-no.active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: var(--primary-foreground);
}

.layout-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  grid-auto-flow: row dense;
  gap: var(--space-base);
  padding: var(--space-base);
}
.framework-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-base);
  padding: var(--space-lg);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--card);
  transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
}
.framework-card:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-md);
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-md);
  min-width: 0;
}
.card-title {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  min-width: 0;
}

.layout-rows {
  display: flex;
  flex-direction: column;
}
.framework-row {
  display: grid;
  grid-template-columns: minmax(260px, 1.2fr) minmax(420px, 2fr) auto;
  gap: var(--space-base);
  align-items: center;
  padding: var(--space-base);
  border-bottom: 1px solid var(--border);
}
.framework-row:last-child {
  border-bottom: none;
}
.row-title {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  min-width: 0;
}
.row-fields {
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
}

.layout-matrix {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  grid-auto-flow: row dense;
  gap: var(--space-base);
  padding: var(--space-base);
}
.matrix-card {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-base);
  padding: var(--space-lg);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: linear-gradient(0deg, var(--card), var(--card));
}
.matrix-top {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--space-md);
  align-items: flex-start;
}
.matrix-fields {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  padding-top: var(--space-base);
  border-top: 1px solid var(--border);
}

.layout-table {
  display: grid;
  grid-template-columns: minmax(260px, 1.1fr) repeat(5, minmax(128px, 1fr)) minmax(126px, auto);
  min-width: 1080px;
}
.table-scroll {
  overflow: auto;
}
.table-head,
.table-cell {
  padding: var(--space-md) var(--space-base);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.table-head {
  background: var(--accent);
  color: var(--muted-foreground);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.table-cell {
  display: flex;
  align-items: center;
  min-height: 64px;
  color: var(--foreground);
  font-size: 13px;
}
.table-title {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  min-width: 0;
}
.table-actions {
  justify-content: flex-end;
}

@media (max-width: 1280px) {
  .sidebar {
    display: none;
  }
  .framework-row {
    grid-template-columns: 1fr;
  }
  .action-menu {
    justify-content: flex-start;
  }
}

                <div class="pagination"><span>{{ t.pageSummary }}</span><div class="pager"><span class="page-no active">1</span></div></div>

                        <div class="avatar-box"><i data-lucide="box"></i></div>
