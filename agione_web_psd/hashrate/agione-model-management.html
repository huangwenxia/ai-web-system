<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>模型管理 / Model Management - AGIOne Console</title>

<!-- Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Element Plus -->
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.1/dist/index.css" />
<script src="https://unpkg.com/element-plus@2.9.1/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<!-- Fonts — jsdelivr (Google Fonts blocked in CN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono/400.css" />
<!-- TailwindCSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide Icons — plain script, NO type="module" -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
/* ── Design DNA — §2.1 完整 CSS 变量 ── */
:root {
  /* TopBar（永不随主题变化） */
  --topnav-bg:          #1a1025;
  --topnav-accent:      #2d2240;
  --topnav-fg:          #f0edf5;
  --topnav-muted:       #8b7fa0;
  --topnav-active-bg:   #312870;
  --topnav-active-fg:   #c4bdff;
  --topnav-height:      56px;

  /* Sidebar & Body（Light 默认） */
  --sidebar-bg:         #fafafa;
  --sidebar-border:     #e4e4e7;
  --sidebar-fg:         #09090b;
  --sidebar-muted:      #71717a;
  --sidebar-active-bg:  #e4e4e7;
  --sidebar-active-fg:  #18181b;
  --sidebar-width:      256px;
  --body-bg:            #ffffff;
  --body-radius:        16px 16px 0 0;

  /* 主色 */
  --color-primary:        #5f4ecf;
  --color-primary-hover:  #4a3eb0;
  --color-primary-active: #3d3399;
  --color-primary-subtle: #ece9f9;
  --primary-foreground:   #ffffff;

  /* 中性色 */
  --foreground:           #09090b;
  --background:           #ffffff;
  --card:                 #ffffff;
  --accent:               #f4f4f5;
  --muted:                #f4f4f5;
  --muted-foreground:     #71717a;
  --border:               #e4e4e7;
  --input:                #ffffff;

  /* 状态色 */
  --color-success:        #22c55e;
  --color-warning:        #e6a23c;
  --color-destructive:    #ef4444;

  /* Badge */
  --badge-purple-bg: #f2eef8;  --badge-purple-fg: #6a4e9a;
  --badge-blue-bg:   #eef1f8;  --badge-blue-fg:   #4a6298;
  --badge-green-bg:  #eef5f0;  --badge-green-fg:  #3a7252;
  --badge-orange-bg: #f8f1ec;  --badge-orange-fg: #8a5e38;
  --badge-yellow-bg: #f7f4ea;  --badge-yellow-fg: #7a6228;
  --badge-muted-bg:  var(--muted); --badge-muted-fg: var(--muted-foreground);

  /* 阴影 */
  --shadow-sm:  0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:  0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg:  0 4px 16px rgba(0,0,0,0.12);
  --shadow-xl:  0 8px 32px rgba(0,0,0,0.16);

  /* 圆角 */
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;
  --radius-xl:   12px;
  --radius-2xl:  16px;
  --radius-pill: 9999px;

  /* 字体 */
  --font-heading: 'Manrope Variable', Inter, system-ui, sans-serif;
  --font-base:    'Inter Variable', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono:    'IBM Plex Mono', 'SF Mono', Consolas, monospace;

  /* 动效 */
  --duration-fast: 150ms;   /* hover / focus / state */
  --duration-base: 250ms;   /* card hover / tooltip */
  --duration-slow: 400ms;   /* drawer / dialog */
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);

  /* Avatar */
  --avatar-bg: #7c3aed;

  /* 状态色 Subtle */
  --color-success-subtle:      #ecfdf5;
  --color-warning-subtle:      #fef3c7;
  --color-destructive-subtle:  #fef2f2;

  /* Focus ring */
  --ring: #18181b;

  /* Spacing 间距（4px 基准网格，语义命名） */
  --space-xs:   4px;    /* 图标与文字间距、Badge 内边距 */
  --space-sm:   8px;    /* 行内元素间距、组件 gap */
  --space-md:   12px;   /* 组件内边距（紧凑）、按钮组 gap */
  --space-base: 16px;   /* 表格列内边距、表单行间距 */
  --space-lg:   20px;   /* 卡片内边距 */
  --space-xl:   24px;   /* 主内容区内边距、Section 间距 */
  --space-2xl:  32px;   /* 大区块间距 */
  --space-3xl:  48px;   /* 页面顶部空白 */

  /* Z-index 层级 */
  --z-base:     1;
  --z-dropdown: 100;
  --z-sticky:   200;
  --z-fixed:    300;
  --z-overlay:  400;
  --z-modal:    500;
  --z-popover:  600;
  --z-toast:    700;
  --z-tooltip:  800;
  --z-message:  900;

  /* Icon sizes 图标尺寸 */
  --icon-xs:   12px;
  --icon-sm:   14px;
  --icon-md:   16px;
  --icon-lg:   18px;
  --icon-xl:   20px;
  --icon-2xl:  24px;
  --icon-3xl:  32px;

  /* Element Plus 兼容 */
  --el-border-radius-base:     6px;
  --el-border-color:           var(--border);
  --el-bg-color:               var(--background);
  --el-bg-color-page:          var(--accent);
  --el-bg-color-overlay:       #ffffff;
  --el-text-color-primary:     var(--foreground);
  --el-text-color-regular:     var(--muted-foreground);
  --el-text-color-secondary:   var(--muted-foreground);
  --el-text-color-placeholder: #a1a1aa;
  --el-fill-color-blank:       var(--input);
  --el-fill-color-light:       var(--accent);
  --el-fill-color:             #f0f0f0;
  --el-color-primary:          var(--color-primary);
  --el-disabled-bg-color:      #f5f5f5;
  --el-disabled-border-color:  #e4e4e7;
  --el-mask-color:             rgba(255,255,255,0.9);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── App Shell — §3.1 ── */
html, body {
  height: 100%;
  background: var(--topnav-bg);
  font-family: var(--font-base);
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.body {
  display: flex;
  flex: 1;
  overflow: hidden;
  border-radius: var(--body-radius);
  background: var(--body-bg);
}

.main {
  flex: 1;
  overflow: auto;
  background: var(--body-bg);
}

/* ── TopBar — §3.2 ── */
.topnav {
  height: var(--topnav-height);
  min-height: var(--topnav-height);
  background: var(--topnav-bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 8px;
  z-index: 100;
}
.topnav-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topnav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.nav-logo {
  height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-logo img { height: 28px; width: auto; display: block; }

.nav-brand-name {
  font-size: 15px; font-weight: 700;
  color: var(--topnav-fg);
  white-space: nowrap;
}

.nav-divider { width: 1px; height: 20px; background: var(--topnav-accent); flex-shrink: 0; }

.nav-tabs { display: flex; align-items: center; gap: 4px; }

.nav-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--topnav-muted);
  white-space: nowrap;
  transition: background var(--duration-fast), color var(--duration-fast);
}
.nav-tab.active { background: var(--topnav-active-bg); color: var(--topnav-active-fg); }
.nav-tab:not(.active):hover { background: rgba(255,255,255,0.06); color: var(--topnav-fg); }

.nav-search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--topnav-accent);
  cursor: pointer;
  transition: opacity var(--duration-fast);
}
.nav-search:hover { opacity: 0.8; }
.nav-search [data-lucide] { width: 14px; height: 14px; color: var(--topnav-muted); flex-shrink: 0; }
.nav-search-text { font-size: 13px; color: var(--topnav-muted); }
.nav-search-kbd {
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 11px; color: var(--topnav-muted);
}

.nav-icon-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--topnav-muted);
  transition: background var(--duration-fast), color var(--duration-fast);
  flex-shrink: 0;
}
.nav-icon-btn:hover { background: var(--topnav-accent); color: var(--topnav-fg); }
.nav-icon-btn [data-lucide] { width: 16px; height: 16px; }

.nav-avatar {
  width: 28px; height: 28px;
  border-radius: var(--radius-pill);
  background: var(--avatar-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: #fff;
  cursor: pointer; flex-shrink: 0; user-select: none;
}

/* ── Sidebar — §3.3 ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  padding: 12px 12px 16px;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; overflow-x: hidden;
}
/* ── Scrollbar（全局） ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: var(--radius-pill);
}
::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
::-webkit-scrollbar-corner { background: transparent; }

.sidebar-section { margin-bottom: 4px; }

.sidebar-section-title {
  padding: 8px 8px 4px;
  font-size: 12px; font-weight: 500;
  color: var(--sidebar-muted);
  letter-spacing: 0.01em;
}
.sidebar-section + .sidebar-section .sidebar-section-title { padding-top: 12px; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px;
  border-radius: 6px;
  font-size: 14px; font-weight: 400;
  color: var(--sidebar-fg);
  transition: background 0.12s, color 0.12s;
  white-space: nowrap;
  width: 100%;
}
.nav-item [data-lucide] { width: 18px; height: 18px; flex-shrink: 0; color: var(--sidebar-muted); }
.nav-item.active { background: var(--sidebar-active-bg); font-weight: 500; color: var(--sidebar-active-fg); }
.nav-item.active [data-lucide] { color: var(--sidebar-active-fg); }
.nav-item:not(.active):hover { background: var(--accent); }

/* ── Stage（shell-only 空舞台） ── */
.stage-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.stage-card {
  max-width: 480px; width: 100%;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.stage-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 12px;
  border-radius: var(--radius-pill);
  background: var(--color-primary-subtle);
  color: var(--color-primary);
  font-size: 12px; font-weight: 600;
}
.stage-title {
  font-family: var(--font-heading);
  font-size: 26px; font-weight: 800;
  color: var(--foreground); line-height: 1.2;
}
.stage-desc {
  font-size: 14px; line-height: 1.7;
  color: var(--muted-foreground);
}
.stage-badges {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 4px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
}
.badge-green  { background: var(--badge-green-bg);  color: var(--badge-green-fg); }
.badge-blue   { background: var(--badge-blue-bg);   color: var(--badge-blue-fg); }
.badge-purple { background: var(--badge-purple-bg); color: var(--badge-purple-fg); }
.badge-orange { background: var(--badge-orange-bg); color: var(--badge-orange-fg); }


/* Business content: Model management list */
.page-shell {
  min-height: 100%;
  padding: var(--space-xl);
  color: var(--foreground);
}
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-base);
  margin-bottom: var(--space-base);
}
.page-title-wrap { min-width: 0; }
.page-kicker {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-primary);
  margin-bottom: var(--space-xs);
}
.page-title {
  font-family: var(--font-heading);
  font-size: 28px;
  line-height: 1.2;
  font-weight: 800;
  color: var(--foreground);
}
.action-row {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  flex-shrink: 0;
}
.page-alert {
  display: flex;
  align-items: flex-start;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-base);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: var(--color-primary-subtle);
  color: var(--foreground);
  margin-bottom: var(--space-base);
}
.page-alert [data-lucide] {
  width: var(--icon-lg);
  height: var(--icon-lg);
  color: var(--color-primary);
  flex-shrink: 0;
  margin-top: 1px;
}
.filter-panel {
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--card);
  box-shadow: var(--shadow-sm);
  padding: var(--space-base);
  margin-bottom: var(--space-base);
}
.filter-grid {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(200px, 280px) auto;
  gap: var(--space-md);
  align-items: end;
}
.filter-field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted-foreground);
  margin-bottom: var(--space-xs);
}
.content-board {
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--card);
  overflow: hidden;
}
.board-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-base);
  padding: var(--space-base);
  border-bottom: 1px solid var(--border);
  background: var(--background);
}
.board-count {
  font-size: 13px;
  color: var(--muted-foreground);
}
.board-count strong {
  color: var(--foreground);
  font-family: var(--font-mono);
  font-weight: 600;
}
.model-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-base);
  padding: var(--space-base);
  background: var(--background);
}
.model-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--card);
  min-height: 252px;
  padding: var(--space-base);
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
}
.model-card:hover {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-md);
}
.model-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-md);
}
.model-title-group {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: var(--space-md);
}
.model-avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-lg);
  background: var(--color-primary-subtle);
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.model-avatar [data-lucide] {
  width: var(--icon-xl);
  height: var(--icon-xl);
}
.model-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-subtype {
  margin-top: 2px;
  font-size: 12px;
  color: var(--muted-foreground);
}
.more-button {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--muted-foreground);
  transition: background var(--duration-fast), color var(--duration-fast);
}
.more-button:hover {
  background: var(--accent);
  color: var(--foreground);
}
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-xs);
  min-height: 24px;
}
.badge-muted { background: var(--badge-muted-bg); color: var(--badge-muted-fg); }
.detail-list {
  display: grid;
  gap: var(--space-sm);
  margin-top: auto;
}
.detail-row {
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr);
  gap: var(--space-sm);
  align-items: start;
  font-size: 13px;
}
.detail-label { color: var(--muted-foreground); }
.detail-value {
  color: var(--foreground);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.detail-value.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.card-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--border);
}
.text-danger { color: var(--color-destructive); }
.pagination-bar {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-base);
  padding: var(--space-md) var(--space-base);
  border-top: 1px solid var(--border);
  background: var(--card);
}
.pagination-info {
  font-size: 13px;
  color: var(--muted-foreground);
}
.page-buttons { display: flex; align-items: center; gap: var(--space-xs); }
.page-button {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  color: var(--foreground);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}
.page-button.active {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: var(--primary-foreground);
}
.el-button [data-lucide] { width: var(--icon-md); height: var(--icon-md); }
.el-input__prefix [data-lucide] { width: var(--icon-md); height: var(--icon-md); color: var(--muted-foreground); }
@media (max-width: 1440px) {
  .model-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1180px) {
  .filter-grid { grid-template-columns: 1fr; }
  .page-header { flex-direction: column; }
  .action-row { width: 100%; flex-wrap: wrap; }
  .model-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, computed, nextTick } = Vue;

// ── §3.4 主题切换：JS 直接设 :root CSS 变量 ──
const darkVars = {
  '--sidebar-bg':           '#18181b',
  '--sidebar-border':       '#27272a',
  '--sidebar-fg':           '#fafafa',
  '--sidebar-muted':        '#a1a1aa',
  '--sidebar-active-bg':    '#27272a',
  '--sidebar-active-fg':    '#fafafa',
  '--body-bg':              '#09090b',
  '--background':           '#09090b',
  '--card':                 '#18181b',
  '--accent':               '#27272a',
  '--muted':                '#27272a',
  '--muted-foreground':     '#a1a1aa',
  '--border':               '#27272a',
  '--input':                '#18181b',
  '--foreground':           '#fafafa',
  '--color-primary':        '#7c6ff7',
  '--color-primary-subtle': '#221838',
  '--badge-purple-bg':      '#221838', '--badge-purple-fg': '#9878c8',
  '--badge-blue-bg':        '#1c2438', '--badge-blue-fg':   '#7a9ac8',

          </button>
          <button class="nav-icon-btn" title="Toggle theme" @click="toggleTheme" aria-label="Toggle color theme">
            <i :data-lucide="isDark ? 'moon' : 'sun'"></i>
          </button>
          <div class="nav-avatar" role="button" tabindex="0" aria-label="User menu">U</div>
        </div>
      </nav>

      <!-- Body §3.1 -->
      <div class="body">

        <!-- Sidebar §3.3 -->
        <aside class="sidebar" role="navigation" aria-label="Sidebar navigation">
          <div class="sidebar-section">
            <div class="sidebar-section-title">{{ t.discover }}</div>
            <button class="nav-item" :class="{ active: activeNav === 'models' }" @click="activeNav = 'models'">
              <i data-lucide="compass"></i>{{ t.models }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'playground' }" @click="activeNav = 'playground'">
              <i data-lucide="square-terminal"></i>{{ t.playground }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'apikeys' }" @click="activeNav = 'apikeys'">
              <i data-lucide="key"></i>{{ t.apiKeys }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'docs' }" @click="activeNav = 'docs'">
              <i data-lucide="book-open"></i>{{ t.docs }}
            </button>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">{{ t.appLabel }}</div>
            <button class="nav-item" :class="{ active: activeNav === 'text' }" @click="activeNav = 'text'">
              <i data-lucide="message-square"></i>{{ t.text }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'images' }" @click="activeNav = 'images'">
              <i data-lucide="image"></i>{{ t.images }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'video' }" @click="activeNav = 'video'">
              <i data-lucide="video"></i>{{ t.video }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'audio' }" @click="activeNav = 'audio'">
              <i data-lucide="headphones"></i>{{ t.audio }}
            </button>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-section-title">{{ t.management }}</div>
            <button class="nav-item" :class="{ active: activeNav === 'mymodels' }" @click="activeNav = 'mymodels'">
              <i data-lucide="cpu"></i>{{ t.myModels }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'knowledge' }" @click="activeNav = 'knowledge'">
              <i data-lucide="database"></i>{{ t.knowledge }}
            </button>
            <button class="nav-item" :class="{ active: activeNav === 'tools' }" @click="activeNav = 'tools'">
              <i data-lucide="wrench"></i>{{ t.tools }}
            </button>
          </div>
        </aside>

        <!-- Main — shell-only 空舞台 -->
        <main class="main" role="main">
          <div class="page-shell">
            <div class="page-header">
              <div class="page-title-wrap">
                <div class="page-kicker">{{ t.page.kicker }}</div>
                <h1 class="page-title">{{ t.page.title }}</h1>
              </div>
              <div class="action-row">
                <el-button plain type="primary">
                  <i data-lucide="upload"></i>
                  <span>{{ t.page.export }}</span>
                </el-button>
                <el-button plain type="primary">
                  <i data-lucide="download"></i>
                  <span>{{ t.page.import }}</span>
                </el-button>
                <el-button type="primary">
                  <i data-lucide="plus"></i>
                  <span>{{ t.page.addModel }}</span>
                </el-button>
              </div>
            </div>

            <div class="page-alert">
              <i data-lucide="info"></i>
              <p>{{ t.page.alert }}</p>
            </div>

            <section class="filter-panel" aria-label="Filter">
              <div class="filter-grid">
                <div class="filter-field">
                  <label>{{ t.page.modelName }}</label>
                  <el-input v-model="searchText" :placeholder="t.page.modelName" clearable>
                    <template #prefix><i data-lucide="search"></i></template>
                  </el-input>
                </div>
                <div class="filter-field">
                  <label>{{ t.page.modelType }}</label>
                  <el-select v-model="modelTypeFilter" :placeholder="t.page.allTypes" clearable class="w-full">
                    <el-option :label="t.page.allTypes" value=""></el-option>
                    <el-option
                      v-for="value in modelTypeValues"
                      :key="value"
                      :label="modelTypeLabel(value)"
                      :value="value"
                    ></el-option>
                  </el-select>
                </div>
                <div class="action-row">
                  <el-button type="primary">
                    <i data-lucide="search"></i>
                    <span>{{ t.page.search }}</span>
                  </el-button>
                  <el-button @click="resetFilters">{{ t.page.reset }}</el-button>
                </div>
              </div>
            </section>

            <section class="content-board" aria-label="Model list">
              <div class="board-toolbar">
                <div class="board-count">{{ t.page.listTotal }} <strong>{{ filteredModels.length }}</strong></div>
              </div>

              <div class="model-grid">
                <article v-for="row in filteredModels" :key="row.name" class="model-card">
                  <div class="model-card-head">
                    <div class="model-title-group">
                      <div class="model-avatar"><i data-lucide="box"></i></div>
                      <div class="min-w-0">
                        <h2 class="model-name">{{ row.name }}</h2>
                        <div class="model-subtype">{{ modelTypeLabel(row.type) }}</div>
                      </div>
                    </div>
                    <el-dropdown trigger="click">
                      <button class="more-button" :aria-label="t.page.menu"><i data-lucide="ellipsis"></i></button>
                      <template #dropdown>
                        <el-dropdown-menu>
                          <el-dropdown-item><i data-lucide="pencil"></i>{{ t.page.edit }}</el-dropdown-item>
                          <el-dropdown-item class="text-danger"><i data-lucide="trash-2"></i>{{ t.page.delete }}</el-dropdown-item>
                        </el-dropdown-menu>
                      </template>
                    </el-dropdown>
                  </div>

                  <div class="tag-row">
                    <span v-for="tag in row.tags" :key="tag" class="badge badge-blue">{{ tag }}</span>
                  </div>

                  <div class="detail-list">
                    <div class="detail-row">
                      <span class="detail-label">{{ t.page.tags }}</span>
                      <span class="detail-value">{{ row.tags.join(', ') || '-' }}</span>
                    </div>
                    <div class="detail-row">
                      <span class="detail-label">{{ t.page.type }}</span>
                      <span class="detail-value">{{ modelTypeLabel(row.type) }}</span>
                    </div>
                    <div class="detail-row">
                      <span class="detail-label">{{ t.page.description }}</span>
                      <span class="detail-value">{{ row.desc }}</span>
                    </div>
                    <div class="detail-row">
                      <span class="detail-label">{{ t.page.version }}</span>
                      <span class="detail-value mono">{{ row.version }}</span>
                    </div>
                    <div class="detail-row">
                      <span class="detail-label">{{ t.page.lastUpdateTime }}</span>
                      <span class="detail-value mono">{{ row.update }}</span>
                    </div>
                  </div>

                  <div class="card-actions">
                    <el-button text type="primary"><i data-lucide="pencil"></i>{{ t.page.edit }}</el-button>
                    <el-button text type="danger"><i data-lucide="trash-2"></i>{{ t.page.delete }}</el-button>
                  </div>
                </article>
              </div>

              <div class="pagination-bar">
                <div class="pagination-info">{{ t.page.showing }}</div>
                <div class="page-buttons">
                  <button class="page-button" aria-label="Previous"><i data-lucide="chevron-left"></i></button>
                  <button class="page-button active">1</button>
                  <button class="page-button" aria-label="Next"><i data-lucide="chevron-right"></i></button>
                </div>
              </div>
            </section>
          </div>
        </main>

      </div>
    </div>
  `
});

for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, comp);
}
app.use(ElementPlus);
app.mount('#app');
lucide.createIcons();
</script>
</body>
</html>
