  height: 32px;
  min-width: 32px;
  padding: 0;
  border: 0;
  border-radius: var(--ui-radius-md);
  background: transparent;
  color: var(--ui-text-muted);
  cursor: help;
}

.check-conclusion__info-trigger:hover,

// ──────────────────────────────────────────────
// §5.0 Prototype Component Library —— 运行时组件库
// 配套 CSS 见 <style> 块；API 文档见当前 skill 的组件 reference
// 使用：注册为 Vue Global Component，原型直接 <KpiCard></KpiCard>
// ──────────────────────────────────────────────
const PrototypeComponents = {

  // <HeaderBox title> + slot:actions + default slot（filter/extra 内容）
  // v6.9.3: 移除 subtitle——所有页面一律不传副标题（references/base-spec.md §7）
  HeaderBox: {
    props: {
      title:    { type: String, required: true },
    },
    template: `
      <div class="header-box" data-component="header-box">
        <div class="header-box__top">
          <div style="min-width:0;">
            <h1 class="header-box__title">{{ title }}</h1>
          </div>
          <div v-if="$slots.actions" class="header-box__right">
            <slot name="actions"></slot>
          </div>
        </div>
        <div v-if="$slots.default" class="header-box__content">
          <slot></slot>
        </div>
      </div>
    `
  },

  // <KpiCard title value icon iconColor trend trendType>
  KpiCard: {
    props: {
      title:     { type: String, required: true },
      value:     { type: [String, Number], default: '' },
      icon:      { type: String, default: '' },
      iconColor: { type: String, default: 'primary' }, // primary|success|action|destructive
      trend:     { type: String, default: '' },
      trendType: { type: String, default: 'neutral' }, // up|down|neutral
    },
    template: `
      <div class="kpi-card" data-component="kpi-card">
        <div class="kpi-card__header">
          <span class="kpi-card__title">{{ title }}</span>
          <i v-if="icon" :data-lucide="icon" class="kpi-card__icon" :class="'kpi-card__icon--' + iconColor"></i>
        </div>
        <div class="kpi-card__value"><slot>{{ value }}</slot></div>
        <div v-if="trend || $slots.trend" class="kpi-card__trend" :class="'kpi-card__trend--' + trendType">
          <slot name="trend">{{ trend }}</slot>
        </div>
      </div>
    `
  },

  // <StatusBadge status [label]> — status: active|pending|expiringSoon|inactive|revoked|expired|error
  StatusBadge: {
    props: {
      status: { type: String, required: true },
      label:  { type: String, default: '' },
    },
    computed: {
      badgeClass() {
        return {
          active:        'badge-green',
          pending:       'badge-action',
          expiringSoon:  'badge-action',
          inactive:      'badge-muted',
          revoked:       'badge-red',
          expired:       'badge-muted',
          error:         'badge-red',
        }[this.status] || 'badge-muted';
      },
      isActionPending() {
        return this.status === 'pending' || this.status === 'expiringSoon';
      }
    },
    template: `
      <span class="status-badge" :class="badgeClass" data-component="status-badge">
        <span v-if="isActionPending" aria-hidden="true">◷</span>
        <span v-else class="status-badge__dot"></span>
        <span><slot>{{ label || status }}</slot></span>
      </span>
    `
  },

  // <EmptyState icon title hint> + slot:action
  EmptyState: {
    props: {
      icon:  { type: String, default: 'inbox' },
      title: { type: String, required: true },
      hint:  { type: String, default: '' },
    },
    template: `
      <div class="empty-state" data-component="empty-state">
        <i :data-lucide="icon" class="empty-state__icon"></i>
        <p class="empty-state__title">{{ title }}</p>
        <p v-if="hint" class="empty-state__hint">{{ hint }}</p>
        <div v-if="$slots.action"><slot name="action"></slot></div>
      </div>
    `
  },

  // <Alert variant title desc closable> — variant: success|action|error|info
  Alert: {
    props: {
      variant:  { type: String, default: 'info' },
      title:    { type: String, required: true },
      desc:     { type: String, default: '' },
      closable: { type: Boolean, default: false },
    },
    data() { return { visible: true }; },
    computed: {
      iconName() {
        return {
          success: 'circle-check',
          action: 'clock-3',
          error:   'circle-x',
          info:    'info',
        }[this.variant] || 'info';
      }
    },
    template: `
      <div v-if="visible" class="alert" :class="'alert-' + variant" data-component="alert">
        <i :data-lucide="iconName" class="alert-icon"></i>
        <div class="alert-body">
          <p class="alert-title">{{ title }}</p>
          <p v-if="desc || $slots.default" class="alert-desc"><slot>{{ desc }}</slot></p>
        </div>
        <button v-if="closable" class="alert-close" type="button" @click="visible = false" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
    `
  },

  // <UsageBar used total unit color showText> — color: auto|primary|success|attention|danger
  // v3.5
  UsageBar: {
    props: {
      used:     { type: Number, required: true },
      total:    { type: Number, required: true },
      unit:     { type: String, default: '' },
      color:    { type: String, default: 'auto' },
      showText: { type: Boolean, default: true },
    },
    computed: {
      percent() {
        if (!this.total) return 0;
        return Math.min(100, (this.used / this.total) * 100);
      },
      autoColor() {
        if (this.color !== 'auto') return this.color;
        if (this.percent >= 100) return 'danger';
        if (this.percent >= 80)  return 'attention';
        return 'primary';
      },
    },
    template: `
      <div class="usage-bar" data-component="usage-bar">
        <div class="usage-bar__track">
          <div class="usage-bar__fill" :class="'usage-bar__fill--' + autoColor" :style="{ width: percent + '%' }"></div>
        </div>
        <span v-if="showText" class="usage-bar__text">
          <slot>{{ used }}{{ unit }} / {{ total }}{{ unit }}</slot>
        </span>
      </div>
    `
  },

  // <KvCard title :items hover labelWidth> + slot:headerRight + slot:[item.key] for custom value
  // items: [{ label: '名称', value: '...', key: 'name' }]
  // v3.5
  KvCard: {
    props: {
      title:      { type: String, default: '' },
      items:      { type: Array, default: () => [] },
      labelWidth: { type: String, default: 'auto' },
      hover:      { type: Boolean, default: false },
    },
    template: `
      <div class="kv-card" :class="{ 'kv-card--hover': hover }" data-component="kv-card">
        <div v-if="title || $slots.headerRight" class="kv-card__head">
          <div class="kv-card__title">{{ title }}</div>
          <div v-if="$slots.headerRight" class="kv-card__head-right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="kv-card__body">
          <div v-for="(it, i) in items" :key="it.key || i" class="kv-card__row">
            <div class="kv-card__label" :style="labelWidth !== 'auto' ? { width: labelWidth } : {}">{{ it.label }}：</div>
            <div class="kv-card__value">
              <slot :name="it.key || ('item' + i)" :item="it">{{ it.value }}</slot>
            </div>
          </div>
          <slot></slot>
        </div>
      </div>
    `
  },

  // <DetailSection title> + slot:headerRight + default
  // 左侧 4px 主色竖条 + 标题，详情页 section 标准
  // v3.5
  DetailSection: {
    props: {
      title: { type: String, required: true },
    },
    template: `
      <div class="detail-section" data-component="detail-section">
        <div class="detail-section__head">
          <span class="detail-section__title">{{ title }}</span>
          <div v-if="$slots.headerRight" class="detail-section__right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="detail-section__body">
          <slot></slot>
        </div>
      </div>
    `
  },

  // <TableActions :actions max>
  // actions: [{ label, type?, icon?, disabled?, danger?, onClick }]
  // ≤max 显示为 link button，>max 自动收纳到 ... 更多 dropdown
  // v3.5
  TableActions: {
    props: {
      actions: { type: Array, required: true },
      max:     { type: Number, default: 3 },
    },
    computed: {
      visibleActions()  { return this.actions.slice(0, this.max); },
      overflowActions() { return this.actions.slice(this.max); },
    },
    methods: {
      handle(a, e) { if (a.onClick) a.onClick(e); },
    },
    template: `
      <div class="table-actions" data-component="table-actions">
        <el-button
          v-for="(a, i) in visibleActions" :key="'v' + i"
          link
          :type="a.danger ? 'danger' : (a.type || 'primary')"
          :disabled="a.disabled"
          @click="handle(a, $event)"
        >
          <i v-if="a.icon" :data-lucide="a.icon" style="width:14px;height:14px;margin-right:4px;"></i>
          {{ a.label }}
        </el-button>
        <el-dropdown v-if="overflowActions.length" trigger="click">
          <el-button link type="primary">
            <i data-lucide="ellipsis" style="width:16px;height:16px;"></i>
          </el-button>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item
                v-for="(a, i) in overflowActions" :key="'o' + i"
                :disabled="a.disabled"
                :class="{ 'is-danger': a.danger }"
                @click="handle(a, $event)"
              >
                <i v-if="a.icon" :data-lucide="a.icon" style="width:14px;height:14px;margin-right:6px;"></i>
                {{ a.label }}
              </el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </div>
    `
  },

  // <PageHeader title eyebrow eyebrowIcon backLabel statusLabel statusColor>（v6.9.3 无 subtitle；back 渲染在标题左侧）
  //   + slot:actions + slot:avatar + emit:back
  // 段级 / 页级标题（无 card 边框）。HeaderBox 是页级 card 容器；PageHeader 是无边框轻量标题。
  // v6.4 B-Pro Designer 标准（实战验证 REQ-20260515 EU + Provider 32 个 section 标题）：
  //   - title 22px / weight 700 (type scale 第 3 档)
  //   - actions align-items: flex-end baseline 对齐
  //   - eyebrow muted 色（不抢 CTA 戏）
  //   - status pill 5 个 variant (green / action / red / purple / muted)
  //   - 详情页支持 backLabel + emit:back，头像支持 slot:avatar
  PageHeader: {
    props: {
      title:        { type: String, required: true },
      eyebrow:      { type: String, default: '' },
      eyebrowIcon:  { type: String, default: '' },
      backLabel:    { type: String, default: '' },   // v6.9.3: 返回链接文案；back 固定渲染在标题左侧 inline
      statusLabel:  { type: String, default: '' },
      statusColor:  { type: String, default: 'muted' }, // green | action | red | purple | muted
      // v6.9.3 起移除 subtitle：所有页面一律不传副标题（见 references/base-spec.md §7）
    },
    emits: ['back'],
    template: `
      <div data-component="page-header-pro">
        <div class="page-header">
          <div class="page-header__left">
            <div v-if="eyebrow" class="page-header__eyebrow">
              <span v-if="!eyebrowIcon" class="page-header__eyebrow-dot"></span>
              <i v-else :data-lucide="eyebrowIcon"></i>
              <span>{{ eyebrow }}</span>
            </div>
            <div class="page-header__title-row">
              <a v-if="backLabel" class="page-header__back" href="javascript:void(0)" :title="backLabel" @click="$emit('back')">
                <i data-lucide="chevron-left"></i>
                <span>{{ backLabel }}</span>
              </a>
              <slot name="avatar"></slot>
              <h1 class="page-header__title">{{ title }}</h1>
              <span v-if="statusLabel" :class="['page-header__status-pill', 'page-header__status-pill--' + statusColor]">{{ statusLabel }}</span>
            </div>
          </div>
          <div v-if="$slots.actions" class="page-header__right">
            <slot name="actions"></slot>
          </div>
        </div>
      </div>
    `
  },

  // <MetricsStrip :items cols divided>
  // items: [{ label, value, sub?, accent?, slot?, key? }]
  // 等分指标条（Hero 详情 / Overview 必备），cols 不传时按 items.length 自动等分
  // v3.8
  MetricsStrip: {
    props: {
      items:   { type: Array,   required: true },
      cols:    { type: Number,  default: 0 },
      divided: { type: Boolean, default: true },
    },
    template: `
      <div
        class="metrics-strip"
        :class="{ 'metrics-strip--divided': divided }"
        :style="{ gridTemplateColumns: 'repeat(' + (cols || items.length) + ', minmax(0, 1fr))' }"
        data-component="metrics-strip"
      >
        <div v-for="(item, i) in items" :key="item.key || i" class="metrics-strip__cell">
          <div class="metrics-strip__label">{{ item.label }}</div>
          <div class="metrics-strip__value" :class="{ 'metrics-strip__value--accent': item.accent }">
            <slot v-if="item.slot" :name="item.slot" :item="item">{{ item.value }}</slot>
            <template v-else>{{ item.value }}</template>
          </div>
          <div v-if="item.sub" class="metrics-strip__sub">{{ item.sub }}</div>
        </div>
      </div>
    `
  },

  // <HeroBand eyebrow eyebrowIcon title desc :points tone> + slot:right
  // Overview 引导带：营销叙事 + 右侧 CTA/选择卡
  // tone: primary | neutral | gradient
  // v3.8
  HeroBand: {
    props: {
      eyebrow:     { type: String, default: '' },
      eyebrowIcon: { type: String, default: '' },
      title:       { type: String, required: true },
      desc:        { type: String, default: '' },
      points:      { type: Array,  default: () => [] }, // [{icon, title, desc}]
      tone:        { type: String, default: 'primary' },
    },
    template: `
      <div class="hero-band" :class="['hero-band--' + tone, { 'hero-band--with-right': !!$slots.right }]" data-component="hero-band">
        <div class="hero-band__left">
          <div v-if="eyebrow" class="hero-band__eyebrow">
            <i v-if="eyebrowIcon" :data-lucide="eyebrowIcon"></i>
            <span>{{ eyebrow }}</span>
          </div>
          <h1 class="hero-band__title">{{ title }}</h1>
          <p v-if="desc" class="hero-band__desc">{{ desc }}</p>
          <div v-if="points.length" class="hero-band__points">
            <div v-for="(p, i) in points" :key="i" class="hero-band__point">
              <i v-if="p.icon" :data-lucide="p.icon"></i>
              <div>
                <strong v-if="p.title">{{ p.title }}</strong>
                <span v-if="p.desc">{{ p.desc }}</span>
              </div>
            </div>
          </div>
        </div>
        <div v-if="$slots.right" class="hero-band__right">
          <slot name="right"></slot>
        </div>
      </div>
    `
  },

  // <StepPills :steps separator>
  // steps: [{ label, state: 'done'|'doneGreen'|'current'|'todo' }]
  // 微型流程指示器（轻量 stepper）
  // v3.8
  StepPills: {
    props: {
      steps:     { type: Array,  required: true },
      separator: { type: String, default: '›' },
    },
    template: `
      <div class="step-pills" data-component="step-pills">
        <template v-for="(step, i) in steps" :key="i">
          <span class="step-pill" :class="'step-pill--' + step.state">{{ step.label }}</span>
          <span v-if="i < steps.length - 1" class="step-pill__sep">{{ separator }}</span>
        </template>
      </div>
    `
  },

  // <ProgressBar value max state height>
  // 三态进度条原子（auto: ≥80% attention, ≥100% danger）
  // 与 UsageBar 区别：ProgressBar 是裸进度条原子，UsageBar = 进度条 + 数字文本组合
  // v3.8
  ProgressBar: {
    props: {
      value:  { type: Number, required: true },
      max:    { type: Number, default: 100 },
      state:  { type: String, default: 'auto' },
      height: { type: Number, default: 6 },
    },
    computed: {
      percent() { return Math.min(100, this.max ? (this.value / this.max) * 100 : 0); },
      autoState() {
        if (this.state !== 'auto') return this.state;
        if (this.percent >= 100) return 'danger';
        if (this.percent >= 80)  return 'attention';
        return 'normal';
      },
    },
    template: `
      <div class="progress-bar" :style="{ height: height + 'px' }" data-component="progress-bar">
        <div class="progress-bar__fill"
             :class="'progress-bar__fill--' + autoState"
             :style="{ width: percent + '%' }"></div>
      </div>
    `
  },

  // <DataTable :data :columns :total :page :pageSize loading emptyText showPagination operationsLabel operationsWidth>
  // columns: [{ label, prop, width?, minWidth?, fixed?, align?, sortable?, slot? }]
  // slot per column via slot 名（在 columns 里声明 slot 字段）
  // slot:operations 自动生成右侧固定操作列
  // v-model:page 双向绑定页码
  // v3.7
  DataTable: {
    props: {
      data:            { type: Array,   default: () => [] },
      columns:         { type: Array,   required: true },
      total:           { type: Number,  default: 0 },
      page:            { type: Number,  default: 1 },
      pageSize:        { type: Number,  default: 10 },
      loading:         { type: Boolean, default: false },
      emptyText:       { type: String,  default: '暂无数据 / No data' },
      showPagination:  { type: Boolean, default: true },
      operationsLabel: { type: String,  default: '操作' },
      operationsWidth: { type: [String, Number], default: 160 },
    },
    emits: ['update:page', 'update:pageSize', 'row-click'],
    template: `
      <div class="data-table" data-component="data-table">
        <el-table
          v-loading="loading"
          :data="data"
          :empty-text="emptyText"
          style="width:100%;"
          @row-click="(row) => $emit('row-click', row)"
        >
          <el-table-column
            v-for="col in columns"
            :key="col.key || col.prop || col.label"
            :prop="col.prop"
            :label="col.label"
            :width="col.width"
            :min-width="col.minWidth"
            :fixed="col.fixed"
            :align="col.align || 'left'"
            :sortable="col.sortable"
          >
            <template #default="scope" v-if="col.slot">
              <slot :name="col.slot" :row="scope.row" :col="col" :index="scope.$index"></slot>
            </template>
          </el-table-column>
          <el-table-column
            v-if="$slots.operations"
            :label="operationsLabel"
            :width="operationsWidth"
            fixed="right"
          >
            <template #default="scope">
              <slot name="operations" :row="scope.row" :index="scope.$index"></slot>
            </template>
          </el-table-column>
        </el-table>
        <div v-if="showPagination && total > 0" class="data-table__pagination">
          <el-pagination
            :current-page="page"
            :page-size="pageSize"
            :total="total"
            layout="total, prev, pager, next"
            :pager-count="5"
            background
            @current-change="(p) => $emit('update:page', p)"
            @size-change="(s) => $emit('update:pageSize', s)"
          ></el-pagination>
        </div>
      </div>
    `
  },

  // <Tag color preset icon> + slot:default — 通用标签（非状态）
  // color: purple|blue|green|action|muted|red
  // preset: trending|new|beta|stable|deprecated（Tag 词汇表）
  //       | conversation|multi-modal|reasoning|embedding|image（模型类型）
  // v3.6
  Tag: {
    props: {
      color:  { type: String, default: 'muted' },
      preset: { type: String, default: '' },
      icon:   { type: String, default: '' },
    },
    computed: {
      finalColor() {
        const map = {
          // Tag 词汇表（§2.3）
          trending: 'purple', new: 'green', beta: 'blue', stable: 'muted', deprecated: 'muted',
          // 模型类型 Badge（§2.3）
          conversation: 'blue', 'multi-modal': 'purple', reasoning: 'action', embedding: 'blue', image: 'green',
        };
        return this.preset ? (map[this.preset.toLowerCase()] || this.color) : this.color;
      },
      finalIcon() {
        if (this.preset === 'deprecated') return 'triangle-alert';
        return this.icon;
      },
      finalLabel() {
        const labelMap = { 'multi-modal': 'Multi-Modal' };
        if (labelMap[this.preset]) return labelMap[this.preset];
        if (!this.preset) return '';
        return this.preset.charAt(0).toUpperCase() + this.preset.slice(1);
      }
    },
    template: `
      <span class="tag" :class="'badge-' + finalColor" data-component="tag">
        <i v-if="finalIcon" :data-lucide="finalIcon"></i>
        <slot>{{ finalLabel }}</slot>
      </span>
    `
  },

  // <CardBox title> + slot:headerRight + default — 通用卡片容器
  // v3.6
  CardBox: {
    props: {
      title:  { type: String, default: '' },
      padded: { type: Boolean, default: false },
    },
    template: `
      <div class="card-box" :class="{ 'card-box--padded': padded }" data-component="card-box">
        <div v-if="title || $slots.headerRight" class="card-box__head">
          <div class="card-box__title">{{ title }}</div>
          <div v-if="$slots.headerRight" class="card-box__head-right">
            <slot name="headerRight"></slot>
          </div>
        </div>
        <div class="card-box__body"><slot></slot></div>
      </div>
    `
  },

  // <Tabs :options v-model variant> — 独立 Tabs（不绑定 DetailPage）
  // variant: underline (默认) | segmented
  // options: [{ label, value, count? }]
  // v3.6
  Tabs: {
    props: {
      options:    { type: Array, required: true },
      modelValue: { type: [String, Number], default: '' },
      variant:    { type: String, default: 'underline' },
    },
    emits: ['update:modelValue'],
    template: `
      <div v-if="variant === 'segmented'" class="tabs-segmented" data-component="tabs">
        <button

          type="button"
          class="tabs-segmented__item"
          :class="{ 'is-active': modelValue === opt.value }"
          @click="$emit('update:modelValue', opt.value)"
        >
          {{ opt.label }}
          <span v-if="opt.count != null" class="tabs-segmented__count">{{ opt.count }}</span>
        </button>
      </div>
      <div v-else class="detail-tabs" data-component="tabs">
        <button
          v-for="opt in options" :key="opt.value"
          type="button"
          class="detail-tabs__item"
          :class="{ 'is-active': modelValue === opt.value }"
          @click="$emit('update:modelValue', opt.value)"
        >
          {{ opt.label }}
          <span v-if="opt.count != null" style="margin-left:6px;color:var(--ui-text-muted);font-weight:400;">({{ opt.count }})</span>
        </button>
      </div>
    `

  // <Avatar src name size color> — 用户头像（letter fallback + 自动配色）
  // size: small|default|large
  // v3.6
  Avatar: {
    props: {
      src:   { type: String, default: '' },
      name:  { type: String, default: '' },
      size:  { type: String, default: 'default' },
      color: { type: String, default: '' }, // 自定义背景色
    },
    computed: {
      initials() {
        if (!this.name) return '?';
        const parts = this.name.trim().split(/\s+/);
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return this.name.substring(0, 2).toUpperCase();
      },
      sizeClass() { return 'avatar-' + this.size; },
      autoBg() {
        if (this.color) return this.color;
        if (!this.name) return 'var(--ui-bg-muted)';
        const palette = [
          'var(--ui-badge-purple-bg)',
          'var(--ui-badge-blue-bg)',
          'var(--ui-badge-green-bg)',
          'var(--ui-badge-action-bg)',
          'var(--ui-badge-blue-bg)',
        ];
        const hash = [...this.name].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        return palette[hash % palette.length];
      },
      autoFg() {
        if (this.color) return 'var(--ui-text-on-brand)';
        if (!this.name) return 'var(--ui-text-muted)';
        const palette = [
          'var(--ui-badge-purple-fg)',
          'var(--ui-badge-blue-fg)',
          'var(--ui-badge-green-fg)',
          'var(--ui-badge-action-fg)',
          'var(--ui-badge-blue-fg)',
        ];
        const hash = [...this.name].reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        return palette[hash % palette.length];
      },
    },
    template: `
      <div class="avatar" :class="sizeClass" data-component="avatar"
           :style="{ background: autoBg, color: autoFg }">
        <img v-if="src" :src="src" :alt="name" />
        <span v-else>{{ initials }}</span>
      </div>
    `
  },

  // <BalanceBox :info :lang> — TopNav 余额药丸（对齐 project-mamba BalanceBox.vue）
  // info: { balance: Number, level: 'normal'|'low'|'critical'|'empty', currency: 'credits', showTopUp: Boolean, loading?: Boolean, topUpLabel?: String, runwayDays?: Number }
  // 4 alert levels 自动配色；level=normal 不显示左侧 dot，critical/empty 显示脉冲 dot
  // POINTS / CREDIT / CREDITS 统一按代码侧规范显示为小写 credits；其他币种保持原值
  // topUpLabel 不传时按 lang prop 自动 zh→"充值" / en→"Top Up"
  // v4.6 / v4.7 修正：图标 normal→database，移除自动加 s，CTA 跟随 lang
  BalanceBox: {
    props: {
      info: { type: Object, required: true },
      lang: { type: String, default: 'en' },
    },
    computed: {
      isLoading() { return this.info?.loading === true; },
      level() {
        const lv = (this.info?.level || 'normal').toLowerCase();
        return ['normal', 'low', 'critical', 'empty'].includes(lv) ? lv : 'normal';
      },
      iconName() {
        return {
          normal:   'database',         // 圆筒 + 顶盖，最接近 EP Coin
          low:      'wallet',
          critical: 'triangle-alert',
          empty:    'circle-x',
        }[this.level];
      },
      showDot() { return this.level === 'critical' || this.level === 'empty'; },
      showTopUp() { return this.info?.showTopUp !== false; },
      currency() {
        const value = String(this.info?.currency || 'credits').trim();
        return ['POINTS', 'CREDIT', 'CREDITS'].includes(value.toUpperCase()) ? 'credits' : value;
      },
      topUpText() {
        if (this.info?.topUpLabel) return this.info.topUpLabel;
        return this.lang === 'zh' ? '充值' : 'Top Up';
      },
      formattedBalance() {
        const n = Number(this.info?.balance);
        if (!Number.isFinite(n)) return '--';
        return n.toLocaleString('en-US', { maximumFractionDigits: Number.isInteger(n) ? 0 : 2 });
      },
    },
    template: `
      <div class="balance-pill" data-component="balance-pill"
           :class="[isLoading ? 'balance-pill--loading' : 'balance-pill--' + level, { 'balance-pill--readonly': !showTopUp }]"
           role="status" :aria-label="isLoading ? (lang === 'zh' ? '余额加载中' : 'Balance loading') : formattedBalance + ' ' + currency">
        <span v-if="!isLoading && showDot" class="balance-pill__dot" aria-hidden="true"></span>
        <span v-if="isLoading" class="balance-pill__icon balance-pill__icon--skeleton" aria-hidden="true"></span>
        <i v-else :data-lucide="iconName" class="balance-pill__icon"></i>
        <span class="balance-pill__num">{{ formattedBalance }}</span>
        <span class="balance-pill__unit">{{ currency }}</span>
        <button v-if="!isLoading && showTopUp" class="balance-pill__cta" type="button" @click.stop>
          <i data-lucide="plus"></i>
          <span>{{ topUpText }}</span>
        </button>
      </div>
    `
  },

  // <DetailPage title :tabs activeTab showBack> + slot:actions + default
  // 详情页组合壳：MainBox + HeaderBox(返回在标题左侧 + 标题 + actions) + 可选 Tabs + ScrollBox
  // v3.5 · v6.9.3 移除 subtitle（所有页面不传副标题）；back 已在标题左侧 inline
  DetailPage: {
    props: {
      title:     { type: String, required: true },
      tabs:      { type: Array, default: () => [] },
      activeTab: { type: [String, Number], default: '' },
      showBack:  { type: Boolean, default: true },
    },
    emits: ['update:activeTab', 'back'],
    template: `
      <div class="main-box" data-component="main-box">
        <div class="header-box" data-component="header-box">
          <div class="header-box__top">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              <button v-if="showBack" class="btn-back" type="button" @click="$emit('back')" aria-label="Back">
                <i data-lucide="arrow-left"></i>
              </button>
              <div style="min-width:0;">
                <h1 class="header-box__title">{{ title }}</h1>
              </div>
            </div>
            <div v-if="$slots.actions" class="header-box__right">
              <slot name="actions"></slot>
            </div>
          </div>
          <div v-if="tabs.length" class="header-box__content" style="padding-top:0;border-top:none;">
            <div class="detail-tabs" data-component="detail-tabs">
              <button
                v-for="tab in tabs" :key="tab.value"
                class="detail-tabs__item"
                :class="{ 'is-active': activeTab === tab.value }"
                type="button"
                @click="$emit('update:activeTab', tab.value)"
              >{{ tab.label }}</button>
            </div>
          </div>
        </div>
        <el-scrollbar>
          <div class="scroll-box-inner" data-scroll-box data-component="scroll-box">
            <slot></slot>
          </div>
        </el-scrollbar>
      </div>
    `
  },

  // <Breadcrumb :items separator>
  // items: [{ label, href? }] — 最后一项自动渲染为当前态（无链接，加粗）
  // separator: Lucide 图标名（默认 chevron-right）
  // v3.10 L1
  Breadcrumb: {
    props: {
      items:     { type: Array,  required: true },
      separator: { type: String, default: 'chevron-right' },
    },
    template: `
      <span class="breadcrumb" data-component="breadcrumb">
        <template v-for="(item, i) in items" :key="i">
          <span v-if="i === items.length - 1" class="breadcrumb-current">{{ item.label }}</span>
          <a v-else-if="item.href" :href="item.href">{{ item.label }}</a>
          <span v-else>{{ item.label }}</span>
          <i v-if="i < items.length - 1" :data-lucide="separator"></i>
        </template>
      </span>
    `
  },

  // <FilterBox variant :selectedCount> + slot:default
  // variant: standard | three-zone | selection | compact
  //   standard   — 找数据：搜索 + 筛选 + 操作按钮（默认右侧）
  //   three-zone — 显式三段（左筛选 / 中 spacer .filter-box-spacer / 右操作）
  //   selection  — 批量选中态（主色背景 + 批量操作）
  //   compact    — 紧凑高度
  // selection 变体替代旧 Toolbar；列表页顶部组件统一为 FilterBox
  // v3.10 L1
  FilterBox: {
    props: {
      variant:       { type: String, default: 'standard' }, // standard|three-zone|selection|compact
      selectedCount: { type: Number, default: 0 },
    },
    template: `
      <div
        class="filter-box"
        :class="{
          'filter-box--compact':   variant === 'compact',
          'filter-box--selection': variant === 'selection',
        }"
        data-component="filter-box"
      >
        <slot></slot>
      </div>
    `
  },

  // <I18nField v-model langs required placeholder>
  // 多语言字段 — Tabs 切换 + 圆点状态指示。v3.16 保持 runtime-component。
  // v-model 绑定一个对象，每语言一个 key（例：{ zh: '', en: '', ja: '', ko: '' }）。
  I18nField: {
    props: {
      modelValue:  { type: Object,  required: true },
      langs:       { type: Array,   default: () => [
        { code: 'zh', label: '中文',   required: true  },
        { code: 'en', label: 'English', required: true  },
        { code: 'ja', label: '日本語',  required: false },
        { code: 'ko', label: '한국어',  required: false },
      ]},
      required:    { type: Array,   default: () => [] }, // 覆盖 langs 中的 required 标记
      placeholder: { type: [String, Object], default: '' }, // 字符串或 { zh: '...', en: '...' }
    },
    emits: ['update:modelValue'],
    data() {
      return { activeTab: this.langs[0]?.code || 'zh' };
    },
    computed: {
      effectiveRequired() {
        return this.required.length > 0 ? this.required : this.langs.filter(l => l.required).map(l => l.code);
      },
      currentPlaceholder() {
        if (typeof this.placeholder === 'string') return this.placeholder;
        return this.placeholder[this.activeTab] || '';
      },
    },
    methods: {
      isRequired(code) { return this.effectiveRequired.includes(code); },
      isFilled(code)   { return ((this.modelValue || {})[code] || '').trim().length > 0; },
      dotClass(code) {
        if (this.isFilled(code))   return 'i18n-status-dot--done';
        if (this.isRequired(code)) return 'i18n-status-dot--required';
        return 'i18n-status-dot--missing';
      },
      updateValue(val) {
        this.$emit('update:modelValue', { ...(this.modelValue || {}), [this.activeTab]: val });
      },
    },
    template: `
      <div class="i18n-field" data-component="i18n-field">
        <div class="i18n-field__tabs" role="tablist">
          <button
            v-for="l in langs"
            :key="l.code"
            class="i18n-field__tab"
            :class="{ 'is-active': activeTab === l.code }"
            @click="activeTab = l.code"
            role="tab"
            type="button"
          >
            <span class="i18n-field__tab-name">{{ l.label }}</span>
            <span v-if="isRequired(l.code)" class="i18n-field__tab-required">*</span>
            <span class="i18n-status-dot" :class="dotClass(l.code)"></span>
          </button>
        </div>
        <el-input
          :model-value="(modelValue || {})[activeTab] || ''"
          @update:model-value="updateValue"
          :placeholder="currentPlaceholder"
          size="large"
        ></el-input>
      </div>
    `
  },

};

    const stateMachinePositionStyle = computed(() => {

    function clampStateMachinePosition(left = stateMachinePosition.left, top = stateMachinePosition.top) {
      const control = stateMachineControl.value;
      if (!control || !Number.isFinite(left) || !Number.isFinite(top)) return;
      const rect = control.getBoundingClientRect();
      const margin = window.innerWidth <= 640 ? 16 : 24;
      const maxLeft = Math.max(margin, window.innerWidth - rect.width - margin);
      const maxTop = Math.max(margin, window.innerHeight - rect.height - margin);
      stateMachinePosition.left = Math.min(Math.max(margin, left), maxLeft);
      stateMachinePosition.top = Math.min(Math.max(margin, top), maxTop);
    }

    function initializeStateMachinePosition() {
      if (Number.isFinite(stateMachinePosition.left) && Number.isFinite(stateMachinePosition.top)) return;
      const rect = stateMachineControl.value?.getBoundingClientRect();
      if (!rect) return;
      stateMachinePosition.left = rect.left;
      stateMachinePosition.top = rect.top;

    function startStateMachineDrag(event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;

      if (!control) return;
      initializeStateMachinePosition();
      const rect = control.getBoundingClientRect();
      stateMachineDragPointerId = event.pointerId;
      stateMachineDragOffsetX = event.clientX - rect.left;
      stateMachineDragOffsetY = event.clientY - rect.top;
      stateMachineDragStartX = event.clientX;
      stateMachineDragStartY = event.clientY;
      stateMachineDragMoved = false;
      stateMachineDragging.value = true;
      event.currentTarget.setPointerCapture?.(event.pointerId);
    }

    function moveStateMachineDrag(event) {
      if (event.pointerId !== stateMachineDragPointerId) return;

      if (!stateMachineDragMoved) return;
      event.preventDefault();
      clampStateMachinePosition(event.clientX - stateMachineDragOffsetX, event.clientY - stateMachineDragOffsetY);

      const pointerId = stateMachineDragPointerId;
      stateMachineDragPointerId = null;

      stateMachineSuppressClick = stateMachineDragMoved && event.type === 'pointerup';

      }

        ElementPlus.ElMessage.error(t.value.cloudAccount.selectRuleTimeFirst);
        return;
      }
      const nextRule = {
        accountId: individualRuleForm.accountId,
        frequency: individualRuleForm.frequency,
        weekday: individualRuleForm.weekday,
        runTime: individualRuleForm.runTime,
      };
      if (individualRuleEditIndex.value >= 0) individualInspectionRules.value.splice(individualRuleEditIndex.value, 1, nextRule);
      else individualInspectionRules.value.push(nextRule);
      closeIndividualRuleEditor();
    }

    function removeIndividualRule(index) {
      individualInspectionRules.value.splice(index, 1);
      if (individualRuleEditIndex.value === index) closeIndividualRuleEditor();
    }

    function cancelInspectionTask() {
      if (inspectionTaskSnapshot) {
        Object.assign(inspectionTask, inspectionTaskSnapshot.task);
        individualInspectionRules.value.splice(0, individualInspectionRules.value.length, ...inspectionTaskSnapshot.rules.map((rule) => ({ ...rule })));
      }
      inspectionTaskSnapshot = null;
      closeIndividualRuleEditor();
      inspectionTaskVisible.value = false;
    }

    function formatDateTime(value) {
      const date = value instanceof Date ? value : new Date(value);
      const pad = (part) => String(part).padStart(2, '0');
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
        + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    function calculateNextInspectionAt(base = new Date()) {
      const next = new Date(base);
      const [runHour, runMinute] = inspectionTask.runTime.split(':').map(Number);
      next.setHours(runHour, runMinute, 0, 0);
      if (inspectionTask.frequency === 'daily') {
        if (next <= base) next.setDate(next.getDate() + 1);
      } else {
        const daysUntilRun = (inspectionTask.weekday - next.getDay() + 7) % 7;
        next.setDate(next.getDate() + daysUntilRun);
        if (next <= base) next.setDate(next.getDate() + 7);
      }
      return formatDateTime(next);
    }

    function completeInspection(row, inspectedAt) {
      if (row.health === 'UNKNOWN') {
        row.lastAttemptedAt = inspectedAt;
        row.inspectionStatus = 'failed';
        row.inspectionReasonKey = 'inspectionFailed';
        row.failureReasonKey = 'providerRequestTimeout';
        return;
      }
      row.lastInspectedAt = inspectedAt;
      row.lastAttemptedAt = '';
      row.inspectionStatus = 'completed';
      row.inspectionReasonKey = '';
      row.failureReasonKey = '';
    }

    function saveInspectionTask() {
      if (inspectionTask.enabled && !inspectionTask.frequency) {
        ElementPlus.ElMessage.error(t.value.cloudAccount.selectRuleFrequencyFirst);
        return;
      }
      if (inspectionTask.enabled && inspectionTask.frequency === 'weekly' && (inspectionTask.weekday === '' || inspectionTask.weekday == null)) {
        ElementPlus.ElMessage.error(t.value.cloudAccount.selectRuleWeekdayFirst);
        return;
      }
      if (inspectionTask.enabled && !inspectionTask.runTime) {
        ElementPlus.ElMessage.error(t.value.cloudAccount.selectRuleTimeFirst);
        return;
      }
      inspectionTask.nextRunAt = inspectionTask.enabled && inspectionTask.frequency
        ? calculateNextInspectionAt(new Date())
        : '';
      inspectionTaskVisible.value = false;
      inspectionTaskSnapshot = null;
      closeIndividualRuleEditor();
      setScenario('listMixed');
      ElementPlus.ElMessage.success(t.value.cloudAccount.taskSaved);
    }

    function runAllInspection() {
      setScenario('listInspecting');
      inspectionTaskVisible.value = false;
      checkingAccountId.value = '*';
      ElementPlus.ElMessage.success(t.value.cloudAccount.inspectionStarted);
      if (inspectionTimer) window.clearTimeout(inspectionTimer);
      inspectionTimer = window.setTimeout(() => {
        const inspectedAt = formatDateTime(new Date());
        accountRecords.value.forEach((row) => completeInspection(row, inspectedAt));
        inspectionTask.lastRunAt = inspectedAt;
        inspectionTask.nextRunAt = inspectionTask.enabled && inspectionTask.frequency
          ? calculateNextInspectionAt(new Date())
          : '';
        checkingAccountId.value = '';
        setScenario('listMixed');
        ElementPlus.ElMessage.success(t.value.cloudAccount.inspectionCompleted);
      }, 1400);
    }

    function openInspectionLog(row) {
      selectedInspectionLogAccount.value = row;
      inspectionLogMode.value = 'output';
      inspectionLogVisible.value = true;
      inspectionTaskVisible.value = false;
    }

    function runRowInspection(row) {
      checkingAccountId.value = row.id;

      if (inspectionTimer) window.clearTimeout(inspectionTimer);
      inspectionTimer = window.setTimeout(() => {

          console: 'https://console.huaweicloud.com/',

                      <template v-else-if="row.inspectionStatus === 'failed'">
                        <div class="inspection-failure">
                          <button class="inspection-failure__summary type-body-sm" type="button" @click="openInspectionLog(row)">
                            <span class="check-conclusion__status-icon type-caption" aria-hidden="true">×</span>
                            <span>{{ t.cloudAccount.inspectionFailed }}</span>
                          </button>
                          <el-button class="check-conclusion__action" plain size="small" type="primary" @click="openInspectionLog(row)">{{ t.cloudAccount.viewInspectionLog }}</el-button>
                        </div>
                      </template>
                      <template v-else>
                        <span class="inspection-reason">{{ t.cloudAccount[row.inspectionReasonKey || 'notInspected'] }}</span>
                      </template>
                    </div>
                  </template>
                  <template #operations="{ row }">
                    <TableActions :actions="rowActions(row)" :max="2"></TableActions>
                  </template>
                </DataTable>
              </div>
            </el-scrollbar>
          </div>

          <el-dialog
            class="cloud-account-dialog"
            data-component="cloud-account-form-dialog"
            :model-value="dialogVisible"
            :title="t.cloudAccount.dialogTitle"
            width="720px"
            append-to-body
            :close-on-click-modal="false"
            :close-on-press-escape="!isChecking"
            :show-close="!isChecking"
            @close="cancelDialog"
          >
            <div v-if="dialogResult" class="cloud-account-result">
              <Alert :variant="dialogResult.variant" :title="dialogResult.title" :desc="dialogResult.desc"></Alert>
            </div>

            <el-form class="form-modern" label-position="top" size="large" :model="formModel">
              <div class="form-group cloud-account-form-grid">
                <el-form-item :label="t.cloudAccount.accountName" required :error="formErrors.name">
                  <el-input v-model="formModel.name" :disabled="isChecking"></el-input>
                </el-form-item>
                <el-form-item :label="t.cloudAccount.provider" required>
                  <el-select v-model="formModel.provider" :disabled="isChecking" style="width: 100%;">
                    <el-option :label="t.cloudAccount.aliyun" value="aliyun"></el-option>
                    <el-option :label="t.cloudAccount.aws" value="aws"></el-option>
                    <el-option :label="t.cloudAccount.google" value="google"></el-option>
                    <el-option :label="t.cloudAccount.huawei" value="huawei"></el-option>
                  </el-select>
                </el-form-item>
                <el-form-item :label="t.cloudAccount.accessKeyId" required :error="formErrors.accessKeyId">
                  <el-input ref="credentialInput" v-model="formModel.accessKeyId" :disabled="isChecking"></el-input>
                </el-form-item>
                <el-form-item :label="t.cloudAccount.accessKeySecret" required :error="formErrors.accessKeySecret">
                  <el-input v-model="formModel.accessKeySecret" type="password" show-password :disabled="isChecking"></el-input>
                </el-form-item>
              </div>
            </el-form>

            <section v-if="showCheckZone" class="cloud-account-checks" data-component="cloud-account-self-check" :aria-label="t.cloudAccount.selfCheck" aria-live="polite">
              <div
                v-for="item in checkItems"
                :key="item.key"
                class="cloud-account-check-row"
                :class="'is-' + item.state"
              >
                <span class="cloud-account-check-mark" aria-hidden="true">
                  <span v-if="item.state === 'running'" class="cloud-account-check-spinner"></span>
                  <span v-else-if="item.state === 'passed'">✓</span>
                  <span v-else-if="item.state === 'error'">!</span>
                  <span v-else-if="item.state === 'action'">!</span>
                  <span v-else-if="item.state === 'unknown'">?</span>
                  <span v-else>○</span>
                </span>
                <div class="cloud-account-check-copy">
                  <div class="cloud-account-check-summary">
                    <strong class="type-body-sm">{{ item.label }}</strong>
                    <span v-if="!item.issue" class="cloud-account-check-detail type-caption">{{ item.detail }}</span>
                  </div>
                  <div v-if="item.issue" class="cloud-account-issue" :class="'is-' + item.issueVariant" data-component="check-issue-action">
                    <div>
                      <strong class="type-body-sm">{{ item.detail }}</strong>
                      <div class="cloud-account-check-detail type-caption">{{ item.issueDesc }}</div>
                    </div>
                    <div class="cloud-account-issue__action">
                      <el-button link type="primary" @click="openProviderAction(item.action)">
                        {{ item.actionLabel }}<i :data-lucide="item.actionIcon" style="width:14px;height:14px;margin-left:4px;"></i>
                      </el-button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <template #footer>
              <div class="cloud-account-dialog-actions">
                <el-button :disabled="isChecking" @click="cancelDialog">{{ t.cloudAccount.cancel }}</el-button>
                <el-button type="primary" :loading="isChecking" :disabled="primaryDisabled" @click="handlePrimaryAction">{{ primaryLabel }}</el-button>
              </div>
            </template>
          </el-dialog>

          <el-drawer
            v-model="inspectionTaskVisible"
            class="inspection-task-drawer"
            :title="t.cloudAccount.inspectionTitle"
            size="var(--ui-drawer-standard)"
            append-to-body
          >
            <div class="inspection-task-content" data-component="inspection-task-settings">
              <section class="inspection-task-section">
                <div class="inspection-task-row">
                  <strong>{{ t.cloudAccount.inspectionEnabled }}</strong>
                  <el-switch v-model="inspectionTask.enabled"></el-switch>
                </div>
              </section>
              <section class="inspection-task-section">
                <strong>{{ t.cloudAccount.defaultInspectionRule }}</strong>
                <div class="inspection-task-row">
                  <span>{{ t.cloudAccount.inspectionScope }}</span>
                  <strong>{{ defaultInspectionScopeLabel }}</strong>
                </div>
                <div class="inspection-task-row">
                  <span>{{ t.cloudAccount.inspectionFrequency }}</span>
                  <el-select v-model="inspectionTask.frequency" :disabled="!inspectionTask.enabled" style="width: 148px;">
                    <el-option :label="t.cloudAccount.notConfigured" value=""></el-option>
                    <el-option :label="t.cloudAccount.daily" value="daily"></el-option>
                    <el-option :label="t.cloudAccount.weekly" value="weekly"></el-option>
                  </el-select>
                </div>
                <div v-if="inspectionTask.frequency === 'weekly'" class="inspection-task-row">
                  <span>{{ t.cloudAccount.executionDay }}</span>
                  <el-select v-model="inspectionTask.weekday" :disabled="!inspectionTask.enabled" style="width: 148px;">
                    <el-option v-for="(day, index) in t.cloudAccount.weekdays" :key="day" :label="day" :value="index"></el-option>
                  </el-select>
                </div>
                <div class="inspection-task-row">
                  <span>{{ t.cloudAccount.executionTime }}</span>
                  <el-time-select
                    v-model="inspectionTask.runTime"
                    :disabled="!inspectionTask.enabled"
                    start="00:00"
                    step="00:30"
                    end="23:30"
                    :placeholder="t.cloudAccount.selectTime"
                    style="width: 148px;"
                  ></el-time-select>
                </div>
                <div class="inspection-task-row">
                  <span>{{ t.cloudAccount.timeZone }}</span>
                  <strong>{{ t.cloudAccount.systemTimeZone }}</strong>
                </div>
                <div class="inspection-task-row">
                  <span>{{ t.cloudAccount.lastRun }}</span>
                  <span class="type-data">{{ inspectionTask.lastRunAt || t.cloudAccount.notInspected }}</span>
                </div>
                <div class="inspection-task-row">
                  <span>{{ t.cloudAccount.nextRun }}</span>
                  <span class="type-data">{{ inspectionTask.enabled && inspectionTask.nextRunAt ? inspectionTask.nextRunAt : t.cloudAccount.notScheduled }}</span>
                </div>
              </section>
              <section class="inspection-task-section">
                <div class="inspection-task-section__head">
                  <strong>{{ t.cloudAccount.individualInspectionRules }}</strong>
                  <el-button link type="primary" :disabled="!inspectionTask.enabled" @click="addIndividualRule">{{ t.cloudAccount.addIndividualRule }}</el-button>
                </div>
                <span class="cloud-account-cell__meta type-caption">{{ t.cloudAccount.individualRuleHint }}</span>

                <span v-if="!individualInspectionRules.length && !individualRuleEditorVisible" class="inspection-reason type-caption">{{ t.cloudAccount.noIndividualRules }}</span>
                <div v-if="individualInspectionRules.length" class="inspection-rule-list">
                  <div v-for="(rule, index) in individualInspectionRules" :key="rule.accountId" class="inspection-rule-row">
                    <div class="inspection-rule-summary">
                      <strong class="type-body-sm">{{ individualRuleAccountLabel(rule.accountId) }}</strong>
                      <span class="cloud-account-cell__meta type-caption">{{ individualRuleScheduleLabel(rule) }}</span>
                    </div>
                    <div class="inspection-rule-actions">
                      <el-button link type="primary" @click="editIndividualRule(rule, index)">{{ t.cloudAccount.edit }}</el-button>
                      <el-button link type="danger" @click="removeIndividualRule(index)">{{ t.cloudAccount.removeRule }}</el-button>
                    </div>
                  </div>
                </div>

                <div v-if="individualRuleEditorVisible" class="inspection-rule-form" data-component="individual-inspection-rule-editor">
                  <el-select class="inspection-rule-form__account" v-model="individualRuleForm.accountId" :placeholder="t.cloudAccount.selectCloudAccount">
                    <el-option
                      v-for="account in availableIndividualRuleAccounts"
                      :key="account.id"
                      :label="account.name + ' · ' + providerLabel(account.provider)"
                      :value="account.id"
                    ></el-option>
                  </el-select>
                  <el-select v-model="individualRuleForm.frequency" :placeholder="t.cloudAccount.selectFrequency">
                    <el-option :label="t.cloudAccount.daily" value="daily"></el-option>
                    <el-option :label="t.cloudAccount.weekly" value="weekly"></el-option>
                  </el-select>
                  <el-select v-if="individualRuleForm.frequency === 'weekly'" v-model="individualRuleForm.weekday" :placeholder="t.cloudAccount.selectWeekday">
                    <el-option v-for="(day, index) in t.cloudAccount.weekdays" :key="day" :label="day" :value="index"></el-option>
                  </el-select>
                  <el-time-select
                    v-model="individualRuleForm.runTime"
                    start="00:00"
                    step="00:30"
                    end="23:30"
                    :placeholder="t.cloudAccount.selectTime"
                  ></el-time-select>
                  <div class="inspection-rule-form__actions">
                    <el-button @click="closeIndividualRuleEditor">{{ t.cloudAccount.cancel }}</el-button>
                    <el-button type="primary" @click="saveIndividualRule">{{ individualRuleEditIndex >= 0 ? t.cloudAccount.saveRule : t.cloudAccount.addRule }}</el-button>
                  </div>
                </div>
              </section>
              <section class="inspection-task-section">
                <div class="inspection-task-row">
                  <strong>{{ t.cloudAccount.notifications }}</strong>
                  <el-switch v-model="inspectionTask.notifyOwner"></el-switch>
                </div>
                <span class="cloud-account-cell__meta type-caption">{{ t.cloudAccount.notifyOwner }}</span>
              </section>
              <div class="drawer-footer-actions">
                <el-button @click="cancelInspectionTask">{{ t.cloudAccount.cancel }}</el-button>
                <el-button type="primary" @click="saveInspectionTask">{{ t.cloudAccount.saveTask }}</el-button>
              </div>
            </div>
          </el-drawer>

          <el-drawer
            v-model="inspectionLogVisible"
            class="inspection-log-drawer"
            size="var(--ui-drawer-standard)"
            :show-close="false"
            append-to-body
          >
            <template #header>
              <div class="inspection-log-drawer__header-main">
                <strong class="inspection-log-drawer__header-title type-h3">{{ t.cloudAccount.inspectionLogTitle }}</strong>
                <div class="inspection-log-drawer__header-actions">
                  <el-button
                    v-if="selectedInspectionLogAccount"
                    plain
                    type="primary"
                    @click="runRowInspection(selectedInspectionLogAccount); inspectionLogVisible = false"
                  >{{ t.cloudAccount.reinspect }}</el-button>
                  <button class="inspection-log-drawer__close" type="button" style="width:32px;height:32px;min-width:32px;" :aria-label="t.cloudAccount.closePanel" @click="inspectionLogVisible = false">
                    <i data-lucide="x" style="width:16px;height:16px;" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
            </template>
            <div v-if="selectedInspectionLogAccount" class="inspection-log-content" data-component="inspection-log-detail">
              <div class="inspection-log-summary">
                <div class="cloud-account-cell">
                  <strong class="cloud-account-cell__name type-body-sm">{{ selectedInspectionLogAccount.name }}</strong>
                  <span class="cloud-account-cell__meta type-caption">{{ providerLabel(selectedInspectionLogAccount.provider) }}</span>
                </div>
                <StatusBadge status="error" :label="t.cloudAccount.inspectionFailed"></StatusBadge>
              </div>

              <div class="inspection-log-main">
                <section v-if="inspectionLogMode === 'output'" class="inspection-terminal" :aria-label="t.cloudAccount.logOutput">
                  <div class="inspection-terminal__bar type-caption">
                    <span>{{ t.cloudAccount.logOutput }}</span>
                    <span class="type-data">{{ selectedInspectionLogAccount.lastAttemptedAt }}</span>
                  </div>
                  <div class="inspection-terminal__stream" role="log" aria-live="polite">
                    <div v-for="(line, index) in inspectionLogLines" :key="index" class="inspection-terminal__line type-data">
                      <span class="inspection-terminal__time">{{ line.time }}</span>
                      <span class="inspection-terminal__level" :class="'is-' + line.tone">{{ line.level }}</span>
                      <span class="inspection-terminal__message">{{ line.message }}</span>
                    </div>
                  </div>
                </section>

                <section v-else class="inspection-log-diagnostic" :aria-label="t.cloudAccount.diagnosticResult">
                  <div class="inspection-log-diagnostic__head">
                    <i data-lucide="circle-alert" aria-hidden="true"></i>
                    <strong class="type-body-sm">{{ t.cloudAccount[selectedInspectionLogAccount.failureReasonKey || 'providerRequestTimeout'] }}</strong>
                  </div>
                  <dl class="inspection-log-diagnostic__row">
                    <dt class="type-caption">{{ t.cloudAccount.errorDetail }}</dt>
                    <dd class="type-body-sm">{{ t.cloudAccount.inspectionTimeoutDetail }}</dd>
                  </dl>
                  <dl class="inspection-log-diagnostic__row">
                    <dt class="type-caption">{{ t.cloudAccount.handlingSuggestion }}</dt>
                    <dd class="type-body-sm">{{ t.cloudAccount.inspectionTimeoutSuggestion }}</dd>
                  </dl>
                </section>
              </div>
            </div>
          </el-drawer>

        </main>
        <!-- AGIONE_EDIT_MAIN_END -->

      </div>

      <!-- 原型状态机 — 仅用于评审场景/状态，不属于客户业务 UI -->
      <div
        v-if="hasScenarios && !mobileNavOpen"
        ref="stateMachineControl"
        class="state-machine-control"
        :class="{ 'is-collapsed': stateMachineCollapsed, 'is-dragging': stateMachineDragging }"
        :style="stateMachinePositionStyle"
        data-prototype-control="state-machine"
        role="region"
        :aria-label="lang === 'zh' ? '原型业务状态' : 'Prototype business states'"
      >
        <div class="state-machine-switcher">
          <button
            class="state-machine-switcher__header"
            type="button"
            aria-controls="prototype-state-machine-options"
            :aria-expanded="String(!stateMachineCollapsed)"
            :aria-label="lang === 'zh'
              ? (stateMachineCollapsed ? '展开业务状态面板；拖动或使用方向键移动' : '收起业务状态面板；拖动或使用方向键移动')
              : (stateMachineCollapsed ? 'Expand business state panel; drag or use arrow keys to move' : 'Collapse business state panel; drag or use arrow keys to move')"
            :title="lang === 'zh' ? '拖动移动；点击收起或展开；方向键微调位置' : 'Drag to move; click to collapse or expand; use arrow keys to adjust position'"
            @click="toggleStateMachineCollapsed"
            @pointerdown="startStateMachineDrag"
            @pointermove="moveStateMachineDrag"
            @pointerup="endStateMachineDrag"
            @pointercancel="endStateMachineDrag"
            @lostpointercapture="endStateMachineDrag"
            @keydown="handleStateMachineHandleKeydown"
          >
            <span class="state-machine-switcher__label">
              <i data-lucide="grip-vertical"></i>
              <i data-lucide="workflow"></i>
              <span>{{ lang === 'zh' ? '业务状态' : 'Business state' }}</span>
            </span>
            <span v-if="stateMachineCollapsed" class="state-machine-switcher__current">
              {{ currentScenarioLabel }}
            </span>
            <span v-else class="state-machine-switcher__hint">
              {{ lang === 'zh' ? '拖动移动 · 点击收起' : 'Drag to move · click to collapse' }}
            </span>
            <i class="state-machine-switcher__toggle-icon" data-lucide="chevron-down"></i>
          </button>
          <div
            id="prototype-state-machine-options"
            v-show="!stateMachineCollapsed"
            class="state-machine-switcher__body"
            :aria-hidden="String(stateMachineCollapsed)"
          >
            <div
              v-for="group in scenarioGroups"
              :key="group.label"
              class="state-machine-group"
            >
              <div class="state-machine-group__label">{{ group.label }}</div>
              <div
                class="state-machine-options"
                role="group"
                :aria-label="group.label"
              >
                <button
                  v-for="scenario in group.items"
                  :key="scenario.key"
                  class="state-machine-option"
                  type="button"
                  :aria-pressed="String(activeScenario === scenario.key)"
                  @click="activeScenario = scenario.key"
                >
                  {{ scenario.label }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
});

for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, comp);
}
// §5.0 注册原型运行时组件库
for (const [name, comp] of Object.entries(PrototypeComponents)) {
  app.component(name, comp);
}
app.use(ElementPlus);
app.mount('#app');
lucide.createIcons();
</script>
</body>
</html>
