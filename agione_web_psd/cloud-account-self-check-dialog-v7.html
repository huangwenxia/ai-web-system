/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ── 控件图标比例 — 允许 Lucide，但不继承默认 24px ── */
.control-icon-button,
.control-icon-button > span { display: inline-flex; align-items: center; gap: 4px; }
.control-icon,
.input-affix-icon,
.icon-button__icon { display: inline-block; flex: 0 0 auto; stroke-width: 2; }
.control-icon { width: 14px; height: 14px; }
.control-icon--sm { width: 13px; height: 13px; }
.control-icon--lg,
.input-affix-icon,
.icon-button__icon { width: 16px; height: 16px; }
.icon-button { display: inline-grid; width: 32px; height: 32px; place-items: center; }
.icon-button--lg { width: 36px; height: 36px; }

/* ── 全局键盘焦点环（v6.9.5 · WCAG 2.4.7 Focus Visible）──
   每个可交互元素键盘聚焦都有可见环；鼠标点击不显示（浏览器 :focus-visible 已区分）。
   specificity 仅 (0,1,0)，EP 组件自身焦点态可正常覆盖。outline 现代浏览器跟随 border-radius。
   ⚠️ 业务区别把 outline 关成 none/0 又不给替代（杀掉键盘可达性，audit 会拦）。 */
:focus-visible { outline: 2px solid var(--ui-color-primary); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* ── 实心彩色按钮 dark 深字（方案 A · 字节对齐 project-mamba reset.scss）──
   dark 模式强调色调亮当填充、白字压不住 → 实心 primary/success/danger 文字翻 #000；
   plain/link/text 变体仍用强调色。靠 toggleTheme 给 <html> 加的 .dark class 生效，light 不变。 */
html.dark .el-button.el-button--primary { --el-button-text-color: #000; --el-button-hover-text-color: #000; }
html.dark .el-button.el-button--primary.is-text,
html.dark .el-button.el-button--primary.is-link,
html.dark .el-button.el-button--primary.is-plain { --el-button-text-color: var(--el-color-primary); }
html.dark .el-button.el-button--success { --el-button-text-color: #000; --el-button-hover-text-color: #000; }
html.dark .el-button.el-button--success.is-text,
html.dark .el-button.el-button--success.is-link,
html.dark .el-button.el-button--success.is-plain { --el-button-text-color: var(--el-color-success); }
html.dark .el-button.el-button--danger { --el-button-text-color: #000; --el-button-hover-text-color: #000; }
html.dark .el-button.el-button--danger.is-text,
html.dark .el-button.el-button--danger.is-link,
html.dark .el-button.el-button--danger.is-plain { --el-button-text-color: var(--el-color-danger); }

/* ── Typography Utility (v3.10 L1 强制) — 10 个 .type-* class，禁止手写 font-size/weight/line-height ── */
/* 对应 §2.2 字型层级表；颜色与字型解耦（由 var(--*) token 独立控制） */
/* v3.12 P3.3：新增 .type-display 系列，用于 dialog 大数字 / KPI 巨标 / 营销页 hero */
.type-display       { font-family: var(--ui-font-heading); font-size: 40px; font-weight: 800; line-height: 1.15; letter-spacing: -0.5px; }
.type-display-sm    { font-family: var(--ui-font-heading); font-size: 32px; font-weight: 800; line-height: 1.15; letter-spacing: -0.3px; }
.type-h1            { font-family: var(--ui-font-heading); font-size: 30px; font-weight: 800; line-height: 1.2; }
.type-h2            { font-family: var(--ui-font-heading); font-size: 20px; font-weight: 700; line-height: 1.4; }
.type-h3            { font-family: var(--ui-font-body);    font-size: 16px; font-weight: 600; line-height: 1.4; }
.type-body          { font-family: var(--ui-font-body);    font-size: 14px; font-weight: 400; line-height: 1.6; }
.type-body-sm       { font-family: var(--ui-font-body);    font-size: 13px; font-weight: 400; line-height: 1.43; }
.type-caption       { font-family: var(--ui-font-body);    font-size: 12px; font-weight: 500; line-height: 1.33; }
.type-data          { font-family: var(--ui-font-mono);    font-size: 13px; font-weight: 400; line-height: 1.5; font-variant-numeric: tabular-nums; }
.type-table-header  { font-family: var(--ui-font-body);    font-size: 11px; font-weight: 600; line-height: 1.4; letter-spacing: 0.5px; text-transform: uppercase; }
.type-kpi           { font-family: var(--ui-font-mono);    font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }  /* v5.1：KPI 大数字（让 .kpi-card__value 的孤儿字号入 type 体系，L3 业务卡焦点数字可复用） */
.type-hero-data     { font-family: var(--ui-font-mono);    font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }  /* v6.9.1：dashboard ov-card 巨数字（44px hero 数字档，跟 type-kpi 28px 互补） */

/* ── App Shell — §3.1 ── */
html, body {
  height: 100%;
  background: var(--ui-topnav-bg);
  font-family: var(--ui-font-body);
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.body {
  display: flex;
  flex: 1;
  overflow: hidden;
  border-radius: var(--ui-body-radius);
  background: var(--ui-bg-page);
}

.main {
  flex: 1;
  overflow: auto;
  background: var(--ui-bg-page);
}

/* ── TopBar — §3.2 ── */
.topnav {
  height: 56px;
  min-height: 56px;
  background: var(--ui-topnav-bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  gap: 16px;
  z-index: 100;
}
.topnav-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topnav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.nav-logo {
  height: 28px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-logo img { height: 28px; width: auto; display: block; }

.nav-divider { width: 1px; height: 18px; background: var(--ui-topnav-border); flex-shrink: 0; }

.nav-tabs { display: flex; align-items: center; gap: 4px; }

.nav-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--ui-topnav-muted);
  white-space: nowrap;
  transition: background var(--ui-transition-fast), color var(--ui-transition-fast);
}
.nav-tab.active { background: var(--ui-topnav-active-bg); color: var(--ui-topnav-active-fg); }
.nav-tab:not(.active):hover { background: var(--ui-topnav-surface); color: var(--ui-topnav-foreground); }

.nav-search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--ui-topnav-surface);
  cursor: pointer;
  transition: opacity var(--ui-transition-fast);
}
.nav-search:hover { opacity: 0.8; }
.nav-search [data-lucide] { width: 14px; height: 14px; color: var(--ui-topnav-muted); flex-shrink: 0; }
.nav-search-text { font-size: 13px; color: var(--ui-topnav-muted); }
.nav-search-kbd {
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 11px; color: var(--ui-topnav-muted);
}

.nav-icon-btn {
  width: 30px; height: 30px;
  border-radius: var(--ui-radius-control);
  display: flex; align-items: center; justify-content: center;
  color: var(--ui-topnav-muted);
  transition: background var(--ui-transition-fast), color var(--ui-transition-fast);
  flex-shrink: 0;
}
.nav-icon-btn:hover { background: var(--ui-topnav-hover); color: var(--ui-topnav-foreground); }
.nav-icon-btn [data-lucide] { width: 16px; height: 16px; }

.nav-avatar {
  width: 28px; height: 28px;
  border-radius: var(--ui-radius-pill);
  background: var(--ui-avatar-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: var(--ui-text-on-brand);
  cursor: pointer; flex-shrink: 0; user-select: none;
}

/* ── 原型状态机切换器 — 默认展开、可收起、可拖动，状态单击直达 ── */
.state-machine-control {
  position: fixed; right: 24px; bottom: 24px; z-index: var(--ui-z-fixed);
  width: min(380px, calc(100vw - 48px));
}
.state-machine-control.is-collapsed {
  width: min(260px, calc(100vw - 48px));
}
.state-machine-control.is-dragging {
  user-select: none;
}
.state-machine-switcher {
  display: grid; overflow: hidden;
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-card);
  background: var(--ui-bg-card);
  box-shadow: var(--ui-shadow-pop);
}
.state-machine-switcher__header {
  width: 100%; min-height: 44px; padding: 9px 10px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px;
  border: 0; border-bottom: 1px solid var(--ui-border-soft);
  background: transparent; color: var(--ui-text-primary); text-align: left;
  cursor: grab; touch-action: none; user-select: none;
  transition: background var(--ui-transition-fast);
}
.state-machine-control.is-collapsed .state-machine-switcher__header {
  border-bottom-color: transparent;
}
.state-machine-control.is-dragging .state-machine-switcher__header {
  cursor: grabbing;
}
.state-machine-switcher__header:hover {
  background: var(--ui-bg-muted);
}
.state-machine-switcher__label {
  display: flex; align-items: center; gap: 6px;
  color: var(--ui-text-secondary);
  font-size: 12px; font-weight: 600;
}
.state-machine-switcher__label [data-lucide],
.state-machine-switcher__toggle-icon {
  width: 14px; height: 14px; flex-shrink: 0;
}
.state-machine-switcher__toggle-icon {
  transition: transform var(--ui-transition-fast);
}
.state-machine-control.is-collapsed .state-machine-switcher__toggle-icon {
  transform: rotate(180deg);
}
.state-machine-switcher__label [data-lucide="workflow"] {
  color: var(--ui-color-primary);
}
.state-machine-switcher__label [data-lucide="grip-vertical"] {
  color: var(--ui-text-muted);
}
.state-machine-switcher__hint {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ui-text-muted); font-size: 11px; line-height: 1.4; text-align: right;
}
.state-machine-switcher__current {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ui-text-secondary); font-size: 12px; font-weight: 500; line-height: 1.4; text-align: right;
}
.state-machine-switcher__body {
  display: grid; gap: 12px;
  max-height: min(calc(60vh - 44px), 516px); overflow-y: auto; overscroll-behavior: contain;
  padding: 12px; scrollbar-gutter: stable;
}
.state-machine-group {
  display: grid; gap: 6px;
}
.state-machine-group__label {
  color: var(--ui-text-muted); font-size: 11px; font-weight: 600; line-height: 1.4;
}
.state-machine-options {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.state-machine-option {
  min-height: 32px; padding: 5px 10px;
  border: 1px solid var(--ui-border-interactive);
  border-radius: var(--ui-radius-control);
  background: var(--ui-bg-card);
  color: var(--ui-text-primary); font-size: 12px; font-weight: 500; line-height: 1.4;
  white-space: nowrap; cursor: pointer;
  transition: background var(--ui-transition-fast), border-color var(--ui-transition-fast), color var(--ui-transition-fast);
}
.state-machine-option:hover {
  background: var(--ui-bg-muted); border-color: var(--ui-color-primary);
}
.state-machine-option[aria-pressed="true"] {
  background: var(--ui-color-primary-hover); border-color: var(--ui-color-primary-hover);
  color: var(--ui-text-on-brand);
}

/* ── BalanceBox（TopNav 余额药丸，4 alert levels）—— 对齐 project-mamba BalanceBox.vue ── */
.balance-pill {
  --balance-pill-bg: var(--ui-topnav-surface, rgba(240, 237, 245, 0.06));
  --balance-pill-border: transparent;
  --balance-pill-icon: currentColor;
  --balance-pill-num: var(--ui-topnav-foreground);
  --balance-pill-cta-bg: var(--ui-topnav-surface, rgba(240, 237, 245, 0.08));
  --balance-pill-cta-hover-bg: var(--ui-topnav-hover, rgba(240, 237, 245, 0.16));
  --balance-pill-cta-color: var(--ui-topnav-foreground);
  display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
  height: 30px; padding: 0 4px 0 10px; min-width: 0;
  border: 1px solid var(--balance-pill-border);
  border-radius: var(--ui-radius-pill);
  background: var(--balance-pill-bg);
  color: var(--ui-topnav-muted);
  font-size: 12px; font-weight: 500; line-height: 1;
  white-space: nowrap; cursor: pointer;
  transition: background var(--ui-transition-fast), border-color var(--ui-transition-fast), color var(--ui-transition-fast), box-shadow var(--ui-transition-fast);
}
.balance-pill--readonly { padding-right: 10px; cursor: default; }
.balance-pill__dot {
  width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%;
  background: currentColor;
  animation: balance-pulse-dot 1.4s ease-in-out infinite;
}
@keyframes balance-pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.balance-pill [data-lucide].balance-pill__icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--balance-pill-icon); }
.balance-pill__num {
  max-width: 96px; overflow: hidden; text-overflow: ellipsis;
  color: var(--balance-pill-num);
  font-family: var(--ui-font-mono);
  font-variant-numeric: tabular-nums;
}
.balance-pill__unit { max-width: 64px; overflow: hidden; text-overflow: ellipsis; opacity: 0.64; }
.balance-pill__cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 22px; padding: 0 10px;
  border: 0; border-radius: var(--ui-radius-pill);
  background: var(--balance-pill-cta-bg);
  color: var(--balance-pill-cta-color);
  font-size: 11px; font-weight: 600; line-height: 1;
  white-space: nowrap; cursor: pointer;
  transition: background var(--ui-transition-fast), color var(--ui-transition-fast);
}
.balance-pill__cta:hover { background: var(--balance-pill-cta-hover-bg); }
.balance-pill__cta:focus-visible { outline: 2px solid var(--ui-topnav-foreground); outline-offset: 2px; }
.balance-pill__cta [data-lucide] { width: 11px; height: 11px; }
/* 4 alert levels: normal / low / critical / empty */
.balance-pill--low {
  --balance-pill-bg: color-mix(in srgb, var(--ui-color-action) 16%, transparent);
  --balance-pill-border: color-mix(in srgb, var(--ui-color-action) 42%, transparent);
  --balance-pill-icon: var(--ui-color-action);
  --balance-pill-num: color-mix(in srgb, var(--ui-color-action) 52%, var(--ui-topnav-foreground));
  --balance-pill-cta-bg: color-mix(in srgb, var(--ui-color-action) 86%, var(--ui-topnav-bg));
  --balance-pill-cta-hover-bg: var(--ui-color-action);
  --balance-pill-cta-color: var(--ui-topnav-bg);
  color: color-mix(in srgb, var(--ui-color-action) 78%, var(--ui-topnav-foreground));
}
.balance-pill--critical {
  --balance-pill-bg: color-mix(in srgb, var(--ui-color-destructive) 16%, transparent);
  --balance-pill-border: color-mix(in srgb, var(--ui-color-destructive) 45%, transparent);
  --balance-pill-icon: var(--ui-color-destructive);
  --balance-pill-num: color-mix(in srgb, var(--ui-color-destructive) 46%, var(--ui-topnav-foreground));
  --balance-pill-cta-bg: var(--ui-color-destructive);
  --balance-pill-cta-hover-bg: color-mix(in srgb, var(--ui-color-destructive) 88%, var(--ui-topnav-bg));
  --balance-pill-cta-color: var(--ui-text-on-brand);
  color: color-mix(in srgb, var(--ui-color-destructive) 72%, var(--ui-topnav-foreground));
}
.balance-pill--empty {
  --balance-pill-bg: var(--ui-color-destructive);
  --balance-pill-border: var(--ui-color-destructive);
  --balance-pill-icon: var(--ui-text-on-brand);
  --balance-pill-num: var(--ui-text-on-brand);
  --balance-pill-cta-bg: var(--ui-topnav-foreground);
  --balance-pill-cta-hover-bg: color-mix(in srgb, var(--ui-topnav-foreground) 86%, var(--ui-color-destructive));
  --balance-pill-cta-color: var(--ui-color-destructive);
  color: color-mix(in srgb, var(--ui-text-on-brand) 84%, var(--ui-color-destructive));
  animation: balance-empty-throb 2s ease-in-out infinite;
}
@keyframes balance-empty-throb {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ui-color-destructive) 60%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--ui-color-destructive) 0%, transparent); }
}

.balance-pill--loading { cursor: wait; }
.balance-pill__icon--skeleton {
  width: 14px; height: 14px; border-radius: 50%; background: currentColor;
  opacity: 0.2; animation: balance-skeleton-pulse 1.4s ease-in-out infinite;
}
@keyframes balance-skeleton-pulse { 0%, 100% { opacity: .2; } 50% { opacity: .4; } }

/* ── Sidebar — §3.3 ── */
.sidebar {
  width: 256px;
  min-width: 256px;
  background: var(--ui-sidebar-bg);
  border-right: 1px solid var(--ui-sidebar-border);
  padding: 12px 12px 16px;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; overflow-x: hidden;
}
/* ── Scrollbar（全局） ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--ui-border-default);
  border-radius: var(--ui-radius-pill);
}
::-webkit-scrollbar-thumb:hover { background: var(--ui-text-muted); }
::-webkit-scrollbar-corner { background: transparent; }

.sidebar-section { margin-bottom: 4px; }

.sidebar-section-title {
  padding: 8px 8px 4px;
  font-size: 12px; font-weight: 500;
  color: var(--ui-text-muted);
  letter-spacing: 0.01em;
}
.sidebar-section + .sidebar-section .sidebar-section-title { padding-top: 12px; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px;
  border-radius: var(--ui-radius-control);
  font-size: 14px; font-weight: 400;
  color: var(--ui-sidebar-foreground);
  transition: background 0.12s, color 0.12s;
  white-space: nowrap;
  width: 100%;
}
.nav-item [data-lucide] { width: 18px; height: 18px; flex-shrink: 0; color: var(--ui-text-muted); }
.nav-item.active { background: var(--ui-sidebar-active-bg); font-weight: 500; color: var(--ui-sidebar-active-fg); }
.nav-item.active [data-lucide] { color: var(--ui-sidebar-active-fg); }
.nav-item:not(.active):hover { background: var(--ui-sidebar-hover-bg); }

.mobile-menu-toggle,
.sidebar-mobile-head,
.layout-overlay { display: none; }

@media (max-width: 1023px) {
  html, body { background: var(--ui-bg-page); }
  .body { border-radius: 0; }
  .topnav { gap: 8px; }
  .mobile-menu-toggle {
    width: 40px; height: 40px; display: inline-flex; flex-shrink: 0;
    align-items: center; justify-content: center;
    border: 1px solid var(--ui-topnav-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-topnav-surface);
    color: var(--ui-topnav-foreground);
    transition: background var(--ui-transition-fast), color var(--ui-transition-fast);
  }
  .mobile-menu-toggle:hover { background: var(--ui-topnav-hover); }
  .nav-divider, .nav-tabs, .nav-search, .nav-docs { display: none; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 240;
    width: min(86vw, 320px); min-width: 0; max-width: calc(100vw - 32px);
    height: 100vh; height: 100dvh;
    padding: 0 12px 16px;
    box-shadow: var(--ui-shadow-pop);
    transform: translateX(-100%);
    transition: transform var(--ui-transition-base);
  }
  .sidebar.is-mobile-open { transform: translateX(0); }
  .sidebar-mobile-head {
    min-height: 56px; display: flex; align-items: center; justify-content: space-between;
    margin: 0 -12px 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--ui-sidebar-border);
  }
  .sidebar-mobile-logo { height: 24px; width: auto; display: block; }
  .sidebar-mobile-close {
    width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--ui-sidebar-border); border-radius: var(--ui-radius-control);
    background: var(--ui-sidebar-accent); color: var(--ui-text-muted);
  }
  .layout-overlay {
    position: fixed; inset: 0; z-index: 230; display: block;
    background: var(--ui-bg-overlay); backdrop-filter: blur(2px); touch-action: none;
  }
  .main { overflow-x: hidden; -webkit-overflow-scrolling: touch; }
}

@media (max-width: 640px) {
  .topnav-right { gap: 6px; }
  .balance-pill { gap: 6px; }
  .balance-pill__unit { display: none; }
  .balance-pill__cta { width: 22px; padding: 0; }
  .balance-pill__cta span { display: none; }
  .state-machine-control { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: calc(100vw - 32px); }
  .state-machine-control.is-collapsed { width: min(260px, calc(100vw - 32px)); }
}

/* ── Stage（shell-only 空舞台） ── */
.stage-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.stage-card {
  max-width: 480px; width: 100%;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.stage-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 12px;
  border-radius: var(--ui-radius-pill);
  background: var(--ui-color-primary-subtle);
  color: var(--ui-color-primary);
  font-size: 12px; font-weight: 600;
}
.stage-title {
  font-family: var(--ui-font-heading);
  font-size: 26px; font-weight: 800;
  color: var(--ui-text-primary); line-height: 1.2;
}
.stage-desc {
  font-size: 14px; line-height: 1.7;
  color: var(--ui-text-muted);
}
.stage-badges {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 4px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 3px 10px;
  border-radius: var(--ui-radius-pill);
  font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
}
.badge-green  { background: var(--ui-badge-green-bg);  color: var(--ui-badge-green-fg); }
.badge-blue   { background: var(--ui-badge-blue-bg);   color: var(--ui-badge-blue-fg); }
.badge-purple { background: var(--ui-badge-purple-bg); color: var(--ui-badge-purple-fg); }
.badge-action { background: var(--ui-badge-action-bg); color: var(--ui-badge-action-fg); }
.badge-muted  { background: var(--ui-badge-muted-bg);  color: var(--ui-badge-muted-fg); }
.badge-red    { background: var(--ui-color-destructive-subtle); color: var(--ui-color-destructive); }

/* ──────────────────────────────────────────────
 * §5.0 Prototype Component Library —— 运行时组件库
 * 配套组件：HeaderBox / KpiCard / StatusBadge / EmptyState / Alert
 * ────────────────────────────────────────────── */

/* MainBox 容器（纯布局类，不抽组件） */
.main-box {
  display: flex; flex-direction: column; height: 100%;
}
/* el-scrollbar 必须 flex: 1 + min-height: 0，否则与 .main 双滚动条 */
.main-box > .el-scrollbar { flex: 1; min-height: 0; }
/* 滚动区内层标准 padding */
.scroll-box-inner {
  padding: 0 28px var(--ui-space-xl);
  display: flex; flex-direction: column; gap: var(--ui-space-base);
}

/* ── Layout utilities（DS foundations 通用工具类，ship 到 shell 内供 partial 使用） ── */
.flex-col { display: flex; flex-direction: column; gap: var(--ui-space-sm); }
.flex-row { display: flex; align-items: center; gap: var(--ui-space-sm); flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ui-space-base); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--ui-space-base); }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--ui-space-base); }

/* ── HeaderBox ── */
/* v5.2 去卡片视觉对齐生产 Profile 页：无 bg / border / radius；title 直接坐在 page bg 上 */
.header-box {
  margin: var(--ui-space-lg) 28px var(--ui-space-sm);     /* 上 20 / 左右 28（跟 scroll-box-inner 对齐）/ 下 8 */
}
.header-box__top {
  padding: 0;                                               /* v5.2 取消内 padding；无 card 边框就不需要 buffer */
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: var(--ui-space-base);
}
.header-box__title {
  /* v6.1 说明：本 class 视觉跟 .type-h2 (20/700) 极近，但**有意保留独立**：
     - line-height: 1.2（vs .type-h2 的 1.4）—— 页面标题通常单行，紧凑更"贴 chrome"
     - 显式 color —— 防御 parent inherit 变更
     未来如有"列表卡 section 标题"等需要 line-height 1.4 的场景仍走 .type-h2；
     页面级 chrome 标题继续用本 class。不要因"看起来同值"就合并。*/
  font-family: var(--ui-font-heading);
  font-size: 20px; font-weight: 700; line-height: 1.2;     /* v5.0 对齐生产 TopBar 真值：20px / 700（原 24/800）*/
  color: var(--ui-text-primary);
}
/* v6.9.3: .header-box__subtitle 已移除——所有页面一律不传副标题（references/base-spec.md §7）*/
.header-box__right { display: flex; align-items: center; gap: var(--ui-space-sm); flex-shrink: 0; }
.header-box__content {
  padding: var(--ui-space-base) 0 0;                       /* v5.2：去 card 后，content 区块只需顶部留白 */
  border-top: 1px solid var(--ui-border-soft);
}

/* ── KpiCard ── */
.kpi-card {
  background: var(--ui-bg-card);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-xl);
  padding: var(--ui-space-lg);
  display: flex; flex-direction: column; gap: var(--ui-space-sm);
  min-width: 0;
}
.kpi-card__header { display: flex; justify-content: space-between; align-items: center; }
.kpi-card__title {
  font-size: 12px; font-weight: 500;
  color: var(--ui-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.kpi-card__icon { width: var(--ui-icon-lg); height: var(--ui-icon-lg); }
.kpi-card__icon--primary     { color: var(--ui-color-primary); }
.kpi-card__icon--success     { color: var(--ui-color-success); }
.kpi-card__icon--action      { color: var(--ui-color-action); }
.kpi-card__icon--destructive { color: var(--ui-color-destructive); }
.kpi-card__value {
  /* v5.1: 值跟 .type-kpi 一致（28/700/mono/tabular-nums）；保留独立类用于布局 hook（margin / color）*/
  font-family: var(--ui-font-mono);
  font-size: 28px; font-weight: 700; line-height: 1.2;
  color: var(--ui-text-primary);
  font-variant-numeric: tabular-nums;
}
.kpi-card__trend {
  font-size: 12px;
  display: flex; align-items: center; gap: 4px;
}
.kpi-card__trend--up      { color: var(--ui-color-success); }
.kpi-card__trend--down    { color: var(--ui-color-destructive); }
.kpi-card__trend--neutral { color: var(--ui-text-muted); }
.kpi-card__trend [data-lucide] { width: 14px; height: 14px; }

/* ── StatusBadge ── */
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 3px 10px;
  border-radius: var(--ui-radius-pill);
  font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
}
.status-badge__dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}

/* ── EmptyState ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--ui-space-3xl) var(--ui-space-xl);
  gap: var(--ui-space-md);
  text-align: center;
}
.empty-state__icon {
  width: var(--ui-icon-2xl); height: var(--ui-icon-2xl);
  color: var(--ui-text-muted);
}
.empty-state__title { font-size: 16px; font-weight: 600; color: var(--ui-text-primary); }
.empty-state__hint  { font-size: 13px; color: var(--ui-text-muted); max-width: 320px; line-height: 1.6; }

/* ── Alert (Inline) §5.14 ── */
.alert {
  display: flex; align-items: flex-start; gap: var(--ui-space-sm);
  padding: var(--ui-space-md) var(--ui-space-base);
  border-radius: var(--ui-radius-lg);
  border: 1px solid var(--ui-border-default);
  font-size: 14px;
}
.alert-icon { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.alert-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.alert-title { margin: 0; font-weight: 500; line-height: 1.5; }
.alert-desc  { font-size: 13px; color: var(--ui-text-muted); margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
.alert-close { margin-left: auto; color: var(--ui-text-muted); padding: 2px; line-height: 0; }
.alert-close:hover { color: var(--ui-text-primary); }
.alert-close [data-lucide] { width: 14px; height: 14px; }
.alert-success  { background: var(--ui-color-success-subtle);     border-color: color-mix(in srgb, var(--ui-color-success) 28%, var(--ui-border-default));     color: var(--ui-color-success); }
.alert-action  { background: var(--ui-color-action-subtle);     border-color: color-mix(in srgb, var(--ui-color-action) 28%, var(--ui-border-default));     color: var(--ui-color-action); }
.alert-error    { background: var(--ui-color-destructive-subtle); border-color: color-mix(in srgb, var(--ui-color-destructive) 28%, var(--ui-border-default)); color: var(--ui-color-destructive); }
.alert-info     { background: var(--ui-color-primary-subtle);     border-color: color-mix(in srgb, var(--ui-color-primary) 28%, var(--ui-border-default));     color: var(--ui-color-primary); }

/* ── UsageBar (v3.5) ── */
.usage-bar { display: inline-flex; align-items: center; gap: var(--ui-space-sm); min-width: 120px; }
.usage-bar__track {
  flex: 1; height: 6px;
  background: var(--ui-bg-muted);
  border-radius: var(--ui-radius-pill);
  overflow: hidden;
  min-width: 60px;
}
.usage-bar__fill {
  height: 100%;
  border-radius: var(--ui-radius-pill);
  transition: width var(--ui-duration-base);
}
.usage-bar__fill--primary { background: var(--ui-color-primary); }
.usage-bar__fill--success { background: var(--ui-color-success); }
.usage-bar__fill--attention { background: var(--ui-color-action); }
.usage-bar__fill--danger  { background: var(--ui-color-destructive); }
.usage-bar__text {
  font-family: var(--ui-font-mono);
  font-size: 11px;
  color: var(--ui-text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ── KvCard (v3.5) ── */
.kv-card {
  background: var(--ui-bg-card);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-lg);
  transition: border-color var(--ui-duration-fast);
}
.kv-card--hover:hover { border-color: var(--ui-color-primary); }
.kv-card__head {
  padding: var(--ui-space-md) var(--ui-space-base);
  border-bottom: 1px solid var(--ui-border-soft);
  display: flex; justify-content: space-between; align-items: center;
  gap: var(--ui-space-sm);
}
.kv-card__title { font-size: 14px; font-weight: 600; color: var(--ui-text-primary); }
.kv-card__head-right { display: flex; align-items: center; gap: var(--ui-space-sm); }
.kv-card__body {
  padding: var(--ui-space-md) var(--ui-space-base);
  display: flex; flex-direction: column; gap: var(--ui-space-xs);
}
.kv-card__row {
  display: flex; align-items: flex-start; gap: var(--ui-space-sm);
  font-size: 13px; line-height: 1.6;
}
.kv-card__label { color: var(--ui-text-muted); flex-shrink: 0; }
.kv-card__value { flex: 1; min-width: 0; color: var(--ui-text-primary); word-break: break-word; }

/* ── DetailSection (v3.5) ── */
.detail-section { display: flex; flex-direction: column; gap: var(--ui-space-md); }
.detail-section__head {
  /* v6.9.3: 去掉左色条（border-left accent）——标题强调走字重/字号，不靠色条 */
  display: flex; justify-content: space-between; align-items: center;
  min-height: 20px;
}
.detail-section__title {
  font-size: 16px; font-weight: 600; color: var(--ui-text-primary);
  line-height: 1.25;
}
.detail-section__right { display: flex; align-items: center; gap: var(--ui-space-sm); }
.detail-section__body { padding-left: 16px; }

/* ── TableActions (v3.5) ── */
.table-actions { display: inline-flex; align-items: center; gap: 2px; }
.table-actions .el-button + .el-button { margin-left: 0; }
.el-dropdown-menu__item.is-danger { color: var(--ui-color-destructive); }
.el-dropdown-menu__item.is-danger:hover {
  background: var(--ui-color-destructive-subtle);
  color: var(--ui-color-destructive);
}

/* ── DetailPage 配套（btn-back + detail-tabs）(v3.5) ── */
.btn-back {
  width: 32px; height: 32px;
  border-radius: var(--ui-radius-md);
  display: flex; align-items: center; justify-content: center;
  color: var(--ui-text-muted);
  transition: background var(--ui-duration-fast), color var(--ui-duration-fast);
  flex-shrink: 0;
}
.btn-back:hover { background: var(--ui-accent); color: var(--ui-text-primary); }
.btn-back [data-lucide] { width: 18px; height: 18px; }

.detail-tabs {
  display: flex; gap: var(--ui-space-base);
  border-bottom: 1px solid var(--ui-border-default);
}
.detail-tabs__item {
  padding: 8px 0;
  font-size: 14px; font-weight: 500;
  color: var(--ui-text-muted);
  border-bottom: 2px solid transparent;
  transition: color var(--ui-duration-fast), border-color var(--ui-duration-fast);
  margin-bottom: -1px;
  background: none; cursor: pointer;
}
.detail-tabs__item:hover { color: var(--ui-text-primary); }
.detail-tabs__item.is-active {
  color: var(--ui-color-primary);
  border-bottom-color: var(--ui-color-primary);
  font-weight: 600;
}

/* ── PageHeader B-Pro (v6.4 Designer 标准 · v6.6 去底线) ──
   v3.8 引入 → v5.0/v5.2 改 20px 对齐 cbdp Profile → v6.4 改回 22px 6 原则
   → v6.6 移除 border-bottom（彻底无界更克制）
   6 原则更新版：
     ① type scale 1.25 第 3 档位（14→18→22→28→36，对齐 Vercel/Stripe/Linear）
     ② 完全无 container 装饰（v6.4 用 hairline 底线 → v6.6 去掉底线靠空间分隔）
        理由：(a) Linear / Vercel 最新版本 page header 已经没底线了
              (b) PageHeader + lux-tabs-page 组合时 tabs wrapper 自带 border-bottom，
                  PageHeader 再有底线 = 双线视觉重复
              (c) 单独 PageHeader 时无线让 page content 直接呼吸
     ③ actions flex-end baseline 对齐（不是 flex-start）
     ④ font-weight 700（不是 800，800 是 marketing/hero 字重）
     ⑤ eyebrow muted 色（不抢 CTA 戏）
     ⑥ v6.9.3: 移除 subtitle（所有页面不传副标题）+ back 固定渲染在标题左侧 inline
   实战验证：REQ-20260515 EU + Provider 32 个 section 标题统一改造，JS parse OK */
.page-header {
  padding: 24px 28px 16px;
  /* v6.6: 移除 border-bottom (彻底无界更克制) */
  display: flex;
  justify-content: space-between;
  align-items: flex-end;            /* ⭐ ③ baseline 对齐 actions，不是 flex-start */
  gap: 20px;
}
.page-header__left { min-width: 0; flex: 1; }
.page-header__eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600;
  color: var(--ui-text-muted);       /* ⭐ ⑤ muted 不 primary */
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.page-header__eyebrow [data-lucide] { width: 12px; height: 12px; }
.page-header__eyebrow-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--ui-text-muted);
}
.page-header__title-row {
  display: inline-flex; align-items: center; gap: 12px;
}
.page-header__title {
  font-family: var(--ui-font-heading);
  font-size: 22px;                   /* ⭐ ① 22 — type scale 第 3 档位 */
  font-weight: 700;                  /* ⭐ ④ 700 而非 800 */
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ui-text-primary);
  margin: 0;
}
/* v6.9.3: .page-header__subtitle 已移除——所有页面一律不传副标题（references/base-spec.md §7）*/
.page-header__right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.page-header__status-pill {
  display: inline-flex; align-items: center;
  padding: 3px 10px;
  border-radius: var(--ui-radius-pill);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.2px;
}
.page-header__status-pill--green  { background: var(--ui-color-success-subtle);     color: var(--ui-color-success); }
.page-header__status-pill--action { background: var(--ui-color-action-subtle);     color: var(--ui-color-action); }
.page-header__status-pill--red    { background: var(--ui-color-destructive-subtle); color: var(--ui-color-destructive); }
.page-header__status-pill--purple { background: var(--ui-badge-purple-bg);          color: var(--ui-badge-purple-fg); }
.page-header__status-pill--muted  { background: var(--ui-badge-muted-bg);           color: var(--ui-badge-muted-fg); }
/* v6.9.3: back 固定渲染在标题左侧 inline（title-row 内首元素），不再单独占顶行。
   返回入口位置统一 = 标题左缘，禁止散放到面包屑/右侧/独立行。 */
.page-header__back {
  font-size: 13px;
  color: var(--ui-text-muted);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 4px;
  flex-shrink: 0;
  padding-right: 10px;
  margin-right: 2px;
  border-right: 1px solid var(--ui-border-soft);   /* 跟标题之间一条竖向细分隔，读作"返回 | 标题" */
  align-self: center;
  transition: color var(--ui-duration-fast);
}
.page-header__back:hover { color: var(--ui-text-primary); }
.page-header__back [data-lucide] { width: 16px; height: 16px; }

/* ── MetricsStrip (v3.8) — 等分指标条（Hero 详情/Overview 用）── */
.metrics-strip {
  display: grid;
  background: var(--ui-bg-card);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-lg);
  overflow: hidden;
}
.metrics-strip__cell {
  padding: var(--ui-space-base) var(--ui-space-lg);
  display: flex; flex-direction: column; gap: var(--ui-space-xs);
  min-width: 0;
}
.metrics-strip--divided .metrics-strip__cell + .metrics-strip__cell {
  border-left: 1px solid var(--ui-border-soft);
}
.metrics-strip__label {
  font-size: 11px; font-weight: 500;
  color: var(--ui-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.metrics-strip__value {
  font-family: var(--ui-font-mono);
  font-size: 22px; font-weight: 700;
  color: var(--ui-text-primary);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  word-break: break-word;
}
.metrics-strip__value--accent { color: var(--ui-color-primary); }
.metrics-strip__sub { font-size: 12px; color: var(--ui-text-muted); }

/* ── HeroBand (v3.8) — Overview 营销引导带 ── */
.hero-band {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--ui-space-2xl);
  padding: var(--ui-space-2xl);
  border-radius: var(--ui-radius-xl);
  border: 1px solid var(--ui-border-default);
}
.hero-band--primary { background: var(--ui-color-primary-subtle); }
.hero-band--neutral { background: var(--ui-bg-card); }
.hero-band--gradient {
  background: linear-gradient(135deg, var(--ui-color-primary-subtle) 0%, var(--ui-bg-card) 100%);
}
@media (min-width: 1024px) {
  .hero-band--with-right { grid-template-columns: 1fr 1fr; align-items: center; }
}
.hero-band__left { min-width: 0; }
.hero-band__eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--ui-bg-card);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-pill);
  font-size: 11px; font-weight: 600;
  color: var(--ui-color-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.hero-band__eyebrow [data-lucide] { width: 12px; height: 12px; }
.hero-band__title {
  font-family: var(--ui-font-heading);
  font-size: 28px; font-weight: 800; line-height: 1.2;
  color: var(--ui-text-primary);
  margin-top: 12px;
}
.hero-band__desc {
  font-size: 14px; color: var(--ui-text-muted); line-height: 1.6;
  margin-top: 8px;
}
.hero-band__points {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 16px;
}
.hero-band__point {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 13px; line-height: 1.5;
}
.hero-band__point [data-lucide] {
  width: 16px; height: 16px;
  color: var(--ui-color-primary); flex-shrink: 0;
  margin-top: 2px;
}
.hero-band__point strong { font-weight: 600; color: var(--ui-text-primary); }
.hero-band__point span { color: var(--ui-text-muted); margin-left: 6px; }
.hero-band__right { min-width: 0; }

/* ── StepPills (v3.8) — 微型流程指示器（4 状态药丸）── */
.step-pills {
  display: inline-flex; align-items: center; flex-wrap: wrap;
  gap: 6px;
}
.step-pill {
  display: inline-flex; align-items: center;
  padding: 4px 10px;
  border-radius: var(--ui-radius-pill);
  font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
  white-space: nowrap;
}
.step-pill--done       { background: var(--ui-color-primary-subtle); color: var(--ui-color-primary); }
.step-pill--doneGreen  { background: var(--ui-badge-green-bg); color: var(--ui-badge-green-fg); }
.step-pill--current    { background: var(--ui-color-primary); color: var(--ui-text-on-brand); font-weight: 600; }
.step-pill--todo       { background: var(--ui-bg-muted); color: var(--ui-text-muted); }
.step-pill__sep {
  color: var(--ui-text-muted);
  font-size: 12px;
  user-select: none;
}

/* ── ProgressBar (v3.8) — 三态进度条原子 ── */
.progress-bar {
  width: 100%;
  background: var(--ui-bg-muted);
  border-radius: var(--ui-radius-pill);
  overflow: hidden;
}
.progress-bar__fill {
  height: 100%;
  border-radius: var(--ui-radius-pill);
  transition: width var(--ui-duration-base);
}
.progress-bar__fill--normal  { background: var(--ui-color-primary); }
.progress-bar__fill--attention { background: var(--ui-color-action); }
.progress-bar__fill--danger  { background: var(--ui-color-destructive); }

/* ── DataTable (v3.7) — 表格容器（包 el-table + el-pagination）── */
.data-table {
  background: var(--ui-bg-card);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-lg);
  overflow: hidden;
}
.data-table .el-table {
  border-radius: 0;
}
.data-table__pagination {
  padding: var(--ui-space-md) var(--ui-space-base);
  border-top: 1px solid var(--ui-border-soft);
  display: flex; justify-content: flex-end; align-items: center;
}

/* ── Tag (v3.6) — 通用标签 ── */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 3px 10px;
  border-radius: var(--ui-radius-pill);
  font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
}
.tag [data-lucide] { width: 11px; height: 11px; }

/* ── CardBox (v3.6) — 通用卡片容器 ── */
.card-box {
  background: var(--ui-bg-card);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-lg);
}
.card-box__head {
  padding: var(--ui-space-md) var(--ui-space-base);
  border-bottom: 1px solid var(--ui-border-soft);
  display: flex; justify-content: space-between; align-items: center;
  gap: var(--ui-space-sm);
}
.card-box__title { font-size: 14px; font-weight: 600; color: var(--ui-text-primary); }
.card-box__head-right { display: flex; align-items: center; gap: var(--ui-space-sm); }
.card-box__body { padding: var(--ui-space-base); }
.card-box--padded > .card-box__body { padding: var(--ui-space-lg); }

/* ── Tabs (v3.6) — 独立 Tabs (underline + segmented) ── */
.tabs-segmented {
  display: inline-flex;
  background: var(--ui-accent);
  border-radius: var(--ui-radius-lg);
  padding: 3px;
}
.tabs-segmented__item {
  padding: 6px 14px;
  font-size: 13px; font-weight: 500;
  color: var(--ui-text-muted);
  border-radius: var(--ui-radius-md);
  background: transparent;
  cursor: pointer;
  transition: background var(--ui-duration-fast), color var(--ui-duration-fast);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.tabs-segmented__item:hover { color: var(--ui-text-primary); }
.tabs-segmented__item.is-active {
  background: var(--ui-bg-card);
  color: var(--ui-text-primary);
  box-shadow: var(--ui-shadow-sm);
}
.tabs-segmented__count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 16px; padding: 0 5px;
  border-radius: var(--ui-radius-pill);
  background: var(--ui-bg-muted);
  font-size: 10px; font-weight: 600;
  color: var(--ui-text-muted);
}
.tabs-segmented__item.is-active .tabs-segmented__count {
  background: var(--ui-color-primary-subtle);
  color: var(--ui-color-primary);
}

/* ── lux-tabs-page (v6.5 / B-Pro v4.1) — 页面级 Tab 导航 Stripe/Linear/Vercel 风格 ──
   适用：详情页 4+ 一级分区切换（位于 PageHeader 下方一行）
   不适用：2~3 项小工具切换 → 用 .tabs-segmented (灰底白胶囊 segmented control)
   配套：紧贴 PageHeader B-Pro 之下，外层容器 padding 8/28/0 + border-bottom hairline
        让 active 下划线"穿透"基线（margin-bottom: -1px + ::after bottom: -1px）
   命名说明：沿用 user REQ-20260515 原型项目的 .lux-* 命名前缀，跟 PageHeader B-Pro
            一脉相承的 designer 标准体系；视觉等价于 chrome 自带的 .tabs-segmented
            但形态完全不同（下划线 vs 胶囊） */
.lux-tabs-page {
  display: flex;
  align-items: stretch;
  gap: 2px;
  position: relative;
}
.lux-tabs-page button {
  position: relative;
  border: none;
  background: transparent;
  padding: 10px 12px 13px;
  margin-bottom: -1px;             /* 跟父容器 border-bottom 重叠 */
  font-size: 14px;
  font-weight: 500;
  color: var(--ui-text-muted);
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  letter-spacing: -0.005em;
  border-radius: 6px 6px 0 0;
  transition: color var(--ui-duration-fast), background var(--ui-duration-fast);
  z-index: 1;
  white-space: nowrap;
}
.lux-tabs-page button i[data-lucide],
.lux-tabs-page button svg {
  width: 15px !important;
  height: 15px !important;
  opacity: 0.7;
  transition: opacity var(--ui-duration-fast);
  flex-shrink: 0;
}
.lux-tabs-page button:hover:not(.is-active) {
  color: var(--ui-text-primary);
  background: var(--ui-accent);
}
.lux-tabs-page button:hover i[data-lucide],
.lux-tabs-page button:hover svg {
  opacity: 1;
}
.lux-tabs-page button.is-active {
  color: var(--ui-color-primary);
  font-weight: 600;
}
.lux-tabs-page button.is-active i[data-lucide],
.lux-tabs-page button.is-active svg {
  opacity: 1;
  color: var(--ui-color-primary);
}
.lux-tabs-page button.is-active::after {
  content: '';
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: -1px;
  height: 2px;
  background: var(--ui-color-primary);
  border-radius: 2px 2px 0 0;
  box-shadow: 0 0 0 0.5px var(--ui-color-primary);    /* 微光晕，retina 更锐利 */
}
.lux-tabs-page button:focus-visible {
  outline: 2px solid var(--ui-color-primary);
  outline-offset: -3px;
  border-radius: 4px;
}

/* ── Avatar (v3.6) — 用户头像（letter fallback）── */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--ui-radius-pill);
  font-weight: 600;
  user-select: none;
  flex-shrink: 0;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-small   { width: 24px; height: 24px; font-size: 10px; }
.avatar-default { width: 32px; height: 32px; font-size: 12px; }
.avatar-large   { width: 40px; height: 40px; font-size: 14px; }
.avatar-xl      { width: 56px; height: 56px; font-size: 18px; }

/* ── FilterBox (v3.9) — 筛选条容器（含 selection 变体替代旧 Toolbar）── */
.filter-box { display: flex; flex-wrap: wrap; gap: var(--ui-space-sm); align-items: flex-end; padding: var(--ui-space-md) 0; }
.filter-box .filter-actions { display: flex; gap: var(--ui-space-sm); margin-left: auto; }
.filter-box-spacer { flex: 1; min-width: 0; }
.filter-box--compact { padding: var(--ui-space-sm) 0; gap: var(--ui-space-xs); }
.filter-box--selection {
  padding: var(--ui-space-sm) var(--ui-space-base);
  background: var(--ui-color-primary-subtle);
  border: 1px solid var(--ui-color-primary);
  border-radius: var(--ui-radius-md);
  align-items: center;
}

/* ── Breadcrumb (v3.10 L1) ── */
.breadcrumb {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ui-text-muted);
}
.breadcrumb a {
  color: var(--ui-text-muted);
  transition: color var(--ui-duration-fast);
  cursor: pointer;
}
.breadcrumb a:hover { color: var(--ui-color-primary); }
.breadcrumb [data-lucide] { width: 13px; height: 13px; }
.breadcrumb-current { color: var(--ui-text-primary); font-weight: 500; }

/* ── DetailSection compact (v3.9) — 表单分组小标题（替代旧 SectionTitle）── */
.detail-section--compact { gap: var(--ui-space-sm); }
.detail-section--compact .detail-section__head {
  padding-left: 0;
  border-left: none;
  padding-bottom: var(--ui-space-sm);
  border-bottom: 1px solid var(--ui-border-soft);
}
.detail-section--compact .detail-section__title { font-size: 14px; font-weight: 600; }

/* ── ListCardItem (v3.9) — 列表行卡片（非表格场景）── */
.list-card-item { display: flex; align-items: center; gap: var(--ui-space-base); padding: var(--ui-space-md) var(--ui-space-base); border-radius: var(--ui-radius-lg); border: 1px solid transparent; transition: background var(--ui-duration-fast), border-color var(--ui-duration-fast); cursor: pointer; }
.list-card-item:hover { background: var(--ui-accent); }
.list-card-item--surface { background: var(--ui-bg-card); border-color: var(--ui-border-default); }
.list-card-item--surface:hover { border-color: var(--ui-color-primary); background: var(--ui-bg-card); box-shadow: var(--ui-shadow-sm); }
.list-card-item__lead { display: flex; align-items: center; gap: var(--ui-space-sm); flex-shrink: 0; }
.list-card-item__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.list-card-item__title { font-size: 14px; font-weight: 500; color: var(--ui-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: var(--ui-space-sm); }
.list-card-item__sub { font-size: 12px; color: var(--ui-text-muted); display: flex; align-items: center; gap: var(--ui-space-sm); }
.list-card-item__sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ui-border-strong); flex-shrink: 0; }
.list-card-item__row { display: flex; align-items: center; gap: var(--ui-space-sm); }
.list-card-item__label { font-size: 12px; color: var(--ui-text-muted); white-space: nowrap; }
.list-card-item__trail { display: flex; align-items: center; gap: var(--ui-space-sm); flex-shrink: 0; color: var(--ui-text-muted); }

/* ── Upload (v3.9) — 拖拽区 + 文件项 4 状态 ── */
.upload-zone { border: 1.5px dashed var(--ui-border-strong); border-radius: var(--ui-radius-lg); background: var(--ui-accent); padding: var(--ui-space-2xl) var(--ui-space-xl); display: flex; flex-direction: column; align-items: center; gap: var(--ui-space-sm); cursor: pointer; transition: border-color var(--ui-duration-fast), background var(--ui-duration-fast); text-align: center; }
.upload-zone:hover { border-color: var(--ui-color-primary); background: var(--ui-color-primary-subtle); }
.upload-zone--dragover { border-color: var(--ui-color-primary); background: var(--ui-color-primary-subtle); border-style: solid; }
.upload-zone__icon { width: 36px; height: 36px; border-radius: var(--ui-radius-md); background: var(--ui-bg-card); border: 1px solid var(--ui-border-default); display: flex; align-items: center; justify-content: center; color: var(--ui-color-primary); }
.upload-zone__icon [data-lucide] { width: 18px; height: 18px; }
.upload-zone__title { font-size: 14px; font-weight: 500; color: var(--ui-text-primary); }
.upload-zone__title strong { color: var(--ui-color-primary); }
.upload-zone__hint { font-size: 12px; color: var(--ui-text-muted); line-height: 1.6; }
.upload-list { display: flex; flex-direction: column; gap: var(--ui-space-sm); margin-top: var(--ui-space-md); }
.upload-item { display: flex; align-items: center; gap: var(--ui-space-sm); padding: var(--ui-space-sm) var(--ui-space-md); border: 1px solid var(--ui-border-default); border-radius: var(--ui-radius-md); background: var(--ui-bg-card); }
.upload-item__icon { width: 28px; height: 28px; border-radius: var(--ui-radius-sm); background: var(--ui-accent); display: flex; align-items: center; justify-content: center; color: var(--ui-text-muted); flex-shrink: 0; }
.upload-item__icon [data-lucide] { width: 14px; height: 14px; }
.upload-item__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.upload-item__name { font-size: 13px; color: var(--ui-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upload-item__meta { font-size: 11px; color: var(--ui-text-muted); display: flex; gap: 6px; align-items: center; font-family: var(--ui-font-mono); }
.upload-item__status { font-size: 11px; font-weight: 500; flex-shrink: 0; }
.upload-item--done { background: var(--ui-color-success-subtle); border-color: var(--ui-color-success); }
.upload-item--done .upload-item__icon { background: var(--ui-color-success); color: var(--ui-text-on-brand); }
.upload-item--done .upload-item__status { color: var(--ui-color-success); }
.upload-item--error { background: var(--ui-color-destructive-subtle); border-color: var(--ui-color-destructive); }
.upload-item--error .upload-item__icon { background: var(--ui-color-destructive); color: var(--ui-text-on-brand); }
.upload-item--error .upload-item__status { color: var(--ui-color-destructive); }
.upload-item__close { color: var(--ui-text-muted); padding: 4px; transition: color var(--ui-duration-fast); flex-shrink: 0; background: none; border: none; cursor: pointer; line-height: 0; }
.upload-item__close:hover { color: var(--ui-color-destructive); }
.upload-item__close [data-lucide] { width: 14px; height: 14px; }

/* ── Skeleton (v3.9) — 首次加载占位（用 shimmer 渐变还原内容形状）── */
@keyframes ds-skeleton-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.skeleton-bar, .skeleton-circle {
  background: linear-gradient(90deg, var(--ui-accent) 25%, var(--ui-bg-muted) 50%, var(--ui-accent) 75%);
  background-size: 200% 100%;
  animation: ds-skeleton-shimmer 1.6s ease-in-out infinite;
  border-radius: var(--ui-radius-sm);
}
.skeleton-bar { height: 12px; width: 100%; }
.skeleton-bar--sm { height: 10px; }
.skeleton-bar--lg { height: 24px; border-radius: var(--ui-radius-md); }
.skeleton-circle { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
.skeleton-circle--sm { width: 24px; height: 24px; }
.skeleton-row { display: flex; align-items: center; gap: var(--ui-space-base); padding: var(--ui-space-md) 0; border-bottom: 1px solid var(--ui-border-soft); }
.skeleton-row:last-child { border-bottom: none; }

/* ── I18nField (v3.10 L2 强制) — 多语言字段，Tabs 切换 + 圆点状态（无旗帜） ── */
@keyframes i18n-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.i18n-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.i18n-status-dot--done     { background: var(--ui-color-success); }
.i18n-status-dot--missing  { background: var(--ui-text-muted); opacity: 0.4; }
.i18n-status-dot--required { background: var(--ui-color-destructive); animation: i18n-pulse 1.5s ease-in-out infinite; }
.i18n-field { display: flex; flex-direction: column; gap: 6px; }
.i18n-field__tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--ui-accent); border-radius: var(--ui-radius-md); align-self: flex-start; max-width: 100%; flex-wrap: wrap; }
.i18n-field__tab { padding: 6px 14px; border-radius: var(--ui-radius-sm); font-size: 12px; font-weight: 500; color: var(--ui-text-muted); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: transparent; border: none; transition: background var(--ui-duration-fast), color var(--ui-duration-fast); white-space: nowrap; }
.i18n-field__tab:hover { color: var(--ui-text-primary); }
.i18n-field__tab.is-active { background: var(--ui-bg-card); color: var(--ui-text-primary); box-shadow: var(--ui-shadow-sm); }
.i18n-field__tab-name { font-weight: 500; }
.i18n-field__tab-required { font-size: 9px; color: var(--ui-color-destructive); font-weight: 700; letter-spacing: 0.04em; }
.i18n-field__progress { font-size: 11px; color: var(--ui-text-muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.i18n-field__progress [data-lucide] { width: 12px; height: 12px; color: var(--ui-color-success); }
.i18n-field__progress--has-missing { color: var(--ui-color-destructive); }
.i18n-field__progress--has-missing [data-lucide] { color: var(--ui-color-destructive); }

/* ── Form Modern (v3.10 L2 强制) — 所有 el-form 都必须用 .form-modern 包裹 ── */
.form-modern .el-form { display: flex; flex-direction: column; gap: var(--ui-space-md); }
.form-modern .el-form-item { display: block !important; margin-bottom: 24px; }
.form-modern .el-form-item__label {
  display: block !important;
  width: auto !important;
  text-align: left !important;
  padding: 0 0 6px !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  color: var(--ui-text-primary) !important;
  line-height: 1.4 !important;
}
.form-modern .el-form-item__content { margin-left: 0 !important; width: 100%; display: block !important; }
.form-modern .form-helper { display: block; font-size: 12px; color: var(--ui-text-muted); line-height: 1.5; margin-top: -4px; margin-bottom: 8px; }
.form-modern .el-input__wrapper,
.form-modern .el-select__wrapper,
.form-modern .el-textarea__inner {
  border-radius: 8px !important;
  transition: box-shadow var(--ui-duration-fast) var(--ui-ease-out) !important;
}
.form-modern .el-input__wrapper.is-focus,
.form-modern .el-select__wrapper.is-focused,
.form-modern .el-textarea__inner:focus {
  box-shadow: 0 0 0 1px var(--ui-color-primary) inset, 0 0 0 3px rgba(95, 78, 207, 0.15) !important;
}
.form-modern .el-form-item__error { display: inline-flex !important; align-items: center; gap: 4px; padding-top: 6px !important; font-size: 12px !important; }
.form-modern .el-form-item__error::before { content: '⚠'; font-size: 12px; margin-right: 2px; }

/* Form Group · 卡片化分组 */
.form-group { background: var(--ui-bg-card); border: 1px solid var(--ui-border-default); border-radius: var(--ui-radius-xl); padding: var(--ui-space-lg) var(--ui-space-xl); margin-bottom: var(--ui-space-lg); }
.form-group__head { display: flex; align-items: center; gap: 8px; padding-bottom: var(--ui-space-md); border-bottom: 1px solid var(--ui-border-soft); margin-bottom: var(--ui-space-base); }
.form-group__head [data-lucide] { width: 16px; height: 16px; color: var(--ui-color-primary); }
.form-group__title { font-size: 14px; font-weight: 600; color: var(--ui-text-primary); }
.form-group__hint { font-size: 12px; color: var(--ui-text-muted); margin-left: auto; }

/* Form actions · 提交区 */
.form-actions { display: flex; justify-content: flex-end; gap: var(--ui-space-sm); padding-top: var(--ui-space-md); margin-top: var(--ui-space-md); border-top: 1px solid var(--ui-border-soft); }

/* ── Radio · 4 variant (v3.10 L2，禁止 EP 默认，按数据特性选) ── */
/* .radio-circle · A 默认（圆环，90% 场景） */
.radio-circle { display: flex; flex-direction: column; gap: var(--ui-space-sm); }
.radio-circle__item { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; transition: color var(--ui-duration-fast); }
.radio-circle__item:hover { color: var(--ui-color-primary); }
.radio-circle__dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ui-border-interactive); background: var(--ui-bg-card); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color var(--ui-duration-fast); position: relative; }  /* v6.9.4 空心圈靠边框传达"可选"→ interactive ≥3:1 */
.radio-circle__dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ui-color-primary); opacity: 0; transform: scale(0.4); transition: opacity var(--ui-duration-fast) var(--ui-ease-out), transform var(--ui-duration-fast) var(--ui-ease-spring); }
.radio-circle__item:hover .radio-circle__dot { border-color: var(--ui-color-primary); }
.radio-circle__item.is-active .radio-circle__dot { border-color: var(--ui-color-primary); }
.radio-circle__item.is-active .radio-circle__dot::after { opacity: 1; transform: scale(1); }
.radio-circle__label { font-size: 14px; color: var(--ui-text-primary); line-height: 1.4; }

/* .radio-pill · B 药丸（横排紧凑） */
.radio-pill-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.radio-pill { padding: 7px 16px; border-radius: var(--ui-radius-pill); border: 1px solid var(--ui-border-interactive); background: var(--ui-bg-card); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ui-text-secondary); transition: background var(--ui-duration-fast), border-color var(--ui-duration-fast), color var(--ui-duration-fast); white-space: nowrap; }  /* v6.9.4 可点边界 → interactive ≥3:1 */
.radio-pill:hover { border-color: var(--ui-color-primary); color: var(--ui-text-primary); }
.radio-pill.is-active { background: var(--ui-color-primary-subtle); border-color: var(--ui-color-primary); color: var(--ui-color-primary); font-weight: 600; }

/* .radio-segmented · C 分段控制（iOS 风，2-4 互斥状态） */
.radio-segmented { display: inline-flex; padding: 3px; background: var(--ui-accent); border-radius: var(--ui-radius-md); }
.radio-segmented__item { padding: 7px 16px; border-radius: var(--ui-radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ui-text-muted); transition: background var(--ui-duration-fast), color var(--ui-duration-fast), box-shadow var(--ui-duration-fast); border: none; background: transparent; white-space: nowrap; }
.radio-segmented__item:hover { color: var(--ui-text-primary); }
.radio-segmented__item.is-active { background: var(--ui-bg-card); color: var(--ui-text-primary); box-shadow: var(--ui-shadow-sm); font-weight: 600; }

/* .radio-card · D Card Radio（含描述的关键决策） */
.radio-card-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--ui-space-sm); }
.radio-card { position: relative; padding: 12px 14px; border: 1px solid var(--ui-border-interactive); border-radius: var(--ui-radius-lg); background: var(--ui-bg-card); cursor: pointer; transition: border-color var(--ui-duration-fast), box-shadow var(--ui-duration-fast); }  /* v6.9.4 可点卡边界 → interactive ≥3:1 */
.radio-card:hover { border-color: var(--ui-color-primary); }
.radio-card.is-active { border-color: var(--ui-color-primary); box-shadow: 0 0 0 1px var(--ui-color-primary), 0 0 0 4px rgba(95, 78, 207, 0.12); }
.radio-card__dot { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ui-border-interactive); background: var(--ui-bg-card); transition: background var(--ui-duration-fast), border-color var(--ui-duration-fast), box-shadow var(--ui-duration-fast); }  /* v6.9.4 → interactive ≥3:1 */
.radio-card.is-active .radio-card__dot { background: var(--ui-color-primary); border-color: var(--ui-color-primary); box-shadow: inset 0 0 0 4px var(--ui-bg-card); }
.radio-card__name { font-size: 13px; font-weight: 600; color: var(--ui-text-primary); padding-right: 24px; line-height: 1.4; }
.radio-card__desc { font-size: 11px; color: var(--ui-text-muted); margin-top: 4px; line-height: 1.5; padding-right: 24px; }

/* v6.9.4: EP 原生 checkbox/radio 空心框靠边框传达"可选" → 用 border-interactive（≥3:1）。
   只改 unchecked 边框色，不动 checked/focus 态（那些走 primary）。inputs/table 仍用 --el-border-color。 */
.el-checkbox__inner,
.el-radio__inner { border-color: var(--ui-border-interactive); }

/* ────────────────────────────────────────────
 * Motion 动画库（v3.10）
 * keyframes + 6 preset class + stagger 延迟链
 * ──────────────────────────────────────────── */

@keyframes anim-fade-in        { from { opacity: 0; }                              to { opacity: 1; } }
@keyframes anim-fade-out       { from { opacity: 1; }                              to { opacity: 0; } }
@keyframes anim-slide-in-right { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes anim-slide-in-up    { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes anim-scale-in       { from { opacity: 0; transform: scale(0.96); }      to { opacity: 1; transform: scale(1); } }

.anim-fade-in        { animation: anim-fade-in        var(--ui-duration-base) var(--ui-ease-out)  both; }
.anim-fade-out       { animation: anim-fade-out       var(--ui-duration-base) var(--ui-ease-in)   both; }
.anim-slide-in-right { animation: anim-slide-in-right var(--ui-duration-slow) var(--ui-ease-out)  both; }
.anim-slide-in-up    { animation: anim-slide-in-up    var(--ui-duration-slow) var(--ui-ease-out)  both; }
.anim-scale-in       { animation: anim-scale-in       var(--ui-duration-base) var(--ui-ease-out)  both; }

/* stagger 延迟链：父加 .anim-stagger，子元素自动按顺序错峰淡入（30ms 间隔）*/
.anim-stagger > * { animation: anim-fade-in var(--ui-duration-base) var(--ui-ease-out) both; }
.anim-stagger > *:nth-child(1)  { animation-delay:   0ms; }
.anim-stagger > *:nth-child(2)  { animation-delay:  30ms; }
.anim-stagger > *:nth-child(3)  { animation-delay:  60ms; }
.anim-stagger > *:nth-child(4)  { animation-delay:  90ms; }
.anim-stagger > *:nth-child(5)  { animation-delay: 120ms; }
.anim-stagger > *:nth-child(6)  { animation-delay: 150ms; }
.anim-stagger > *:nth-child(7)  { animation-delay: 180ms; }
.anim-stagger > *:nth-child(8)  { animation-delay: 210ms; }
.anim-stagger > *:nth-child(9)  { animation-delay: 240ms; }
.anim-stagger > *:nth-child(10) { animation-delay: 270ms; }

/* 系统设置 prefers-reduced-motion 时关掉装饰动画（保留必要状态） */
@media (prefers-reduced-motion: reduce) {
  .anim-fade-in, .anim-fade-out, .anim-slide-in-right, .anim-slide-in-up,
  .anim-scale-in, .anim-stagger > * { animation: none !important; }
}

/* ──────────────────────────────────────────────────────────────────
   Dashboard Chapter (v6.9.1 引入 — Section + Filter + KPI 两档)
   ──────────────────────────────────────────────────────────────────
   适用范围：dashboard / overview / 监控大盘 类页型（决策树 ⑪ 触发）。
   构图规则由 active skill overlay 决定；本段只提供共享 runtime hooks
   字号契约：stat-card 复用 .type-kpi (28px) / ov-card 用 .type-hero-data (44px)
   外壳协调：.ds-section-header border-bottom 是分隔器，豁免 v6.7 外壳克制
   ────────────────────────────────────────────────────────────────── */

/* ── ds-section · dashboard 信息架构第一公民 ── */
.ds-section { display: flex; flex-direction: column; gap: var(--ui-space-card); }
.ds-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: var(--ui-space-control);
  border-bottom: 1px solid var(--ui-border-default);
}
.ds-section-header__l { display: flex; align-items: center; gap: var(--ui-space-inline); }
.ds-section-icon {
  width: 28px; height: 28px; border-radius: var(--ui-radius-control);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--ui-color-primary-subtle); color: var(--ui-color-primary);
  flex-shrink: 0;
}
.ds-section-icon i[data-lucide], .ds-section-icon svg { width: 15px; height: 15px; }
.ds-section-title  { color: var(--ui-text-primary); /* 字号复用 .type-h3；显式 color 防 dark 下 h2 继承拿到暗色（v6.9 实测修） */ }
.ds-section-pill {
  padding: 3px 9px; border-radius: var(--ui-radius-pill);
  background: var(--ui-bg-muted); color: var(--ui-text-muted);
  /* 复用 .type-caption（12px/500），class 体不写字号 */
}
.ds-section-header__r i[data-lucide], .ds-section-header__r svg {
  width: 14px; height: 14px; color: var(--ui-text-muted); cursor: pointer;
}

/* ── ds-filter-row · 4 列 KV-dropdown 风格（区别于横排 FilterBox） ── */
.ds-filter-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--ui-space-lg);
}
.ds-filter-col { display: flex; flex-direction: column; gap: 6px; }
.ds-filter-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--ui-text-muted);
}
.ds-filter-dropdown {
  display: flex; align-items: center; justify-content: space-between; gap: var(--ui-space-inline);
  padding: 8px 12px; border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-control); background: var(--ui-bg-card);
  color: var(--ui-text-primary); cursor: pointer; transition: border-color .15s;
}
.ds-filter-dropdown:hover { border-color: var(--ui-color-primary); }
.ds-filter-dropdown__l {
  display: flex; align-items: center; gap: var(--ui-space-inline);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ds-filter-dropdown__l i[data-lucide], .ds-filter-dropdown__l svg,
.ds-filter-dropdown > i[data-lucide], .ds-filter-dropdown > svg {
  width: 13px; height: 13px; color: var(--ui-text-muted); flex-shrink: 0;
}

/* ── ds-overview-grid / ds-stats-row · KPI grid 容器 ── */
.ds-overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--ui-space-card); }
.ds-stats-row     { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--ui-space-card); }

/* ── ds-stat-card · 小档 KPI（28px Mono · icon-pill · delta 三段式） ── */
.ds-stat-card {
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-card);
  padding: 20px 20px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.ds-stat-card__top { display: flex; align-items: flex-start; justify-content: space-between; }
.ds-stat-title { /* 复用 .type-caption；class 体不写字号 */ color: var(--ui-text-muted); }
.ds-stat-icon {
  width: 32px; height: 32px; border-radius: var(--ui-radius-lg);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--ui-color-primary-subtle); color: var(--ui-color-primary);
  flex-shrink: 0;
}
.ds-stat-icon i[data-lucide], .ds-stat-icon svg { width: 14px; height: 14px; }
.ds-stat-value { /* 复用 .type-kpi (28px Mono 700)，class 只 hook 色 */ color: var(--ui-text-primary); }
.ds-stat-delta {
  display: inline-flex; align-items: center; gap: 4px;
  /* 复用 .type-caption；class 体不写字号 */
}
.ds-stat-delta i[data-lucide], .ds-stat-delta svg { width: 12px; height: 12px; }
.ds-stat-delta__pct { font-weight: 600; }
.ds-stat-delta__vs { color: var(--ui-text-muted); font-weight: 500; }

/* ── ds-ov-card · 巨档 KPI（44px hero 数字 · 简 hint） ── */
.ds-ov-card {
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-card);
  padding: 18px 22px;
  display: flex; flex-direction: column; gap: 8px;
}
.ds-ov-card__top   { display: flex; align-items: center; justify-content: space-between; }
.ds-ov-card__top-l { display: flex; align-items: center; gap: var(--ui-space-inline); }
.ds-ov-dot {
  width: 24px; height: 24px; border-radius: var(--ui-radius-md);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ds-ov-dot i[data-lucide], .ds-ov-dot svg { width: 13px; height: 13px; }
.ds-ov-dot--success { background: var(--ui-color-success-subtle); color: var(--ui-color-success); }
.ds-ov-dot--danger  { background: var(--ui-color-destructive-subtle); color: var(--ui-color-destructive); }
.ds-ov-dot--primary { background: var(--ui-color-primary-subtle); color: var(--ui-color-primary); }
.ds-ov-title { color: var(--ui-text-muted); /* 复用 .type-body-sm */ }
.ds-ov-stat-tag {
  padding: 2px 8px; border-radius: var(--ui-radius-pill);
  background: var(--ui-bg-muted); color: var(--ui-text-muted);
  font-size: 10px; font-weight: 500;
}
.ds-ov-value { /* 复用 .type-hero-data (44px Mono 700)，class 只 hook 色 */ }
.ds-ov-value--success { color: var(--ui-color-success); }
.ds-ov-value--danger  { color: var(--ui-color-destructive); }
.ds-ov-value--primary { color: var(--ui-color-primary); }
.ds-ov-hint { color: var(--ui-text-muted); /* 复用 .type-caption */ }

/* ── ds-chart-card · 图表卡 chrome（v6.9 · title + type/size badge + refresh） ── */
.ds-chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--ui-space-card); }
.ds-chart-card {
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-card);
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
}
.ds-chart-header   { display: flex; align-items: center; justify-content: space-between; gap: var(--ui-space-inline); }
.ds-chart-header__l { display: flex; align-items: center; gap: var(--ui-space-inline); flex-wrap: wrap; min-width: 0; }
.ds-chart-title    { font-weight: 600; color: var(--ui-text-primary); /* 字号复用 .type-body-sm（markup 加 class） */ }
.ds-chart-refresh {
  width: 13px; height: 13px; color: var(--ui-text-muted);
  cursor: pointer; flex-shrink: 0;
}
.ds-chart-refresh:hover { color: var(--ui-text-primary); }

/* type-badge：chart 类型标记（"Time series"/"Gauge"/"Stat"，≈ .tag 的 dashboard 特化 + 圆点） */
.ds-type-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: var(--ui-radius-pill);
  background: var(--ui-bg-muted); color: var(--ui-text-muted);
  font-size: 10px; font-weight: 500; white-space: nowrap;
}
.ds-type-badge::before {
  content: ""; width: 5px; height: 5px; border-radius: var(--ui-radius-pill);
  background: currentColor; opacity: .7;
}
/* size-badge：Grafana 栅格尺寸标记（"12 x 8"，Mono 蓝底） */
.ds-size-badge {
  padding: 2px 7px; border-radius: var(--ui-radius-pill);
  background: var(--ui-badge-blue-bg); color: var(--ui-badge-blue-fg);
  font-family: var(--ui-font-mono); font-size: 10px; font-weight: 500; white-space: nowrap;
}

/* ── ds-chart-body · 通用图表内部骨架（y-axis 左 / plot 中 / x-axis 下 / legend 底） ── */
.ds-chart-body { display: flex; gap: var(--ui-space-inline); flex: 1; min-height: 180px; }
.ds-y-axis {
  width: 50px; flex-shrink: 0;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
  padding-right: 4px;
  font-family: var(--ui-font-mono); font-size: 10px; color: var(--ui-text-muted);
}
.ds-plot {
  flex: 1; position: relative; min-width: 0;
  border-left: 1px solid var(--ui-border-default);
  border-bottom: 1px solid var(--ui-border-default);
  overflow: hidden;
}
.ds-plot svg { width: 100%; height: 100%; position: absolute; inset: 0; display: block; }
.ds-plot-grid-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--ui-border-default); opacity: .4; }
.ds-x-axis {
  display: flex; justify-content: space-between; padding-left: 58px;
  font-family: var(--ui-font-mono); font-size: 10px; color: var(--ui-text-muted);
}
.ds-legend-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--ui-space-inline); }
.ds-legend  { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ds-leg-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ui-text-muted); }
.ds-leg-dot    { width: 7px; height: 7px; border-radius: var(--ui-radius-pill); flex-shrink: 0; }
.ds-leg-square { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
/* pag：chart 多组数据分页（Grafana "1/10"） */
.ds-pag { display: inline-flex; align-items: center; gap: var(--ui-space-inline); }
.ds-pag i[data-lucide], .ds-pag svg { width: 12px; height: 12px; color: var(--ui-text-muted); cursor: pointer; }
.ds-pag__num { font-family: var(--ui-font-mono); font-size: 10px; font-weight: 500; color: var(--ui-text-muted); }

/* ── ds-bar · 纯 CSS 柱状图（单色 alpha 渐变档表达排序，无需 SVG） ── */
.ds-bar-body { display: flex; gap: var(--ui-space-inline); min-height: 180px; align-items: stretch; }
.ds-bar-area { flex: 1; display: flex; align-items: flex-end; gap: var(--ui-space-inline); padding: 0 4px; min-width: 0; }
.ds-bar-col  { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.ds-bar-val  { font-family: var(--ui-font-mono); font-size: 9px; font-weight: 600; color: var(--ui-text-muted); }
.ds-bar-rect { width: 28px; max-width: 80%; border-radius: 4px 4px 0 0; background: var(--ui-color-primary); }
.ds-bar-x-axis { display: flex; gap: var(--ui-space-inline); padding-left: 58px; }
.ds-bar-x-label { flex: 1; text-align: center; font-size: 10px; font-weight: 500; color: var(--ui-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── ds-donut · 环形占比（stroke-dasharray on circle，r=56 周长≈351.86） ── */
.ds-donut-body { display: flex; align-items: center; gap: var(--ui-space-card); }
.ds-donut-svg  { width: 160px; height: 160px; flex-shrink: 0; position: relative; }
.ds-donut-svg svg { width: 100%; height: 100%; display: block; }
.ds-donut-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: none;
}
.ds-donut-center__num   { font-family: var(--ui-font-mono); font-size: 22px; font-weight: 700; color: var(--ui-text-primary); font-variant-numeric: tabular-nums; }
.ds-donut-center__label { font-size: 11px; font-weight: 500; color: var(--ui-text-muted); }
.ds-donut-legend { flex: 1; display: flex; flex-direction: column; gap: var(--ui-space-control); min-width: 0; }
.ds-donut-legend__item { display: flex; align-items: center; gap: var(--ui-space-inline); }
.ds-donut-legend__text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ds-donut-legend__label { font-size: 11px; font-weight: 500; color: var(--ui-text-primary); }
.ds-donut-legend__val   { font-family: var(--ui-font-mono); font-size: 11px; font-weight: 700; color: var(--ui-text-muted); }

/* ── ds-gauge · 270° 弧仪表（弧心 (50,50) r=40 · 指针 pivot (50,70)，几何见 dashboard.md 查表） ── */
.ds-gauges-wrap { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--ui-space-inline); flex: 1; align-items: center; justify-items: center; }
.ds-gauge { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
.ds-gauge-svg { width: 100%; max-width: 140px; aspect-ratio: 10 / 9; height: auto; }
.ds-gauge-svg svg { width: 100%; height: 100%; display: block; }
.ds-gauge-value { font-family: var(--ui-font-mono); font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.ds-gauge-value--success { color: var(--ui-color-success); }
.ds-gauge-value--action { color: var(--ui-color-action); }
.ds-gauge-value--danger  { color: var(--ui-color-destructive); }
.ds-gauge-label { font-size: 11px; font-weight: 500; color: var(--ui-text-muted); text-align: center; }

/* empty-gauge：图表级空态（离线/无数据 → 虚化弧 + 灰针 + caption；区别于整块 EmptyState） */
.ds-empty-gauge { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--ui-space-inline); flex: 1; min-height: 160px; }
.ds-empty-gauge .ds-gauge-svg { opacity: .6; max-width: 160px; }
.ds-empty-dash { width: 18px; height: 2px; background: var(--ui-text-muted); opacity: .6; border-radius: var(--ui-radius-pill); }
.ds-empty-caption { font-size: 11px; font-weight: 500; color: var(--ui-text-muted); text-align: center; }

/* ── ds-detail-row · 阈值停留 KV 行（语义底色，"Duration over 80%: 35s"） ── */
.ds-detail-rows { display: flex; flex-direction: column; gap: var(--ui-space-inline); flex: 1; justify-content: center; }
.ds-detail-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: var(--ui-radius-control);
}
.ds-detail-row--action { background: var(--ui-color-action-subtle); color: var(--ui-color-action); }
.ds-detail-row--success { background: var(--ui-color-success-subtle); color: var(--ui-color-success); }
.ds-detail-row--danger  { background: var(--ui-color-destructive-subtle); color: var(--ui-color-destructive); }
.ds-detail-row__label { font-size: 12px; font-weight: 500; }
.ds-detail-row__val   { font-family: var(--ui-font-mono); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ── 响应式：dashboard 不强求 1280 以上不裂 ── */
@media (max-width: 1100px) {
  .ds-filter-row    { grid-template-columns: repeat(2, 1fr); }
  .ds-overview-grid { grid-template-columns: repeat(2, 1fr); }
  .ds-stats-row     { grid-template-columns: repeat(2, 1fr); }
  .ds-chart-grid    { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .ds-filter-row    { grid-template-columns: 1fr; }
  .ds-overview-grid { grid-template-columns: 1fr; }
  .ds-stats-row     { grid-template-columns: 1fr; }
  .ds-ov-card       { padding: 16px 18px; }
  .ds-donut-body    { flex-direction: column; }
  .ds-gauges-wrap   { grid-template-columns: 1fr; }
  .ds-x-axis, .ds-bar-x-axis { padding-left: 0; }
}

/* AGIONE_EDIT_BUSINESS_CSS_START · 业务 CSS 只能写在这里，禁止写入 Vue runtime template */
:root {
  --ui-drawer-compact: min(680px, calc(100vw - 48px));
  --ui-drawer-standard: min(800px, calc(100vw - 48px));
  --ui-drawer-wide: min(960px, calc(100vw - 320px));
  --ui-drawer-workspace: min(1120px, calc(100vw - 320px));
}

.cloud-account-page {
  min-height: 100%;
}

.cloud-account-filter {
  display: flex;
  align-items: center;
  gap: var(--ui-space-sm);
  flex-wrap: wrap;
}

.cloud-account-filter .el-input { width: 240px; }
.cloud-account-filter .el-select { width: 176px; }

.cloud-account-cell {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.cloud-account-cell__name {
  color: var(--ui-text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cloud-account-cell__meta,
.health-dimension,
.inspection-time {
  color: var(--ui-text-secondary);
}

.health-dimension {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.health-dimension svg { width: 14px; height: 14px; }
.health-dimension.is-pass { color: var(--ui-color-success); }
.health-dimension.is-action { color: var(--ui-color-action); }
.health-dimension.is-error { color: var(--ui-color-destructive); }
.health-dimension.is-unknown { color: var(--ui-text-muted); }

.account-health-stack {
  display: grid;
  justify-items: start;
  gap: 4px;
}

.account-health-stack__current,
.check-conclusion__history {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.account-health-stack__current {
  min-height: 24px;
}

.account-health-stack__current > .type-caption,
.check-conclusion__current-label {
  color: var(--ui-text-secondary);
}

.account-health-stack__previous,
.check-conclusion__context {
  color: var(--ui-text-muted);
}

.check-conclusion__current {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
}

.check-conclusion__current-value {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--ui-color-action);
}

.check-conclusion__current-icon {
  width: 14px;
  height: 14px;
  flex: 0 0 14px;
}

.check-conclusion {
  display: grid;
  justify-items: start;
  gap: 4px;
  min-width: 0;
}

.check-conclusion__summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ui-text-primary);
  text-align: left;
}

.check-conclusion__info-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
